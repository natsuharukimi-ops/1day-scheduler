<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>1day scheduler</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1day">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%3E%3Crect%20width='180'%20height='180'%20rx='36'%20fill='%232563eb'/%3E%3Ctext%20x='90'%20y='120'%20font-size='84'%20font-family='-apple-system,Helvetica,Arial,sans-serif'%20font-weight='700'%20fill='%23ffffff'%20text-anchor='middle'%3E1D%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8;
    --bg-elevated: #ffffff;
    /* タイトルバー+日付ナビ/バナー用の専用色。--bg-elevatedと同じにすると
       タスクの箱(同じく--bg-elevated)と見分けが付きにくいという指摘を
       受けたため、どちらとも違う寒色寄りのトーンにしている。 */
    --header-bg: #e7ecf5;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --border: #e2e4e9;
    --accent: #2563eb;
    --accent-contrast: #ffffff;
    --danger: #dc2626;
    --tab-inactive: #6b7280;
    --radius: 14px;
    --heat-0: #e5e7eb;
    --heat-1: #bfdbfe;
    --heat-2: #93c5fd;
    --heat-3: #60a5fa;
    --heat-4: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --bg-elevated: #171b22;
      --header-bg: #182236;
      --text: #e7e9ec;
      --text-muted: #9aa1ab;
      --border: #2a2f38;
      --accent: #4f8bff;
      --accent-contrast: #0b1220;
      --danger: #f87171;
      --tab-inactive: #8890a0;
      --heat-0: #1f2530;
      --heat-1: #1e3a5f;
      --heat-2: #2f5d8a;
      --heat-3: #3f7cc2;
      --heat-4: #4f8bff;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top));
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .app-header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .header-streak { font-size: 14px; color: var(--accent); }
  .icon-btn {
    border: none; background: transparent; font-size: 20px; padding: 8px; line-height: 1;
    cursor: pointer; border-radius: 10px; min-width: 44px; min-height: 44px;
  }
  .icon-btn:active { background: var(--border); }
  .icon-btn.danger { color: var(--danger); }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .icon-btn:disabled:active { background: transparent; }
  /* 絵文字ではない記号だけのグリフ(◀▶↶↷等)は、透明背景+グリフの線の
     太さだけに視認性を頼るとライト/ダーク双方で見づらくなる(日付ナビの
     ◀▶📅→.date-nav-btn、設定の閉じるボタン→.modal-close-btnで既に
     同じ指摘を受けて対応済み。新しく記号グリフのアイコンボタンを追加する
     時は必ずこのクラスを付けて背景+枠線付きの円で囲むこと)。 */
  .glyph-icon-btn {
    background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text);
    border-radius: 50%;
  }
  .glyph-icon-btn:active { background: var(--border); }

  main { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 24px; -webkit-overflow-scrolling: touch; }

  .tabbar {
    display: flex; background: var(--bg-elevated); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0;
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 0 10px; border: none; background: transparent; color: var(--tab-inactive);
    font-size: 11px; cursor: pointer; min-height: 52px;
  }
  .tab-btn .tab-icon { font-size: 22px; }
  .tab-btn.active { color: var(--accent); font-weight: 600; }

  .view { display: none; }
  .view.active { display: block; }

  .time-row { display: flex; align-items: center; gap: 8px; }
  .time-row input { flex: 1; min-width: 0; }

  .btn {
    font-size: 15px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg-elevated); color: var(--text); cursor: pointer; min-height: 44px;
  }
  .btn.primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); font-weight: 600; }
  .btn.danger-outline { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty-hint { color: var(--text-muted); font-size: 14px; padding: 16px 0; text-align: center; list-style: none; }

  /* margin-topで先頭(00:00)の時刻ラベル(-8px上にオフセットして表示される)
     のための余白を確保する(以前はヘッダーのすぐ下で見切れていた)。
     絶対配置された子要素の座標原点は「padding edge」であり、これは
     border直下の固定位置でpaddingの太さ自体には左右されない(paddingを
     足しても中身がずれるだけで子要素の原点はずれない)。そのため
     padding-topでは効かず、要素自体を通常フローで押し下げるmargin-topを
     使う必要がある(実際に試してpadding-topでは見切れが直らなかった)。 */
  .timeline-wrap { position: relative; margin: 12px 0 24px; }
  .timeline-hour-row { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); }
  .timeline-hour-label {
    position: absolute; left: 0; top: -8px; font-size: 11px; color: var(--text-muted);
    background: var(--bg); padding-right: 4px;
  }
  .timeline-now-line { position: absolute; left: 44px; right: 0; height: 2px; background: var(--danger); z-index: 5; }
  .timeline-task {
    position: absolute; left: 48px; right: 8px; overflow: hidden;
    background: var(--bg-elevated); border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 8px; padding: 2px 8px; cursor: grab;
    touch-action: none; /* ドラッグ操作をブラウザの既定スクロールと競合させない */
  }
  .timeline-task.done { opacity: 0.55; }
  .timeline-task.dragging { z-index: 20; box-shadow: 0 4px 16px rgba(0,0,0,0.35); opacity: 0.95; cursor: grabbing; }
  /* チェックボックス(左上)・✏️(右上、showFullの時)と重ならないよう
     左右をインセットする。よくあるサイズ変更カーソル(ns-resize)を
     常時表示し、掴める場所であることが見た目でも分かるようにする。 */
  /* heightはCSSで固定せず、DRAG_EDGE_ZONE_PXを使ってrenderTimelineHtml側で
     インラインstyleとして指定する(JSの定数とCSSが別々の値を持つと
     ここだけ変更漏れが起きる。実際に定数を変えても見た目の判定領域が
     変わらないというバグがあった)。 */
  .timeline-resize-handle {
    position: absolute; left: 26px; right: 34px; cursor: ns-resize; z-index: 3;
  }
  .timeline-resize-handle.top { top: 0; }
  .timeline-resize-handle.bottom { bottom: 0; }
  .drag-time-tooltip {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
    background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600;
    padding: 4px 10px; border-radius: 8px; pointer-events: none; display: none; white-space: nowrap;
  }
  .timeline-check { position: absolute; top: 2px; left: 2px; z-index: 2; }
  .timeline-check input { width: 18px; height: 18px; }
  .timeline-task-body { padding-left: 22px; }
  .timeline-task-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .timeline-task-title.compact { font-size: 12px; }
  .timeline-task-title.done { text-decoration: line-through; color: var(--text-muted); }
  .timeline-task-meta { font-size: 11px; color: var(--text-muted); }
  .timeline-edit-btn { position: absolute; top: 0; right: 0; font-size: 14px; min-width: 28px; min-height: 28px; padding: 4px; }
  .timeline-task.expanded { box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  /* 位置は動かさない方針(閉じるボタン優先)。展開中に同時表示される
     下端リサイズハンドルの方をこのボタンの右側だけ避けるようにしている
     (timelineTaskBoxHtmlのresizeHandles参照)。 */
  .timeline-collapse-btn {
    position: absolute; bottom: 3px; right: 3px; font-size: 11px; height: 22px; padding: 0 8px;
    background: var(--border); border: none; border-radius: 999px; color: var(--text); min-height: 0;
  }
  .timeline-expand-hint {
    position: absolute; bottom: 1px; right: 4px; font-size: 12px; color: var(--text-muted); line-height: 1;
  }
  .timeline-add-fab {
    position: fixed; right: 20px; bottom: calc(76px + env(safe-area-inset-bottom));
    width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--accent);
    color: var(--accent-contrast); font-size: 26px; line-height: 1; cursor: pointer; z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .focus-select-row { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .focus-task-detail {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; margin-bottom: 16px;
  }
  .focus-task-detail-title { font-size: 16px; font-weight: 600; }
  .focus-task-detail-title.done { text-decoration: line-through; color: var(--text-muted); }
  .focus-task-detail-meta { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .focus-select-row select {
    flex: 1; min-width: 0; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg-elevated); color: var(--text);
  }
  .timer-card {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 32px 16px; text-align: center;
  }
  .timer-phase { font-size: 15px; color: var(--text-muted); margin-bottom: 8px; }
  .timer-display { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
  .timer-progress { font-size: 14px; color: var(--text-muted); margin-top: 8px; }
  .timer-controls { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  .timer-hint { font-size: 12px; color: var(--text-muted); margin-top: 12px; }

  .streak-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .streak-box {
    flex: 1; background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 8px; text-align: center;
  }
  .streak-value { font-size: 24px; font-weight: 700; color: var(--accent); }
  .streak-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .today-table {
    width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px;
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  }
  .today-table th, .today-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  .today-table th { color: var(--text-muted); font-weight: 600; font-size: 12px; }

  .heatmap-title { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
  .heatmap-grid { display: grid; grid-template-columns: repeat(7, 20px); grid-auto-rows: 20px; gap: 4px; }
  .heat-cell { width: 20px; height: 20px; border-radius: 4px; cursor: pointer; }
  .heat-cell.level-0 { background: var(--heat-0); }
  .heat-cell.level-1 { background: var(--heat-1); }
  .heat-cell.level-2 { background: var(--heat-2); }
  .heat-cell.level-3 { background: var(--heat-3); }
  .heat-cell.level-4 { background: var(--heat-4); }
  .heatmap-detail { font-size: 13px; color: var(--text-muted); margin-top: 8px; min-height: 18px; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .modal.hidden { display: none; }
  .modal-card {
    background: var(--bg-elevated); width: 100%; max-width: 480px; border-radius: 16px;
    padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto;
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .modal-header h2 { margin: 0; font-size: 17px; }
  .modal-close-btn {
    background: var(--border); font-size: 22px; min-width: 40px; min-height: 40px; border-radius: 50%;
  }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-size: 14px; color: var(--text-muted); }
  .field input[type="number"], .field input[type="text"], .field select {
    font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
  }
  .field input[type="file"] { font-size: 14px; }
  .field input:disabled { opacity: 0.55; }
  hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  .header-actions { display: flex; gap: 2px; }

  .chip-row { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; -webkit-overflow-scrolling: touch; }
  .chip {
    flex-shrink: 0; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .chip.selected { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .chip.static { cursor: default; font-size: 11px; padding: 3px 9px; }
  .chip-hint { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .task-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; margin-bottom: 3px; }

  .date-nav { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
  .date-nav .date-label { flex: 1; text-align: center; font-size: 15px; color: var(--text-muted); }
  .date-nav .today-jump { font-size: 12px; color: var(--accent); background: transparent; border: none; cursor: pointer; padding: 6px; }
  .date-nav-btn {
    background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text);
    border-radius: 50%; font-size: 15px;
  }
  .date-nav-btn:active { background: var(--border); }
  .date-nav .today-jump:disabled { opacity: 0.35; cursor: default; }

  .now-banner {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 12px; margin-bottom: 8px; font-size: 14px;
  }
  .now-banner.active { border-left: 4px solid var(--accent); cursor: pointer; }

  /* mainのpadding(16px)ぶんを負のマージンで打ち消し、position:stickyが
     ビューポート最上端(main内)にぴったり付くようにする。自身にpaddingを
     足して見た目上の余白は復元する(marginは-16pxのままmainのpaddingと
     一致させる必要があるが、paddingは見た目の詰まり具合を決めるだけなので
     独立して小さくできる。「もう少しスマートに」という指摘を受けて
     上下方向を詰めた)。背景は最初var(--bg)(ページ全体と同じ)、次に
     var(--bg-elevated)(タスクの箱と同じ)を試したがどちらも「境界が
     分かりづらい」という指摘が続いた。var(--bg-elevated)はタスクの箱
     (.timeline-task)や.now-banner自身も使っている色のため、スクロールで
     箱がヘッダーのすぐ下まで来ると特に見分けが付きにくかった。専用の
     var(--header-bg)(タスクの箱の色とは別トーン)に変え、.app-headerと
     揃えることでヘッダー全体(タイトルバー+日付ナビ+バナー)を一続きの
     「浮いている面」として見せている。 */
  .today-sticky-header {
    position: sticky; top: -16px; z-index: 15;
    margin: -16px -16px 0; padding: 10px 16px 6px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
  }

  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
  .calendar-weekday { text-align: center; font-size: 11px; color: var(--text-muted); }
  .calendar-cell {
    position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 10px; font-size: 14px; cursor: pointer; background: var(--bg);
  }
  .calendar-cell.empty { visibility: hidden; cursor: default; }
  .calendar-cell.is-today { box-shadow: inset 0 0 0 2px var(--accent); }
  .calendar-cell.is-selected { background: var(--accent); color: var(--accent-contrast); }
  .calendar-cell.has-tasks::after {
    content: ""; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent);
  }
  .calendar-cell.is-selected.has-tasks::after { background: var(--accent-contrast); }
  .calendar-nav { display: flex; align-items: center; justify-content: space-between; }
  .calendar-nav .month-label { font-size: 15px; font-weight: 600; }

  .tag-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: 14px; gap: 8px; }
  .tag-row:last-child { border-bottom: none; }
  .tag-tree-prefix {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--text-muted); white-space: pre;
  }
  .tag-virtual-label { color: var(--text-muted); font-style: italic; }
  .tag-stale-badge {
    font-size: 11px; color: var(--text-muted); margin-left: 6px; font-weight: normal;
    background: var(--border); border-radius: 999px; padding: 2px 7px; white-space: nowrap;
  }
  .tag-agg-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px; font-size: 13px; border-bottom: 1px solid var(--border); }
  .tag-agg-row:last-child { border-bottom: none; }

  .archive-note { font-size: 12px; color: var(--text-muted); margin-top: 10px; text-align: center; }
  .all-time-row {
    font-size: 13px; color: var(--text-muted); text-align: center; padding: 10px;
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
  }
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1>1day scheduler <span id="headerStreak" class="header-streak"></span></h1>
    <div class="header-actions">
      <button class="icon-btn glyph-icon-btn" id="undoBtn" data-action="task:undo" aria-label="元に戻す">↶</button>
      <button class="icon-btn glyph-icon-btn" id="redoBtn" data-action="task:redo" aria-label="やり直す">↷</button>
      <button class="icon-btn" data-action="tags:open" aria-label="タグ管理">🏷️</button>
      <button class="icon-btn" data-action="settings-open" aria-label="設定">⚙️</button>
    </div>
  </header>

  <main>
    <section class="view active" data-view="today" id="todayView"></section>
    <section class="view" data-view="focus" id="focusView"></section>
    <section class="view" data-view="stats" id="statsView"></section>
  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-action="tab" data-tab="today">
      <span class="tab-icon">📋</span><span class="tab-label">予定</span>
    </button>
    <button class="tab-btn" data-action="tab" data-tab="focus">
      <span class="tab-icon">⏱</span><span class="tab-label">集中</span>
    </button>
    <button class="tab-btn" data-action="tab" data-tab="stats">
      <span class="tab-icon">📊</span><span class="tab-label">実績</span>
    </button>
  </nav>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2>設定</h2>
        <button class="icon-btn modal-close-btn" data-action="settings-close" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>集中(ポモドーロ)の長さ(分)</span>
          <input type="number" id="settingsFocusMinutes" min="5" max="90">
        </label>
        <label class="field">
          <span>休憩の長さ(分)</span>
          <input type="number" id="settingsBreakMinutes" min="1" max="30">
        </label>
        <label class="field">
          <span>継続日カウントの閾値(この数以上タスクを完了した日を継続日とする)</span>
          <input type="number" id="settingsStreakThreshold" min="1" max="20">
        </label>

<script>
// ==== 1. 定数・設定値 ====
const STORAGE_KEY = "1ds:state";
const SCHEMA_VERSION = 5;
const DEFAULT_SETTINGS = { focusMinutes: 25, breakMinutes: 5, streakThreshold: 1 };
const TITLE_HISTORY_MAX_AGE_DAYS = 180;
const DAY_DETAIL_RETENTION_MONTHS = 6;
const TAG_STALE_AFTER_DAYS = 60;
const PX_PER_MIN = 1.2; // タイムラインの縮尺(72px/時間)
// 「フル表示」の基準高さ = 1時間ぶんの自然な高さ。1時間のタスクなら
// タイトル+時刻/実績+タグ1行が収まるようこの縮尺にしている。これ未満の
// 短いタスクは簡易表示になり、タップで一時的にこの高さまで展開できる。
const FULL_CONTENT_PX = 60 * PX_PER_MIN;
const TIMELINE_SNAP_MIN = 15; // 空白タップでの新規作成の時刻スナップ単位
const DEFAULT_NEW_TASK_MINUTES = 60; // 新規タスク作成時の既定所要時間
// 上端/下端リサイズのつかみ判定領域(タイムラインの箱・ドラッグ処理の両方から
// 参照)。移動用の領域を広く取りたいという指摘を受け、12px→9px→6pxの順に
// 狭めてきた(9pxでもまだ「30分タスクの高さの1/3くらいに見える」との
// 指摘があったため)。
const DRAG_EDGE_ZONE_PX = 6;
// 上端+下端のつかみ判定領域(DRAG_EDGE_ZONE_PX×2)に加えて、移動用に最低
// 限の余白(12px)を残せる高さが無いと、短い箱では上下のリサイズ判定が
// 重なり合い移動の判定領域が消えてしまう(実際に指摘を受けたバグ)。
// この高さ未満の箱ではリサイズ用のつかみ領域自体を描画しない(箱全体が
// 移動用になる)。
const MIN_RESIZE_BOX_PX = DRAG_EDGE_ZONE_PX * 2 + 12;

// ==== 2. 日付・ID・小さな純粋ユーティリティ ====
function pad2(n) { return String(n).padStart(2, "0"); }

// Date.toISOString()はUTC基準のため日本時間では日付がズレる(深夜0〜8時台に前日扱いになる)。
// 必ずローカルのgetter経由で組み立てる。
function todayKey(d = new Date()) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function addDays(dayKey, n) {
  const [y, m, d] = dayKey.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + n);
  return todayKey(dt);
}
function genId() {
  // crypto.randomUUID()はsecure context要求でfile://での可用性が不透明なため自前生成にする。
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function toMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}
// 開始・終了時刻は常にTIMELINE_SNAP_MIN(15分)刻みに揃える。<input type="time">
// のstep="900"はSafari/iOSのホイールピッカーでは効くが、手入力やブラウザに
// よっては素通りすることがあるため、保存時にも必ずここでスナップし直す
// (UIのヒントだけに頼らない防御的な最終チェック)。
function snapMinutesToGrid(min) {
  return Math.round(min / TIMELINE_SNAP_MIN) * TIMELINE_SNAP_MIN;
}
function formatDuration(min) {
  if (min < 60) return `${min}分`;
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h}時間${m}分` : `${h}時間`;
}
function formatMMSS(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60), s = total % 60;
  return `${pad2(m)}:${pad2(s)}`;
}
function formatJapaneseDate(d) {
  const days = ["日", "月", "火", "水", "木", "金", "土"];
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${days[d.getDay()]})`;
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

// ==== 3. ストレージ層 ====
function defaultState() {
  return {
    schemaVersion: SCHEMA_VERSION,
    settings: { ...DEFAULT_SETTINGS },
    days: {},
    streak: { current: 0, longest: 0, lastAchievedDay: null },
    activeSession: null,
    pausedSessions: {}, // taskId -> {kind, pausedRemainingMs}。一時停止中に他タスクへ切り替えた際の退避先
    lastOpenedDay: todayKey(),
    tags: [],
    taskTitleStats: {},
    archive: { monthlySummaries: {} },
  };
}
function ensureDay(state, dayKey) {
  if (!state.days[dayKey]) state.days[dayKey] = { tasks: [], finalized: false };
  return state.days[dayKey];
}
function migrateState(raw) {
  if (!raw || typeof raw !== "object") return defaultState();
  const state = defaultState();
  state.settings = { ...DEFAULT_SETTINGS, ...(raw.settings || {}) };
  state.days = raw.days && typeof raw.days === "object" ? raw.days : {};
  // 旧データ(schemaVersion 1)のtaskにはtagsが無いため補う。
  for (const dayKey in state.days) {
    const entry = state.days[dayKey];
    if (Array.isArray(entry.tasks)) {
      entry.tasks = entry.tasks.map(t => ({ ...t, tags: Array.isArray(t.tags) ? t.tags : [] }));
    }
  }
  state.streak = { current: 0, longest: 0, lastAchievedDay: null, ...(raw.streak || {}) };
  state.activeSession = raw.activeSession || null;
  // dayKeyの無い旧データ(このフィールド追加以前に保存されたactiveSession)は
  // 起動時点の実際の今日を採用する。ほとんどの場合はそれで正しく、日を
  // 跨いで残っていた極めて稀なケースだけ従来通り復元できない(元々このフィールドが
  // 無い時点で日跨ぎは考慮されていなかったため、退行にはならない)。
  if (state.activeSession && !state.activeSession.dayKey) state.activeSession.dayKey = todayKey();
  state.pausedSessions = raw.pausedSessions && typeof raw.pausedSessions === "object" ? raw.pausedSessions : {};
  for (const tid in state.pausedSessions) {
    if (!state.pausedSessions[tid].dayKey) state.pausedSessions[tid].dayKey = todayKey();
  }
  state.lastOpenedDay = raw.lastOpenedDay || todayKey();
  state.tags = Array.isArray(raw.tags) ? raw.tags : [];
  state.taskTitleStats = raw.taskTitleStats && typeof raw.taskTitleStats === "object" ? raw.taskTitleStats : {};
  state.archive = raw.archive && typeof raw.archive === "object" ? raw.archive : { monthlySummaries: {} };
  state.archive.monthlySummaries = state.archive.monthlySummaries && typeof state.archive.monthlySummaries === "object"
    ? state.archive.monthlySummaries : {};
  return state;
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    return migrateState(JSON.parse(raw));
  } catch (e) {
    console.error("loadState failed", e);
    return defaultState();
  }
}
function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error("saveState failed", e);
    alert("保存に失敗しました。ストレージの空き容量を確認してください。");
  }
}
function exportStateAsJson(state) {
  return JSON.stringify(state, null, 2);
}
function importStateFromJson(text) {
  return migrateState(JSON.parse(text));
}

// ==== 4. ドメインロジック ====
// 1ポモドーロ「ラウンド」=集中+休憩の合計分数(既定25+5=30分)。実際に
// タイムライン上で1ラウンドぶん確保するには休憩時間も含めた枠が必要な
// ため、計画ポモドーロ数はこの合計で割る(集中時間だけで割ると、休憩の
// 分だけ実際には収まらない数になってしまう)。新規タスク作成時の既定
// 所要時間にも同じ値を使う。
function pomodoroRoundMinutes(settings) {
  return settings.focusMinutes + settings.breakMinutes;
}
function computePlannedPomodoros(startTime, endTime, roundMinutes) {
  const minutes = toMinutes(endTime) - toMinutes(startTime);
  if (minutes <= 0) return null; // 日またぎタスクはv1では非対応
  return { plannedMinutes: minutes, plannedPomodoros: Math.max(1, Math.ceil(minutes / roundMinutes)) };
}
// 半開区間判定: ちょうど隣接する時間帯(例: 09:00-10:00と10:00-11:00)は
// 重なり無しとして許可する。タイムライン上でタスクの重なりを一切
// 発生させないための唯一のバリデーション経路(作成・編集の両方から通す)。
function hasOverlap(tasks, startTime, endTime, excludeId) {
  const s = toMinutes(startTime), e = toMinutes(endTime);
  return tasks.some(t => t.id !== excludeId && toMinutes(t.startTime) < e && s < toMinutes(t.endTime));
}
function addTask(state, dayKey, { title, startTime, endTime, tags }) {
  const computed = computePlannedPomodoros(startTime, endTime, pomodoroRoundMinutes(state.settings));
  if (!computed) throw new Error("終了時刻は開始時刻より後にしてください");
  const day = ensureDay(state, dayKey);
  if (hasOverlap(day.tasks, startTime, endTime, null)) {
    throw new Error("この時間帯には既に別のタスクがあります");
  }
  day.tasks.push({
    id: genId(), title, startTime, endTime,
    plannedMinutes: computed.plannedMinutes,
    plannedPomodoros: computed.plannedPomodoros,
    actualMinutes: 0,
    completed: false,
    tags: Array.isArray(tags) ? tags : [],
  });
  recordTitleUsage(state, title);
}
function recordTitleUsage(state, title) {
  const stat = state.taskTitleStats[title];
  if (stat) { stat.count += 1; stat.lastUsedDay = todayKey(); }
  else { state.taskTitleStats[title] = { count: 1, lastUsedDay: todayKey() }; }
}
function getTitleSuggestions(state, limit = 6) {
  return Object.entries(state.taskTitleStats)
    .sort((a, b) => (b[1].count - a[1].count) || (b[1].lastUsedDay < a[1].lastUsedDay ? -1 : 1))
    .slice(0, limit)
    .map(([title]) => title);
}
function pruneTaskTitleStats(state, todayDayKey, maxAgeDays = TITLE_HISTORY_MAX_AGE_DAYS) {
  const cutoff = addDays(todayDayKey, -maxAgeDays);
  for (const title in state.taskTitleStats) {
    if (state.taskTitleStats[title].lastUsedDay < cutoff) delete state.taskTitleStats[title];
  }
}
function updateTask(state, dayKey, taskId, { title, startTime, endTime, tags, actualMinutes, completed }) {
  const day = state.days[dayKey]; if (!day) return;
  const task = day.tasks.find(t => t.id === taskId); if (!task) return;
  const computed = computePlannedPomodoros(startTime, endTime, pomodoroRoundMinutes(state.settings));
  if (!computed) throw new Error("終了時刻は開始時刻より後にしてください");
  if (hasOverlap(day.tasks, startTime, endTime, taskId)) {
    throw new Error("この時間帯には既に別のタスクがあります");
  }
  task.title = title;
  task.startTime = startTime;
  task.endTime = endTime;
  task.plannedMinutes = computed.plannedMinutes;
  task.plannedPomodoros = computed.plannedPomodoros;
  task.tags = Array.isArray(tags) ? tags : [];
  task.actualMinutes = Math.max(0, Math.round(actualMinutes));
  task.completed = !!completed;
  recordTitleUsage(state, title);
}
function removeTask(state, dayKey, taskId) {
  const day = state.days[dayKey]; if (!day) return;
  day.tasks = day.tasks.filter(t => t.id !== taskId);
}
// タイムラインのドラッグ(移動・端リサイズ)専用の時刻書き換え。updateTask
// と違い重なりを例外で拒否しない(重なりの解決は呼び出し側が
// resolveDragOverlap/applyDragResultで先に済ませる前提の低レベル関数)。
function setTaskTimeRange(state, dayKey, taskId, startMin, endMin) {
  const day = state.days[dayKey]; if (!day) return;
  const task = day.tasks.find(t => t.id === taskId); if (!task) return;
  const computed = computePlannedPomodoros(formatHHMM(startMin), formatHHMM(endMin), pomodoroRoundMinutes(state.settings));
  if (!computed) return;
  task.startTime = formatHHMM(startMin);
  task.endTime = formatHHMM(endMin);
  task.plannedMinutes = computed.plannedMinutes;
  task.plannedPomodoros = computed.plannedPomodoros;
}
// ドラッグの結果[newStart,newEnd)が他のタスクと重なる場合の解決方法を
// 判定する(状態は変更しない、判定のみ)。
// - "none": 誰とも重ならない。
// - "swap": 重なる相手がちょうど1件かつ、新しい範囲がその相手の範囲と
//   完全に一致する(=入れ替えを意図したドラッグとみなす)。
// - "push": 重なった相手を移動方向へ隙間なく順に押し出す(玉突きで連鎖する
//   ことがある)。tasksは元々互いに重ならない前提(hasOverlapで担保済み)
//   なので、境界(boundary)より前に食い込む相手だけを順に押せば連鎖も
//   正しく解決できる。
// - "reject": 押し出した結果0:00〜24:00の範囲をはみ出す(操作を取り消す)。
function resolveDragOverlap(tasks, movingTaskId, newStart, newEnd, direction) {
  const others = tasks.filter(t => t.id !== movingTaskId);
  const overlapping = others.filter(t => toMinutes(t.startTime) < newEnd && newStart < toMinutes(t.endTime));
  if (!overlapping.length) return { kind: "none" };
  if (
    overlapping.length === 1 &&
    toMinutes(overlapping[0].startTime) === newStart &&
    toMinutes(overlapping[0].endTime) === newEnd
  ) {
    return { kind: "swap", otherId: overlapping[0].id };
  }
  const sorted = [...others].sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime));
  const updates = [];
  if (direction === "later") {
    let boundary = newEnd;
    for (const t of sorted) {
      const tStart = toMinutes(t.startTime), tEnd = toMinutes(t.endTime);
      if (tEnd <= newStart) continue; // newStartより完全に前、無関係
      if (tStart >= boundary) break; // これ以降(時刻順で後ろ)はもう重ならない
      const dur = tEnd - tStart;
      const pushedStart = boundary, pushedEnd = boundary + dur;
      if (pushedEnd > 24 * 60) return { kind: "reject" };
      updates.push({ id: t.id, startMin: pushedStart, endMin: pushedEnd });
      boundary = pushedEnd;
    }
  } else {
    let boundary = newStart;
    for (const t of [...sorted].reverse()) {
      const tStart = toMinutes(t.startTime), tEnd = toMinutes(t.endTime);
      if (tStart >= newEnd) continue; // newEndより完全に後ろ、無関係
      if (tEnd <= boundary) break;
      const dur = tEnd - tStart;
      const pushedEnd = boundary, pushedStart = boundary - dur;
      if (pushedStart < 0) return { kind: "reject" };
      updates.push({ id: t.id, startMin: pushedStart, endMin: pushedEnd });
      boundary = pushedStart;
    }
  }
  return { kind: "push", updates };
}
// ドラッグ確定時の適用処理。resolveDragOverlapの判定に従って、必要なら
// 衝突相手も一緒に動かした上で、ドラッグしたタスク自身の時刻も書き換える。
function applyDragResult(state, dayKey, taskId, newStart, newEnd, direction) {
  const day = state.days[dayKey]; if (!day) return { ok: false };
  const resolution = resolveDragOverlap(day.tasks, taskId, newStart, newEnd, direction);
  if (resolution.kind === "reject") return { ok: false };
  if (resolution.kind === "swap") {
    const movingTask = day.tasks.find(t => t.id === taskId);
    const origStart = toMinutes(movingTask.startTime), origEnd = toMinutes(movingTask.endTime);
    setTaskTimeRange(state, dayKey, resolution.otherId, origStart, origEnd);
  } else if (resolution.kind === "push") {
    for (const u of resolution.updates) setTaskTimeRange(state, dayKey, u.id, u.startMin, u.endMin);
  }
  setTaskTimeRange(state, dayKey, taskId, newStart, newEnd);
  return { ok: true };
}
function toggleTaskComplete(state, dayKey, taskId) {
  const day = state.days[dayKey]; if (!day) return;
  const task = day.tasks.find(t => t.id === taskId); if (!task) return;
  task.completed = !task.completed;
}
function addActualMinutes(state, dayKey, taskId, minutes) {
  const day = state.days[dayKey]; if (!day) return;
  const task = day.tasks.find(t => t.id === taskId); if (!task) return;
  task.actualMinutes += minutes;
}
function buildTagPath(parent, name) {
  const trimmed = name.trim();
  if (!trimmed) throw new Error("タグ名を入力してください");
  return parent ? `${parent}/${trimmed}` : trimmed;
}
function addTagDefinition(state, parent, name) {
  const path = buildTagPath(parent, name);
  if (state.tags.includes(path)) throw new Error("同じ名前のタグが既にあります");
  state.tags.push(path);
  state.tags.sort();
}
// 自己/子孫を親にする(循環参照)・リネーム後のパスが無関係な既存タグと
// 衝突する場合はそれぞれ例外を投げる。成功時は影響した全タグの
// oldPath→newPathの対応をMapで返す(現状は呼び出し元では使っていないが、
// タグ変更後に他の一時状態を追随させたくなった場合の拡張ポイントとして
// 残している)。
function renameTagCascade(state, oldPath, newPath) {
  if (newPath === oldPath) return new Map();
  if (newPath === oldPath || newPath.startsWith(oldPath + "/")) {
    throw new Error("配下のタグを親にすることはできません");
  }
  const affected = state.tags.filter(t => t === oldPath || t.startsWith(oldPath + "/"));
  const renameMap = new Map();
  for (const tag of affected) {
    const renamed = newPath + tag.slice(oldPath.length);
    if (state.tags.includes(renamed) && !affected.includes(renamed)) {
      throw new Error(`「${renamed}」は既に存在します`);
    }
    renameMap.set(tag, renamed);
  }
  state.tags = state.tags.map(t => renameMap.get(t) || t);
  for (const dayKey in state.days) {
    for (const task of state.days[dayKey].tasks) {
      task.tags = task.tags.map(t => renameMap.get(t) || t);
    }
  }
  state.tags.sort();
  return renameMap;
}
function isTagRecentlyUsed(state, path, withinDays = TAG_STALE_AFTER_DAYS) {
  const cutoff = addDays(todayKey(), -withinDays);
  for (const dayKey in state.days) {
    if (dayKey < cutoff) continue;
    if (state.days[dayKey].tasks.some(t => t.tags && t.tags.includes(path))) return true;
  }
  return false;
}
// 「未使用」のバッジは、自分自身だけでなく配下のタグも含めて全て未使用の
// 場合だけ表示する。子タグが最近使われているのに親タグを「未使用」と
// 表示すると、その分類全体が使われていないという誤解を招くため。
function isTagSubtreeStale(state, path, withinDays = TAG_STALE_AFTER_DAYS) {
  const subtree = [path, ...state.tags.filter(t => t.startsWith(path + "/"))];
  return subtree.every(p => !isTagRecentlyUsed(state, p, withinDays));
}
// 中間ノードだけ削除すると子タグが実績集計に「幽霊祖先」として残るため、
// サブツリーごとカスケード削除する。
function removeTagCascade(state, path) {
  const targets = state.tags.filter(t => t === path || t.startsWith(path + "/"));
  state.tags = state.tags.filter(t => !targets.includes(t));
  for (const dayKey in state.days) {
    for (const task of state.days[dayKey].tasks) {
      if (task.tags && task.tags.some(t => targets.includes(t))) {
        task.tags = task.tags.filter(t => !targets.includes(t));
      }
    }
  }
  return targets;
}
function countTasksUsingTags(state, paths) {
  let count = 0;
  for (const dayKey in state.days) {
    for (const task of state.days[dayKey].tasks) {
      if (task.tags && task.tags.some(t => paths.includes(t))) count += 1;
    }
  }
  return count;
}
// dayEntriesは複数日ぶんのエントリの配列(全期間集計のため)。ただし
// 「全期間」は保持期間(既定6か月、state.archive参照)より前の月は
// 月次サマリーに圧縮されタグ別の内訳を失っているため、実際には
// 「保持期間内の全期間」が対象になる(呼び出し側・READMEで明記)。
function computeTagAggregates(dayEntries) {
  const totals = {};
  const add = (path, planned, actual) => {
    if (!totals[path]) totals[path] = { planned: 0, actual: 0 };
    totals[path].planned += planned;
    totals[path].actual += actual;
  };
  for (const entry of dayEntries) {
    for (const t of entry.tasks) {
      const tags = t.tags && t.tags.length ? t.tags : ["(タグ無し)"];
      const targets = new Set();
      for (const tag of tags) {
        const segs = tag.split("/");
        for (let i = 1; i <= segs.length; i++) targets.add(segs.slice(0, i).join("/"));
      }
      for (const path of targets) add(path, t.plannedMinutes, t.actualMinutes);
    }
  }
  return totals;
}
function computeCompletionRate(dayEntry) {
  if (!dayEntry || dayEntry.tasks.length === 0) return 0;
  return dayEntry.tasks.filter(t => t.completed).length / dayEntry.tasks.length;
}
function finalizeDay(state, dayKey) {
  const entry = state.days[dayKey];
  if (!entry || entry.finalized) return;
  const doneCount = entry.tasks.filter(t => t.completed).length;
  const achieved = entry.tasks.length > 0 && doneCount >= state.settings.streakThreshold;
  if (achieved) {
    const prevDay = addDays(dayKey, -1);
    const continuous = state.streak.lastAchievedDay === prevDay;
    state.streak.current = continuous ? state.streak.current + 1 : 1;
    state.streak.lastAchievedDay = dayKey;
    state.streak.longest = Math.max(state.streak.longest, state.streak.current);
  } else {
    state.streak.current = 0;
  }
  entry.finalized = true;
}
// ---- 4a. アーカイブ(state.daysの無制限な蓄積を防ぐ) ----
// 日単位ではなく月単位で丸ごと圧縮する。同じ月の中に「詳細が残っている日」と
// 「消えた日」が混在すると、カレンダーのドット表示や実績タブの整合性が
// 崩れるため。タグ別の内訳は持たず合計のみ(必要になれば拡張ポイント)。
function rollMonthIntoSummary(state, monthKey) {
  const summary = state.archive.monthlySummaries[monthKey]
    || { plannedMinutes: 0, actualMinutes: 0, completedCount: 0, totalCount: 0 };
  for (const dayKey in state.days) {
    if (!dayKey.startsWith(monthKey)) continue;
    for (const t of state.days[dayKey].tasks) {
      summary.plannedMinutes += t.plannedMinutes;
      summary.actualMinutes += t.actualMinutes;
      summary.totalCount += 1;
      if (t.completed) summary.completedCount += 1;
    }
    delete state.days[dayKey];
  }
  state.archive.monthlySummaries[monthKey] = summary;
}
function archiveOldMonths(state, todayDayKey, retentionMonths = DAY_DETAIL_RETENTION_MONTHS) {
  const [ty, tm] = todayDayKey.split("-").map(Number);
  const keepFrom = new Date(ty, tm - 1 - (retentionMonths - 1), 1);
  const keepFromKey = `${keepFrom.getFullYear()}-${pad2(keepFrom.getMonth() + 1)}`;
  const monthsToArchive = new Set();
  for (const dayKey in state.days) {
    const monthKey = dayKey.slice(0, 7);
    if (monthKey < keepFromKey) monthsToArchive.add(monthKey);
  }
  for (const monthKey of monthsToArchive) rollMonthIntoSummary(state, monthKey);
}
function computeAllTimeTotals(state) {
  let actualMinutes = 0, completedCount = 0;
  for (const summary of Object.values(state.archive.monthlySummaries)) {
    actualMinutes += summary.actualMinutes;
    completedCount += summary.completedCount;
  }
  for (const entry of Object.values(state.days)) {
    for (const t of entry.tasks) {
      actualMinutes += t.actualMinutes;
      if (t.completed) completedCount += 1;
    }
  }
  return { actualMinutes, completedCount };
}

// lastOpenedDayを確定対象にする(「昨日」固定だと数日開かなかった場合に中間の日を誤って扱う)。
// selectedDate(表示中の日付)には関知しない。呼び出し側が戻り値を見て
// 「実際の今日を見ていた場合だけ」selectedDateを追従させる(暗黙のグローバル
// 参照にすると将来の呼び出し順序変更に弱くなるため、明示的な連携にしている)。
function rolloverIfNeeded(state, now = new Date()) {
  const today = todayKey(now);
  if (state.lastOpenedDay !== today) {
    const prevDay = state.lastOpenedDay;
    finalizeDay(state, prevDay);
    pruneTaskTitleStats(state, today);
    archiveOldMonths(state, today);
    state.pausedSessions = {}; // 前日の中断中セッションは新しい日には引き継がない
    state.lastOpenedDay = today;
    ensureDay(state, today);
    saveState(state);
    return { rolled: true, prevDay, today };
  }
  ensureDay(state, today);
  return { rolled: false, today };
}

// ==== 4b. Undo/Redo(タスクの追加・編集・削除・ドラッグ移動の取り消し) ====
// state.days(タスクの実データ)だけを対象にする。タグ・設定・streak・
// アーカイブは対象外(タグ削除は影響件数を示す確認ダイアログ、設定は
// 保存前に見直せる専用フォームというように、それぞれ別の安全策を既に
// 持っているため、ここで扱う対象を広げて「取り消しの対象が何なのか」の
// 直感を壊さないようにしている)。永続化はせず(localStorageには積まない)、
// タブを閉じたりリロードしたりすると履歴は失われる仕様。
const UNDO_MAX_STEPS = 30;
let taskUndoStack = [];
let taskRedoStack = [];
function snapshotDays() { return JSON.parse(JSON.stringify(state.days)); }
// 実際に変更が起きる直前に必ず呼ぶ(呼んだ後に例外で失敗した場合は
// discardPendingUndoSnapshot()で取り消す)。新しい変更をしたら redo 履歴は
// 意味を失うため破棄する。
function recordUndoPoint() {
  taskUndoStack.push(snapshotDays());
  if (taskUndoStack.length > UNDO_MAX_STEPS) taskUndoStack.shift();
  taskRedoStack = [];
}
// recordUndoPoint()の直後に実際の変更処理が例外を投げて失敗した場合、
// 「何も変わっていないのにUndoできる」という空振りの履歴が残ってしまう
// ため、呼び出し側のcatchで必ずこれを呼んで取り消す。
function discardPendingUndoSnapshot() { taskUndoStack.pop(); }
function performTaskUndo() {
  if (!taskUndoStack.length) return;
  taskRedoStack.push(snapshotDays());
  state.days = taskUndoStack.pop();
  saveState(state);
  renderAll();
}
function performTaskRedo() {
  if (!taskRedoStack.length) return;
  taskUndoStack.push(snapshotDays());
  state.days = taskRedoStack.pop();
  saveState(state);
  renderAll();
}

// ==== 5. タイマーエンジン(壁時計ベース) ====
let audioCtx = null;
const AudioCue = {
  unlock() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  },
  beep(freq = 880, duration = 0.18) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = "sine";
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration + 0.02);
    } catch (e) { console.error("beep failed", e); }
  },
};

let tickHandle = null;
function ensureTickTimer() {
  if (tickHandle) return;
  tickHandle = setInterval(tick, 500);
}
function stopTickTimer() {
  if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
}
// setIntervalのtick回数は信用せず、endAt(壁時計上の終了予定時刻)との差分だけで判定する。
// バックグラウンド遷移時のスロットリング/停止に対応するため。
function tick() {
  if (!state.activeSession) { stopTickTimer(); return; }
  if (state.activeSession.paused) return;
  const remaining = state.activeSession.endAt - Date.now();
  if (remaining <= 0) { completeSession(); return; }
  renderFocusView();
}
function startSession(taskId, kind) {
  const minutes = kind === "focus" ? state.settings.focusMinutes : state.settings.breakMinutes;
  // dayKeyはセッション開始時点の実際の今日を記録する(タスク自体は必ず
  // todayKeyEntryから選ばれるため常に正しい)。日を跨いで実行中/一時停止中の
  // まま残った場合、addActualMinutesの対象日をtodayKey()の再評価(=日付が
  // 変わった後の新しい日)に任せると、タスクが属する古い日には見つからず
  // 実績が消える(過去に実際に起きたバグ)。セッションに紐付いたこの
  // dayKeyを最後まで使うことで、日を跨いでも元のタスクに正しく積算される。
  state.activeSession = { taskId, dayKey: todayKey(), kind, endAt: Date.now() + minutes * 60000, paused: false, pausedRemainingMs: null };
  AudioCue.unlock(); // ユーザー操作(このタップ)の中で生成・resumeする必要がある
  saveState(state);
  renderAll();
  ensureTickTimer();
}
function pauseSession() {
  if (!state.activeSession || state.activeSession.paused) return;
  state.activeSession.pausedRemainingMs = state.activeSession.endAt - Date.now();
  state.activeSession.paused = true;
  saveState(state); renderAll();
}
function resumeSession() {
  if (!state.activeSession || !state.activeSession.paused) return;
  state.activeSession.endAt = Date.now() + state.activeSession.pausedRemainingMs;
  state.activeSession.paused = false;
  state.activeSession.pausedRemainingMs = null;
  saveState(state); renderAll(); ensureTickTimer();
}
// 集中フェーズを手動で終了する際に、経過分を切り捨てず記録するための計算。
// 自然完了(completeSession)は常にfocusMinutes固定分を加算するのに対し、
// こちらは実測の経過時間をMath.roundで丸める(体感のズレを避けるため)。
function getSessionElapsedFocusMinutes(session) {
  if (!session || session.kind !== "focus") return 0;
  const totalMs = state.settings.focusMinutes * 60000;
  const remainingMs = session.paused ? session.pausedRemainingMs : session.endAt - Date.now();
  const elapsedMs = totalMs - Math.max(0, remainingMs);
  return Math.max(0, Math.round(elapsedMs / 60000));
}
function finishSession(elapsedMinutes) {
  const session = state.activeSession;
  if (!session) return;
  if (session.kind === "focus" && elapsedMinutes > 0) {
    addActualMinutes(state, session.dayKey, session.taskId, elapsedMinutes);
  }
  state.activeSession = null;
  saveState(state); renderAll();
}
function completeSession() {
  const session = state.activeSession;
  if (!session) return;
  if (session.kind === "focus") {
    addActualMinutes(state, session.dayKey, session.taskId, state.settings.focusMinutes);
  }
  AudioCue.beep(session.kind === "focus" ? 660 : 990);
  if (session.kind === "focus") {
    state.activeSession = {
      taskId: session.taskId, dayKey: session.dayKey, kind: "break",
      endAt: Date.now() + state.settings.breakMinutes * 60000,
      paused: false, pausedRemainingMs: null,
    };
  } else {
    state.activeSession = null;
  }
  saveState(state);
  renderAll();
}

let focusSelectedTaskId = null;

let calendarViewMonth = null; // {year, month} カレンダーモーダルを開いた時に設定

function getEntryForDate(dayKey) { return state.days[dayKey] || { tasks: [], finalized: false }; }
function getTodayEntry() { return getEntryForDate(todayKey()); }
function getSelectedEntry() { return getEntryForDate(selectedDate); }
function incompleteTasksToday() { return getTodayEntry().tasks.filter(t => !t.completed); }

function suggestTaskId() {
  const tasks = incompleteTasksToday();
  if (tasks.length === 0) return null;
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const current = tasks.find(t => toMinutes(t.startTime) <= nowMin && nowMin < toMinutes(t.endTime));
  if (current) return current.id;
  const upcoming = tasks.filter(t => toMinutes(t.startTime) >= nowMin)
    .sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime));
  return (upcoming[0] || tasks[0]).id;
}
function computeNowStatus(dayEntry) {
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const active = dayEntry.tasks.find(t => toMinutes(t.startTime) <= nowMin && nowMin < toMinutes(t.endTime));
  if (active) return { type: "active", task: active };
  const upcoming = dayEntry.tasks.filter(t => toMinutes(t.startTime) >= nowMin)
    .sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime));
  return { type: "free", next: upcoming[0] || null };
}

// タスクの追加・編集・削除・チェック・ドラッグ移動のいずれかが起きた

function tagChipLabel(path) { return path.split("/").pop(); }
// インデントだけだと親子関係が追いにくいため、祖先パスを薄い文字で
// パンくず形式(祖先パスを毎行繰り返す)は名前が長くなると冗長になるため、
// treeコマンド風の罫線記号(├──/└──/│)でインデントを表現する。
// tagPathsに含まれるタグの祖先パスが実タグとして存在しない場合(タグ名に
// "/"を直接含めて一気に深い階層を作れる仕様のため起こり得る)も、暗黙の
// 中間ノードとして木構造に含める(real:falseでマークし、行の表示側で
// 編集/削除ボタンを出さない・薄い表示にする、等の判断に使う)。
function buildTagTree(tagPaths) {
  const allPaths = new Set();
  for (const t of tagPaths) {
    const segs = t.split("/");
    for (let i = 1; i <= segs.length; i++) allPaths.add(segs.slice(0, i).join("/"));
  }
  const sorted = [...allPaths].sort();
  const nodeMap = new Map();
  const roots = [];
  for (const path of sorted) {
    const segs = path.split("/");
    const node = { path, name: segs[segs.length - 1], children: [], real: tagPaths.includes(path) };
    nodeMap.set(path, node);
    const parentPath = segs.slice(0, -1).join("/");
    if (parentPath && nodeMap.has(parentPath)) nodeMap.get(parentPath).children.push(node);
    else roots.push(node);
  }
  return roots;
}
// renderRow(node, treePrefixHtml)を各ノードについて呼び、木の罫線記号を
// 4文字幅の等幅フォント(.tag-tree-prefix)で描画する(可変幅フォントでも
// 罫線がズレないようにするため)。
function renderTagTreeRows(nodes, prefix, renderRow) {
  let html = "";
  nodes.forEach((node, i) => {
    const isLast = i === nodes.length - 1;
    const connector = prefix + (isLast ? "└── " : "├── ");
    const childPrefix = prefix + (isLast ? "    " : "│   ");
    html += renderRow(node, connector);
    html += renderTagTreeRows(node.children, childPrefix, renderRow);
  });
  return html;
}
function formatHHMM(totalMin) {
  const clamped = Math.max(0, Math.min(24 * 60, totalMin));
  return `${pad2(Math.floor(clamped / 60))}:${pad2(clamped % 60)}`;
}
// 展開中の短いタスクの周辺を「比例拡大」するための変換。
// 各展開タスクについて、それが属する時計の1時間(floor(taskStart/60)*60
// 〜+60。タスクがその1時間をはみ出す場合はタスク全体を含むまで広げる)を
// 「窓」とし、窓全体を「タスク自身の高さがFULL_CONTENT_PXになる」ような
// 係数k(=FULL_CONTENT_PX/自然な高さ)で一様に引き伸ばす。窓はタスク自身の
// 開始時刻(taskStart)を不動点として拡大する(タスクの上端の画面上の位置は
// 変わらない。以前は「タスク自身の後ろだけを固定量押し下げる」方式だった
// ため、タスク前後の実時間比がタスクの展開で崩れて見える問題があった:
// 例えば30分タスクを展開すると、直前の30分ぶんの間隔はそのままなのに
// タスク自身だけ2倍になり、本来1:1のはずの比率が1:2に見えてしまっていた)。
// 窓は前後の既存タスク(または直前の展開領域の終端)を越えて広がらないよう
// クリップし、複数の展開領域が重ならないようにする。
//
// 【実際に踏んだバグとその修正】taskStart(不動点)からwsまで後方に伸びる
// ぶん、ws地点の画面上の位置は(伸びていない場合に比べて)手前にずれる。
// この「wsのずれ」を、ws未満(=窓より前の内容: 既存の時刻目盛りや別の
// タスク)に伝搬させずにいたところ、ws地点で不連続なジャンプが生じ、
// 「窓の直前の間隔がつぶれて見える」バグになっていた(例: 14:30〜15:00に
// タスクを置いたまま15:30〜16:00のタスクを展開すると、15:00のwsが
// 手前にずれる一方で14:30のタスクの位置は動かないため、両者の間隔が
// 潰れて14:30のタスクが15:00から始まるように見えた)。wsにおけるこの
// ずれ量(offsetBeforeWs)を計算し、窓より前の内容全体(直前の展開領域の
// 終端、または無ければ0:00まで)に一様に適用することで、窓の直前で
// 不連続にならないようにしている。
// 窓の端(ws/we)に他の(独立して展開中ではない)タスクがまたがって食い込んで
// いる場合、そのタスクをはみ出した先の時間まで丸ごと巻き込むよう広げる
// (安定するまで連鎖的に繰り返す。複数の短いタスクが隙間なく並んでいる
// 場合、連鎖的に全部が巻き込まれることもある)。独立して展開中の別タスクは
// 飲み込まず素通りする(重なりは後段のクリップで防ぐ)。
// 【実際に踏んだバグ】この巻き込み処理が無いと、展開したタスクの隣に別の

function scrollTimelineToRelevantPosition(entry) {
  const main = document.querySelector("main");
  if (!main) return;
  const isToday = selectedDate === todayKey();
  let target = isToday ? document.getElementById("timelineNowLine") : null;
  if (!target) {
    const sorted = [...entry.tasks].sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime));
    if (sorted.length) target = document.querySelector(`.timeline-task[data-id="${sorted[0].id}"]`);
  }
  if (target) {
    const stickyHeader = document.querySelector(".today-sticky-header");
    const clearance = (stickyHeader ? stickyHeader.getBoundingClientRect().height : 0) + 16;
    const targetTop = target.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop;
    main.scrollTop = Math.max(0, targetTop - clearance);
  } else {
    main.scrollTop = 0;
