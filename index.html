<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>1day scheduler</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1day">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%3E%3Crect%20width='180'%20height='180'%20rx='36'%20fill='%232563eb'/%3E%3Ctext%20x='90'%20y='120'%20font-size='84'%20font-family='-apple-system,Helvetica,Arial,sans-serif'%20font-weight='700'%20fill='%23ffffff'%20text-anchor='middle'%3E1D%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8;
    --bg-elevated: #ffffff;
    /* タイトルバー+日付ナビ/バナー用の専用色。--bg-elevatedと同じにすると
       タスクの箱(同じく--bg-elevated)と見分けが付きにくいという指摘を
       受けたため、どちらとも違う寒色寄りのトーンにしている。 */
    --header-bg: #e7ecf5;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --border: #e2e4e9;
    --accent: #2563eb;
    --accent-contrast: #ffffff;
    --danger: #dc2626;
    --tab-inactive: #6b7280;
    --radius: 14px;
    /* 予定タブのタイムライン列(.timeline-wrap)の幅の上限。iPad横向きで
       タイムラインが間延びしないよう中央寄せする際に使う(下記
       .timeline-wrap・.timeline-add-fab参照。両者で同じ値を書き分けると
       片方だけ変更漏れが起きるため変数化している)。 */
    --timeline-col-max-width: 760px;
    --heat-0: #e5e7eb;
    --heat-1: #bfdbfe;
    --heat-2: #93c5fd;
    --heat-3: #60a5fa;
    --heat-4: #2563eb;
    /* 選択中のタイムラインの箱に表示するリサイズハンドルの背景。従来
       (aria-hidden要素に背景を指定しない)は完全に透明で、タッチでは
       どこが掴めるか事前に見えず「サイズ変更のつもりが移動になる」原因の
       一つになっていた。選択して初めて見える領域なので、はっきり色を
       付けて存在をアピールする。 */
    --resize-handle-bg: rgba(37, 99, 235, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --bg-elevated: #171b22;
      --header-bg: #182236;
      --text: #e7e9ec;
      --text-muted: #9aa1ab;
      --border: #2a2f38;
      --accent: #4f8bff;
      --accent-contrast: #0b1220;
      --danger: #f87171;
      --tab-inactive: #8890a0;
      --heat-0: #1f2530;
      --heat-1: #1e3a5f;
      --heat-2: #2f5d8a;
      --heat-3: #3f7cc2;
      --heat-4: #4f8bff;
      --resize-handle-bg: rgba(79, 139, 255, 0.24);
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  /* iPad miniのホーム画面追加(スタンドアロン表示)で開いた時だけ、フッタ
     (.tabbar)が実際の画面下端より少し上にずれて表示される、という実機での
     報告があった。最初はheight:100vh/100dvhの「初回だけ解決値が古い」癖と
     見て、position:fixed+inset:0(常に実ビューポート矩形に追従)に変更した
     が、これでも直らず、しかも以前は効いていた「スクロールすると直る」も
     効かなくなったとの報告を受けた。あわせて「右下にウィンドウリサイズ用の
     ハンドルが出る」という観察も得られ、これは通常のフルスクリーンPWA表示
     では起きないため、iPadOSのStage Manager等でウィンドウ表示されている
     可能性が高いと判断した。ウィンドウ表示だと、position:fixedの
     inset:0が実際に合わせる先(レイアウトビューポート)と、実際に見えている
     領域(ウィンドウの矩形)がズレたままになり、スクロールのような
     再計算のきっかけでは直らない、という説明がつく。そのため、CSSの
     ビューポート単位に頼らずwindow.visualViewport(実際に見えている領域を
     直接返すAPI)をJSで測って高さをCSS変数に反映する方式に切り替えた
     (下記のupdateAppHeight参照)。原因がStage Managerであっても他の要因で
     あっても、「今実際に見えている高さ」に常に追従させることで対応できる
     はず、という考え方。この端末固有の不具合は自動検証手段が無く実機でしか
     確認できないため(CLAUDE.md「GUIの自動検証について」参照)、この修正が
     実際に直っているかは未検証。 */
  #app {
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100dvh;
    height: var(--app-height, 100dvh);
    overflow: hidden;
  }
  /* アプリ全体の常時表示ヘッダー。以前はタイトルバー(.app-header)と
     日付ナビ+バナー(.today-sticky-header、main内でposition:stickyを
     使って疑似的に常時表示させていた)の2層構造だったが、「ヘッダ部を
     もう少しスリムに」という指摘を受けて1層に統合した(renderAppHeader
     参照)。#appHeader自体がmainの外(#appの直接の子)にあるため、この
     ヘッダーは常にビューポート上部に固定表示される(position:stickyや
     mainのpaddingを打ち消す負のマージンといったトリックは不要)。
     背景は最初var(--bg)(ページ全体と同じ)、次にvar(--bg-elevated)
     (タスクの箱と同じ)を試したがどちらも「境界が分かりづらい」という
     指摘が続いた。var(--bg-elevated)はタスクの箱(.timeline-task)や
     .now-banner自身も使っている色のため、スクロールで箱がヘッダーの
     すぐ下まで来ると特に見分けが付きにくかった。専用のvar(--header-bg)
     (タスクの箱の色とは別トーン)にして解決している。 */
  .app-header {
    display: flex; flex-direction: column; gap: 4px;
    padding: 6px 14px; padding-top: calc(6px + env(safe-area-inset-top));
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .app-header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .app-title { font-size: 20px; margin: 0; }
  .header-streak { font-size: 15px; color: var(--accent); }
  .icon-btn {
    border: none; background: transparent; font-size: 20px; padding: 7px; line-height: 1;
    cursor: pointer; border-radius: 10px; min-width: 44px; min-height: 44px;
  }
  .icon-btn:active { background: var(--border); }
  .icon-btn.danger { color: var(--danger); }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .icon-btn:disabled:active { background: transparent; }
  /* 単色の線画アイコン(下記.icon参照)は、透明背景+線の太さだけに視認性を
     頼るとライト/ダーク双方で見づらくなる(日付ナビの◀▶📅→.date-nav-btn、
     設定の閉じるボタン→.modal-close-btnで既に同じ指摘を受けて対応済み)。
     以前は「絵文字ではない記号グリフだけ」に付けるクラスだったが、絵文字を
     全廃してすべてSVGピクトグラムに統一したため、アイコン単体のボタンは
     基本的にすべてこのクラスで背景+枠線付きの円を付ける(テキスト併記の
     ボタン(.btn)やタブバーのアイコンはその親要素側で見た目が成立するため
     対象外)。 */
  .glyph-icon-btn {
    background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text);
    border-radius: 50%;
  }
  .glyph-icon-btn:active { background: var(--border); }
  /* SVGスプライトアイコン共通スタイル(bodyの<symbol>群参照)。width/height:1em
     で親要素のfont-sizeにそのまま追従するため、既存の各ボタンのサイズ調整
     (.icon-btn 20px、.date-nav-btn 16px、.modal-close-btn 26px等)を変えずに
     絵文字→線画ピクトグラムへ置き換えられる。fill/strokeはSVGの継承
     プロパティなので<use>が参照する<symbol>内部にも(個々の要素が独自に
     presentation属性で上書きしない限り)伝わる。 */
  .icon {
    width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em;
    fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
  }
  /* 向き違い(prev/next、行トグル▶/▼、タイムライン展開ヒント⌃/⌄)は
     icon-chevron 1つを回転させて使い回す。以前は▶▼(行トグル。展開中=▼
     下向き)と▴▾(全展開/全折りたたみ。全展開中=▴上向き)で「展開中に
     見せる向き」がバラバラだったため、統一時に「展開中/押すと閉じる=
     下向き、折りたたみ中/押すと開く=右向き」に規約を揃えた。
     全展開/全折りたたみボタン(タイムライン・実績・WBS管理の3箇所)だけは
     icon-chevronの回転ではなく、icon-unfold-more(折りたたみ中/押すと
     全展開。矢印が互いに離れる形)とicon-unfold-less(展開中/押すと
     全折りたたみ。矢印が互いに近づく形)という2つの別アイコンを状態に
     応じて出し分ける。同じicon-chevronを回転させるだけの見た目だと
     日付ナビの◀▶(.date-nav-btnで同じ円形サイズ)と紛らわしい、という
     指摘を受けたため、単一矢印の回転ではなく「矢印同士の向きの関係」で
     意味を作る方式(Material Designのunfold_more/unfold_lessと同じ考え方)
     に変えて視覚的に区別している。 */
  .icon-rotate-down { transform: rotate(90deg); }
  .icon-rotate-up { transform: rotate(-90deg); }
  .icon-rotate-left { transform: rotate(180deg); }

  main { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 24px; -webkit-overflow-scrolling: touch; }

  .tabbar {
    display: flex; background: var(--bg-elevated); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0;
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 7px 0 9px; border: none; background: transparent; color: var(--tab-inactive);
    font-size: 12px; cursor: pointer; min-height: 52px;
  }
  .tab-btn .tab-icon { font-size: 23px; }
  .tab-btn.active { color: var(--accent); font-weight: 600; }

  .view { display: none; }
  .view.active { display: block; }
  /* iPadを横向きにするとmainの幅がタイムラインの箱にとってかなり広くなり、
     タスクがぎっしり並ぶとタスクの無い隙間を探してスクロールするのが
     難しくなる(どこを触ってもタスクの箱に触れてしまい、.timeline-taskの
     touch-action:noneでページスクロールと競合するドラッグ操作の方が
     反応してしまう)という指摘を受けた。タイムライン列(.timeline-wrap、
     下記)だけ幅に上限を設けて中央寄せにし、左右に常にタスクの箱が存在
     しない(=スクロール専用の)余白を作る。当初は#todayView全体(当時は
     日付ナビ・バナーもここに含まれていた)を中央寄せしていたが、「固定
     されているヘッダ部は元の通り広げた方が良い」という指摘を受け、
     .timeline-wrapだけに絞った(日付ナビ・バナーはその後さらに#appHeader
     へ統合され、mainの外の常時表示ヘッダーの一部になったため、この列幅の
     影響を受けない画面幅いっぱいの表示は変わらず保たれている)。
     .timeline-add-fab(下記参照)は変わらずこの列幅を前提にした位置合わせを
     する(タイムライン列の右端に追従させたいのは変わらないため)。 */

  .time-row { display: flex; align-items: center; gap: 8px; }
  .time-row input { flex: 1; min-width: 0; }

  .btn {
    font-size: 18px; padding: 13px 20px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg-elevated); color: var(--text); cursor: pointer; min-height: 52px;
  }
  .btn.primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); font-weight: 600; }
  .btn.danger-outline { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty-hint { color: var(--text-muted); font-size: 17px; padding: 20px 0; text-align: center; list-style: none; }

  /* margin-topで先頭(00:00)の時刻ラベル(-8px上にオフセットして表示される)
     のための余白を確保する(以前はヘッダーのすぐ下で見切れていた)。
     絶対配置された子要素の座標原点は「padding edge」であり、これは
     border直下の固定位置でpaddingの太さ自体には左右されない(paddingを
     足しても中身がずれるだけで子要素の原点はずれない)。そのため
     padding-topでは効かず、要素自体を通常フローで押し下げるmargin-topを
     使う必要がある(実際に試してpadding-topでは見切れが直らなかった)。 */
  /* max-width+左右autoで中央寄せにする(--timeline-col-max-width、:root
     参照)。日付ナビ・バナーは#appHeader(画面幅いっぱい)側にあるため、
     このタイムライン部分だけが中央の列として収まる形になる。 */
  .timeline-wrap { position: relative; margin: 12px auto 24px; max-width: var(--timeline-col-max-width); }
  .timeline-hour-row { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); }
  .timeline-hour-label {
    position: absolute; left: 0; top: -8px; font-size: 12px; color: var(--text-muted);
    background: var(--bg); padding-right: 4px;
  }
  .timeline-now-line { position: absolute; left: 48px; right: 0; height: 2px; background: var(--danger); z-index: 5; }
  .timeline-task {
    position: absolute; left: 52px; right: 8px; overflow: hidden;
    background: var(--bg-elevated); border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 8px; padding: 2px 10px; cursor: grab;
    touch-action: none; /* ドラッグ操作をブラウザの既定スクロールと競合させない */
  }
  .timeline-task.done { opacity: 0.55; }
  .timeline-task.dragging { z-index: 20; box-shadow: 0 4px 16px rgba(0,0,0,0.35); opacity: 0.95; cursor: grabbing; }
  /* 長押しで選択された箱(下記timelinePointerDown参照)。大きなリサイズ
     ハンドルが同時に表示される合図として、箱全体にもアクセントの縁取りを
     付ける。box-shadowではなくoutlineを使うのは、.expanded(下記)も同じ
     box-shadowプロパティを使っており、短い箱を展開しつつ選択もしている
     場合に後勝ちで片方の見た目が消えてしまうため(実際に確認したCSSの
     カスケード上の衝突)。outlineは独立したプロパティなので、選択+展開が
     同時に起きても両方の見た目が常に共存する。 */
  .timeline-task.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* チェックボックス(左上)・⏱/✏️(右上、showFullの時。2つのボタン分の
     幅を空けている)と重ならないよう左右をインセットする。よくある
     サイズ変更カーソル(ns-resize)を常時表示し、掴める場所であることが
     見た目でも分かるようにする。 */
  /* heightはCSSで固定せず、DRAG_EDGE_ZONE_PX/PASSIVE_DRAG_EDGE_ZONE_PXを
     使ってrenderTimelineHtml側でインラインstyleとして指定する(JSの定数と
     CSSが別々の値を持つとここだけ変更漏れが起きる。実際に定数を変えても
     見た目の判定領域が変わらないというバグがあった)。ハンドル要素自体は
     常に描画する(選択していない箱でも控えめなゾーンで直接ドラッグ
     リサイズできるハイブリッド方式のため)が、見た目を主張するのは
     armed(長押しで選択済み)の時だけにする。 */
  .timeline-resize-handle {
    position: absolute; left: 30px; right: 76px; cursor: ns-resize; z-index: 3;
    display: flex; align-items: center; justify-content: center;
  }
  /* armed中だけ背景色とつまみバーを表示する。選択していない常時ゾーンは
     見た目上ほぼ主張せず(cursor:ns-resizeだけがヒント)、armedになって
     初めて「掴める場所」であることを視覚的にアピールする
     (--resize-handle-bg参照)。 */
  .timeline-resize-handle.armed {
    background: var(--resize-handle-bg);
  }
  .timeline-resize-handle.armed::after {
    content: ""; width: 32px; height: 4px; border-radius: 999px; background: var(--accent);
  }
  .timeline-resize-handle.top { top: 0; border-radius: 7px 7px 0 0; }
  .timeline-resize-handle.bottom { bottom: 0; border-radius: 0 0 7px 7px; }
  .drag-time-tooltip {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
    background: var(--text); color: var(--bg); font-size: 16px; font-weight: 600;
    padding: 5px 12px; border-radius: 8px; pointer-events: none; display: none; white-space: nowrap;
  }
  .timeline-check { position: absolute; top: 2px; left: 2px; z-index: 2; }
  .timeline-check input { width: 22px; height: 22px; }
  .timeline-task-body { padding-left: 27px; }
  .timeline-task-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .timeline-task-title.compact { font-size: 13px; }
  .timeline-task-title.done { text-decoration: line-through; color: var(--text-muted); }
  .timeline-task-meta { font-size: 12px; color: var(--text-muted); }
  /* ⏱(集中タブへ)・✏️(編集)を横並びで右上に置く。以前は✏️単体を
     position:absoluteで直接right:0していたが、ボタンが2つになったため
     まとめて配置する共通の親を挟む方式に変えた(▲閉じるボタンは廃止した
     ため、下端リサイズハンドルとの位置調整も不要になった)。 */
  .timeline-task-actions { position: absolute; top: 0; right: 0; display: flex; gap: 3px; }
  .timeline-task-action-btn { font-size: 16px; min-width: 33px; min-height: 33px; padding: 5px; }
  .timeline-task.expanded { box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .timeline-expand-hint {
    position: absolute; bottom: 1px; right: 4px; font-size: 14px; color: var(--text-muted); line-height: 1;
  }
  /* rightはビューポート右端からの距離ではなく、.timeline-wrapの右端
     (--timeline-col-max-width、:root参照)からの距離を狙う。iPadを横向きに
     するとタイムライン列の右側に大きな余白ができるため、素朴にright:20pxの
     ままだとFABだけタイムライン列から離れた画面端に取り残されて見える。
     100vwが列の右端を超えている(=中央寄せの余白が生まれている)分だけ
     right側のオフセットを足し、余白が無い(列が画面幅いっぱいの)時は
     20pxのままになるようmax()でフォールバックする。
     以前はこの計算がmainのpadding(左右16pxずつ、下記main参照)を差し引か
     ずに.timeline-wrapの実際のmargin:autoと食い違っていたため、横向きで
     余白があるはずの場面でもFABがタイムライン列に食い込んで重なって
     しまう不具合があった(実際に踏んだ、「タイムラインに重ねないで余白
     部分に配置してほしい」という指摘で発覚)。オフセットを「FAB自身の幅+
     列との間の余白ぶん(68px)」に引き直し、mainのpadding分を安全マージン
     として残したまま列の右端より確実に内側(画面端寄り)に収まるように
     した。余白が無い/狭い(ポートレート等)場合は重なりを避けようがない
     ため、その場合だけ以前と同じ画面端から20pxのfallbackになる。 */
  .timeline-add-fab {
    position: fixed; right: max(20px, calc((100vw - 32px - var(--timeline-col-max-width)) / 2 - 68px));
    bottom: calc(90px + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--accent);
    color: var(--accent-contrast); font-size: 28px; line-height: 1; cursor: pointer; z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .focus-select-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .focus-task-detail {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 20px;
  }
  .focus-task-detail-title { font-size: 20px; font-weight: 600; }
  .focus-task-detail-title.done { text-decoration: line-through; color: var(--text-muted); }
  .focus-task-detail-meta { font-size: 16px; color: var(--text-muted); margin-top: 6px; }
  .focus-select-row select {
    flex: 1; min-width: 0; font-size: 19px; padding: 13px 15px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg-elevated); color: var(--text);
  }
  .timer-card {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 40px 20px; text-align: center;
  }
  .timer-phase { font-size: 18px; color: var(--text-muted); margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timer-display { font-size: 72px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
  .timer-progress { font-size: 17px; color: var(--text-muted); margin-top: 10px; }
  .timer-controls { display: flex; gap: 16px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
  .timer-hint { font-size: 14px; color: var(--text-muted); margin-top: 14px; }

  .streak-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .streak-box {
    flex: 1; background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 10px; text-align: center;
  }
  .streak-value { font-size: 30px; font-weight: 700; color: var(--accent); }
  .streak-label { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

  .today-table {
    width: 100%; border-collapse: collapse; font-size: 15px; margin-bottom: 24px;
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  }
  .today-table th, .today-table td { padding: 11px 13px; text-align: left; border-bottom: 1px solid var(--border); }
  .today-table th { color: var(--text-muted); font-weight: 600; font-size: 14px; }

  .heatmap-title { font-size: 15px; color: var(--text-muted); margin-bottom: 10px; }
  /* WBS別集計の見出し行(タイトル+全展開/全折りたたみボタン)。ボタンと
     並べるためheatmap-titleの単独margin-bottomをこちら側に持たせ替える
     (row内で子だけが下マージンを持つと縦位置がズレるため)。 */
  .wbs-agg-header-row { margin-bottom: 10px; }
  .wbs-agg-header-row .heatmap-title { margin-bottom: 0; }
  .heatmap-grid { display: grid; grid-template-columns: repeat(7, 26px); grid-auto-rows: 26px; gap: 5px; }
  .heat-cell { width: 26px; height: 26px; border-radius: 5px; cursor: pointer; }
  .heat-cell.level-0 { background: var(--heat-0); }
  .heat-cell.level-1 { background: var(--heat-1); }
  .heat-cell.level-2 { background: var(--heat-2); }
  .heat-cell.level-3 { background: var(--heat-3); }
  .heat-cell.level-4 { background: var(--heat-4); }
  .heatmap-detail { font-size: 15px; color: var(--text-muted); margin-top: 10px; min-height: 20px; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .modal.hidden { display: none; }
  .modal-card {
    background: var(--bg-elevated); width: 100%; max-width: 560px; border-radius: 18px;
    padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto;
  }
  /* WBS管理モーダルだけはmax-heightではなく固定heightにする。他のモーダルは
     中身が静的だが、ここはノードの折りたたみ/展開のたびに一覧の高さが
     変わる。max-heightのままだと展開/折りたたみのたびにカード自体の
     高さが伸縮し、.modal側のalign-items:centerで縦方向に再センタリングされ
     てダイアログの大きさ・位置がガタつく、という指摘を受けた。常に80vhで
     固定することで、開閉操作では内部のスクロール量だけが変わり、カード
     自体の大きさ・位置は変わらないようにした。 */
  #wbsModal .modal-card { height: 80vh; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
  .modal-header h2 { margin: 0; font-size: 21px; }
  .modal-close-btn {
    background: var(--border); font-size: 26px; min-width: 48px; min-height: 48px; border-radius: 50%;
  }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 17px; font-size: 16px; color: var(--text-muted); }
  .field input[type="number"], .field input[type="text"], .field select {
    font-size: 18px; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
  }
  .field input[type="file"] { font-size: 16px; }
  .field input:disabled { opacity: 0.55; }
  hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

  .header-actions { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }

  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; -webkit-overflow-scrolling: touch; }
  .chip {
    flex-shrink: 0; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 15px; cursor: pointer; white-space: nowrap;
  }
  .chip.selected { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  /* タイムラインの箱(タイムラインの1時間あたりの高さは指摘を受けて据え置いた
     ため、箱の高さ自体は変わっていない)にも使うため、他のチップほど大きく
     できない(実測で.timeline-taskの高さに収まる上限を確認して決めた値)。 */
  .chip.static { cursor: default; font-size: 11px; padding: 2px 8px; }
  .chip-hint { font-size: 15px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .task-memo { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: pre-wrap; word-break: break-word; }

  .date-nav { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; }
  .date-nav .date-label { flex: 1; text-align: center; font-size: 16px; color: var(--text-muted); }
  .date-nav .today-jump { font-size: 13px; color: var(--accent); background: transparent; border: none; cursor: pointer; padding: 6px; }
  .date-nav-btn {
    background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text);
    border-radius: 50%; font-size: 16px;
  }
  .date-nav-btn:active { background: var(--border); }
  .date-nav .today-jump:disabled { opacity: 0.35; cursor: default; }

  .now-banner {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; font-size: 17px;
  }
  .now-banner.active { border-left: 4px solid var(--accent); cursor: pointer; }

  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
  .calendar-weekday { text-align: center; font-size: 13px; color: var(--text-muted); }
  .calendar-cell {
    position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 12px; font-size: 17px; cursor: pointer; background: var(--bg);
  }
  .calendar-cell.empty { visibility: hidden; cursor: default; }
  .calendar-cell.is-today { box-shadow: inset 0 0 0 2px var(--accent); }
  .calendar-cell.is-selected { background: var(--accent); color: var(--accent-contrast); }
  .calendar-cell.has-tasks::after {
    content: ""; position: absolute; bottom: 5px; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
  }
  .calendar-cell.is-selected.has-tasks::after { background: var(--accent-contrast); }
  .calendar-nav { display: flex; align-items: center; justify-content: space-between; }
  .calendar-nav .month-label { font-size: 18px; font-weight: 600; }

  .wbs-row {
    position: relative; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 5px; font-size: 16px; gap: 10px;
  }
  /* 横の区切り線は、ガイド線を使うツリー表示(WBS管理モーダル)では
     ツリーの縦線と交差して邪魔になる、という指摘を受けてやめた。フラットな
     一覧(タスク編集モーダルの検索候補、.pickable)には引き続き区切り線を
     残す(ガイド線が無く、行の境目が分かりにくくなるため)。 */
  .wbs-row.pickable { cursor: pointer; border-bottom: 1px solid var(--border); }
  .wbs-row.pickable:last-child { border-bottom: none; }
  .wbs-row.pickable.selected { background: var(--accent); color: var(--accent-contrast); border-radius: 10px; }
  /* 階層のガイド線。.wbs-row(position:relative)の直接の子として絶対配置し、
     行自体を基準にする(隣接する行の線が継ぎ目なく繋がって見えるようにする
     ため)。.wbs-guide-lineは祖先の継続線(後続の兄弟がまだいる階層だけ)、
     .wbs-guide-branch-*は自分から親への枝で、上半分+横スタブは兄弟内の
     位置に関わらず常に描画し、下半分だけ最後の子でない場合に描画する
     (これにより、並び替えで最後の子になっても自分の枝自体は消えない)。
     色はvar(--border)だと薄すぎて頼りない見た目になるという指摘を受け、
     もう少し主張のあるvar(--text-muted)にしている。 */
  .wbs-guide-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--text-muted); }
  .wbs-guide-branch-top { position: absolute; top: 0; height: 50%; width: 1px; background: var(--text-muted); }
  .wbs-guide-branch-bottom { position: absolute; top: 50%; bottom: 0; width: 1px; background: var(--text-muted); }
  .wbs-guide-branch-h { position: absolute; top: 50%; height: 1px; background: var(--text-muted); }
  .wbs-deleted-label { color: var(--text-muted); font-style: italic; }
  /* 名前が長くなってもボタン(✏️🗑等)や数値が押し出されないよう、名前側は
     常にこの共通クラスで1行省略にする(WBS管理モーダル・実績集計の行の
     両方で使う)。.stackedは検索候補のように名前+パンくずを2行で積む場合。
     どちらもflex:1;min-width:0を親から受け取り、実際の省略は
     .wbs-row-name/.wbs-row-pathそれぞれが自分の1行分だけを担当する。 */
  .wbs-row-label { flex: 1; min-width: 0; display: flex; align-items: center; }
  .wbs-row-label.stacked { flex-direction: column; align-items: stretch; }
  .wbs-row-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 実績タブのWBS別集計における合成「その他」行(=そのノードに直接
     割り当てられたタスク分。state.wbsには存在しない表示専用ノード)。 */
  .wbs-agg-other-label { font-style: italic; color: var(--text-muted); }
  .wbs-row-actions, .wbs-row-value { flex-shrink: 0; }
  /* 兄弟内の並び替え用ドラッグハンドル。タップ領域確保のため.icon-btnを
     流用しつつ、ページ/モーダルのスクロールと競合しないようtouch-action:
     noneを指定する(.timeline-taskと同じ理由)。cursor:grab/grabbingで
     マウス操作時も掴んでいる感を出す。 */
  .wbs-drag-handle {
    display: inline-flex; align-items: center; justify-content: center;
    touch-action: none; cursor: grab; user-select: none;
  }
  .wbs-drag-handle:active { cursor: grabbing; }
  /* 折りたたみトグル。子を持たないノードにも同じ幅の空スロット
     (.wbs-toggle-slotのみ)を確保し、子の有無によらず名前の開始位置を
     揃える(ファイルツリーでファイル行にだけ空チェブロン分の余白がある
     のと同じ考え方)。icon-chevron(SVG)を他の記号アイコンと同じく
     .glyph-icon-btn(背景+枠線の円)を流用しつつ、行の中に収まるよう
     .icon-btnの最小サイズ(44px)だけ小さく上書きする。 */
  .wbs-toggle-slot { flex-shrink: 0; width: 26px; height: 26px; margin-right: 4px; }
  .wbs-toggle-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 0; min-height: 0; padding: 0; font-size: 12px; line-height: 1;
  }
  /* ドラッグ中の行は最前面に浮かせ、影を付けて「持ち上げている」感を出す。
     並び替えプレビュー用に他の行へ付けるtransformにはtransitionを効かせ、
     ドラッグ中の行自身は指に追従させるため常に即時反映(transitionなし)。 */
  .wbs-row.dragging { position: relative; z-index: 20; background: var(--bg-elevated); box-shadow: 0 4px 14px rgba(0,0,0,0.25); border-radius: 10px; }
  .wbs-row.shifting { transition: transform 150ms ease; }
  .wbs-quick-add-row { display: flex; gap: 8px; padding: 10px 5px 2px; align-items: center; flex-wrap: wrap; }
  .wbs-quick-add-row input[type="text"], .wbs-quick-add-row select {
    flex: 1; min-width: 120px; font-size: 16px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
  }
  .wbs-quick-add-row button {
    flex-shrink: 0; font-size: 15px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-contrast); cursor: pointer;
  }
  /* 名前未入力、または選択中の親の直下に既に同名のノードがある場合(=
     全く同じ場所への重複作成になる場合)は作成ボタンを非活性にする。 */
  .wbs-quick-add-row button:disabled {
    border-color: var(--border); background: var(--border); color: var(--text-muted); cursor: default;
  }
  .wbs-quick-add-duplicate-note { width: 100%; font-size: 13px; color: var(--text-muted); }
  .wbs-current-selection {
    font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); margin-bottom: 8px;
  }
  .wbs-current-selection .wbs-deleted-label { margin-left: 4px; }
  .wbs-search-input {
    width: 100%; font-size: 16px; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); margin-bottom: 4px;
  }
  .wbs-row-path {
    display: block; font-size: 13px; color: var(--text-muted); margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .archive-note { font-size: 14px; color: var(--text-muted); margin-top: 12px; text-align: center; }
  .all-time-row {
    font-size: 15px; color: var(--text-muted); text-align: center; padding: 12px;
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
  }
</style>
</head>

<!-- アイコンスプライト。絵文字(🌳⚙️✏️🗑等)はUnicode上ほとんどが絵文字専用
     コードポイントでモノクロのtext-presentationが存在せず、CSSで色・線幅を
     制御できずテーマにも追従しないため、単色線画のSVGピクトグラムに統一
     した(「アイコンや絵文字をピクトグラム的な表現に変えられないか」という
     要望+「既に記号のようなものも含めて統一感を出してほしい」という指摘を
     受けて対応)。ここで<symbol>として1回だけ定義し、呼び出し側は
     <svg class="icon"><use href="#icon-xxx"></use></svg>で参照する(静的HTML
     ・JSテンプレート文字列のどちらからでもid参照なので問題なく使える)。
     向き違い(prev/next、行トグル▶/▼等)はicon-chevron 1つをCSSの
     transform:rotate()で使い回している(全展開/全折りたたみボタンは
     日付ナビ▶◀と見分けが付くよう、矢印同士の向きの関係で意味を作る
     icon-unfold-more/icon-unfold-lessを使う)。 -->
<svg style="display:none" aria-hidden="true">
  <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="icon-unfold-more" viewBox="0 0 24 24"><path d="M7 9l5-5 5 5"/><path d="M7 15l5 5 5-5"/></symbol>
  <symbol id="icon-unfold-less" viewBox="0 0 24 24"><path d="M7 5l5 5 5-5"/><path d="M7 19l5-5 5 5"/></symbol>
  <symbol id="icon-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="icon-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
  <symbol id="icon-tree" viewBox="0 0 24 24">
    <path d="M12 7.3V12M12 12H6v4.7M12 12h6v4.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="5" r="2.3" fill="currentColor" stroke="none"/>
    <circle cx="6" cy="19" r="2.3" fill="currentColor" stroke="none"/>
    <circle cx="18" cy="19" r="2.3" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="icon-settings" viewBox="0 0 24 24">
    <path fill-rule="evenodd" fill="currentColor" stroke="none" d="M5.5 12A6.5 6.5 0 1 0 18.5 12A6.5 6.5 0 1 0 5.5 12Z M9 12A3 3 0 1 0 15 12A3 3 0 1 0 9 12Z"/>
    <g fill="currentColor" stroke="none">
      <rect x="10.5" y="1.6" width="3" height="3.4" rx="0.8"/>
      <rect x="10.5" y="1.6" width="3" height="3.4" rx="0.8" transform="rotate(45 12 12)"/>
      <rect x="10.5" y="1.6" width="3" height="3.4" rx="0.8" transform="rotate(90 12 12)"/>
      <rect x="10.5" y="1.6" width="3" height="3.4" rx="0.8" transform="rotate(135 12 12)"/>
      <rect x="10.5" y="1.6" width="3" height="3.4" rx="0.8" transform="rotate(180 12 12)"/>
      <rect x="10.5" y="1.6" width="3" height="3.4" rx="0.8" transform="rotate(225 12 12)"/>
      <rect x="10.5" y="1.6" width="3" height="3.4" rx="0.8" transform="rotate(270 12 12)"/>
      <rect x="10.5" y="1.6" width="3" height="3.4" rx="0.8" transform="rotate(315 12 12)"/>
    </g>
  </symbol>
  <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M4 20l1-4.5L15.5 5 19 8.5 8.5 19 4 20Z"/><path d="M13 7l4 4"/></symbol>
  <symbol id="icon-delete" viewBox="0 0 24 24"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M7 7l1 12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-12"/><path d="M10 11v6M14 11v6"/></symbol>
  <symbol id="icon-schedule" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
  <symbol id="icon-stats" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <rect x="4" y="13" width="4" height="7" rx="1"/><rect x="10" y="8" width="4" height="12" rx="1"/><rect x="16" y="4" width="4" height="16" rx="1"/>
  </symbol>
  <symbol id="icon-focus" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 5V3M9.5 3h5M12 13V9"/></symbol>
  <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="icon-flame" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <path d="M12 22a7 7 0 0 1-7-7c0-3 1.5-5 2.5-7.5.7 2 2 3 2 3-1-4.5 1.5-7.5 4.5-9.5-1 3 0 5 2 6.5C18.3 9.2 19 11.5 19 15a7 7 0 0 1-7 7Z"/>
  </symbol>
  <symbol id="icon-check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></symbol>
  <symbol id="icon-tomato" viewBox="0 0 24 24">
    <circle cx="12" cy="14" r="7" fill="currentColor" stroke="none"/>
    <path d="M12 7c-1.2-2-3-2.6-4.2-2 1-.2 2 .2 2.7 1M12 7c1.2-2 3-2.6 4.2-2-1-.2-2 .2-2.7 1M12 5v2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

<script>
// ==== 1. 定数・設定値 ====
const STORAGE_KEY = "1ds:state";
const SCHEMA_VERSION = 6;
const DEFAULT_SETTINGS = { focusMinutes: 25, breakMinutes: 5, streakThreshold: 1 };
const PX_PER_MIN = 1.2; // タイムラインの縮尺(72px/時間)
// 「フル表示」の基準高さ = 1時間ぶんの自然な高さ。1時間のタスクなら
// タイトル+時刻/実績+タグ1行が収まるようこの縮尺にしている。これ未満の
// 短いタスクは簡易表示になり、タップで一時的にこの高さまで展開できる。
const FULL_CONTENT_PX = 60 * PX_PER_MIN;
const TIMELINE_SNAP_MIN = 15; // 空白タップでの新規作成の時刻スナップ単位
const DEFAULT_NEW_TASK_MINUTES = 60; // 新規タスク作成時の既定所要時間
// 上端/下端リサイズのつかみ判定領域(タイムラインの箱・ドラッグ処理の両方から
// 参照)。移動用の領域を広く取りたいという指摘を受け、12px→9px→6pxの順に
// 狭めてきたが、iPad実機での試用で「サイズ変更のつもりが移動になってしまう
// ことが多い」という指摘を受けた。常時同じ小さいゾーンで反応させる方式の
// まま拡大すると今度は移動用の領域を圧迫するため、「長押しで選択(armed)
// してから大きなハンドルでリサイズする」を主経路にし、選択していない
// (armedでない)箱にも控えめな常時ゾーンを残すハイブリッド方式にした
// (マウス/トラックパッドでの直接ドラッグや、慣れたユーザーの近道として
// 機能する)。DRAG_EDGE_ZONE_PXはarmed状態用の値。「UIパーツをもう少し
// 大きくしたい」という指摘を受け12px→15pxに引き上げた(タイムラインの
// 1時間あたりの高さ(PX_PER_MIN)自体は指摘を受けて据え置いているため、
// 短いタスクほどこのゾーンを確保する余地が狭くなる。MIN_RESIZE_BOX_PXが
// 連動して大きくなる分、armedでリサイズできる最短の所要時間もわずかに
// 伸びるが、その場合も編集画面からの直接入力で代替できる)。
const DRAG_EDGE_ZONE_PX = 15;
// armed(選択+長押し)でない箱の常時ゾーン。同じ理由で6px→8pxに引き上げた。
const PASSIVE_DRAG_EDGE_ZONE_PX = 8;
// 上端+下端のつかみ判定領域(ゾーン幅×2)に加えて、移動用に最低限の余白
// (12px)を残せる高さが無いと、短い箱では上下のリサイズ判定が重なり合い
// 移動の判定領域が消えてしまう(実際に指摘を受けたバグ)。この高さ未満の
// 箱ではその状態(armed/passive)のリサイズ用つかみ領域自体を描画しない
// (箱全体が移動用のまま。時間の長さを変えたい場合は編集画面から入力する)。
const MIN_RESIZE_BOX_PX = DRAG_EDGE_ZONE_PX * 2 + 12;
const MIN_RESIZE_BOX_PX_PASSIVE = PASSIVE_DRAG_EDGE_ZONE_PX * 2 + 12;
// 長押しでタイムラインの箱を「選択+armed(大きなハンドル表示)」状態に
// するまでの時間。これ未満で指を離す、または閾値以上動かした場合は通常の
// タップ/移動ドラッグ/常時ゾーンでの直接リサイズとして扱われる
// (下記timelinePointerDown/Move参照)。
const LONG_PRESS_MS = 500;

// ==== 2. 日付・ID・小さな純粋ユーティリティ ====
function pad2(n) { return String(n).padStart(2, "0"); }

// Date.toISOString()はUTC基準のため日本時間では日付がズレる(深夜0〜8時台に前日扱いになる)。
// 必ずローカルのgetter経由で組み立てる。
function todayKey(d = new Date()) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
// "yyyy-mm-dd"のdayKeyをローカルタイムのDateに変換する(todayKey()の逆変換)。
function dayKeyToDate(dayKey) {
  const [y, m, d] = dayKey.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function addDays(dayKey, n) {
  const dt = dayKeyToDate(dayKey);
  dt.setDate(dt.getDate() + n);
  return todayKey(dt);
}
function genId() {
  // crypto.randomUUID()はsecure context要求でfile://での可用性が不透明なため自前生成にする。
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function toMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}
// 開始・終了時刻は常にTIMELINE_SNAP_MIN(15分)刻みに揃える。<input type="time">
// のstep="900"はSafari/iOSのホイールピッカーでは効くが、手入力やブラウザに
// よっては素通りすることがあるため、保存時にも必ずここでスナップし直す
// (UIのヒントだけに頼らない防御的な最終チェック)。
function snapMinutesToGrid(min) {
  return Math.round(min / TIMELINE_SNAP_MIN) * TIMELINE_SNAP_MIN;
}
function formatDuration(min) {
  if (min < 60) return `${min}分`;
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h}時間${m}分` : `${h}時間`;
}
function formatMMSS(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60), s = total % 60;
  return `${pad2(m)}:${pad2(s)}`;
}
function formatJapaneseDate(d) {
  const days = ["日", "月", "火", "水", "木", "金", "土"];
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${days[d.getDay()]})`;
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

// ==== 3. ストレージ層 ====
function defaultState() {
  return {
    schemaVersion: SCHEMA_VERSION,
    settings: { ...DEFAULT_SETTINGS },
    days: {},
    streak: { current: 0, longest: 0, lastAchievedDay: null },
    activeSession: null,
    pausedSessions: {}, // taskId -> {kind, pausedRemainingMs}。一時停止中に他タスクへ切り替えた際の退避先
    lastOpenedDay: todayKey(),
    wbs: [], // WBSノード: {id, parentId, name, deleted}[]
    archive: { monthlySummaries: {} },
  };
}
function ensureDay(state, dayKey) {
  if (!state.days[dayKey]) state.days[dayKey] = { tasks: [], finalized: false };
  return state.days[dayKey];
}
// タグ配列(state.tags)からWBSノード(state.wbs)への構造変更に伴い、
// スキーマバージョン不一致(=旧バージョンが書いたデータ)は救済せず
// defaultState()へ全リセットする(ユーザー確認済み。タスクの形自体が
// title/tags必須からwbsNodeId必須+memo任意へ変わるため、フィールド単位の
// 救済では旧タスクがwbsNodeIdを持てず不整合になる)。ここから下の処理は
// 同一バージョン内での防御的補完(配列でなければ空配列にする等)のみ。
function migrateState(raw) {
  if (!raw || typeof raw !== "object" || raw.schemaVersion !== SCHEMA_VERSION) return defaultState();
  const state = defaultState();
  state.settings = { ...DEFAULT_SETTINGS, ...(raw.settings || {}) };
  state.days = raw.days && typeof raw.days === "object" ? raw.days : {};
  state.streak = { current: 0, longest: 0, lastAchievedDay: null, ...(raw.streak || {}) };
  state.activeSession = raw.activeSession || null;
  // dayKeyの無い旧データ(このフィールド追加以前に保存されたactiveSession)は
  // 起動時点の実際の今日を採用する。ほとんどの場合はそれで正しく、日を
  // 跨いで残っていた極めて稀なケースだけ従来通り復元できない(元々このフィールドが
  // 無い時点で日跨ぎは考慮されていなかったため、退行にはならない)。
  if (state.activeSession && !state.activeSession.dayKey) state.activeSession.dayKey = todayKey();
  state.pausedSessions = raw.pausedSessions && typeof raw.pausedSessions === "object" ? raw.pausedSessions : {};
  for (const tid in state.pausedSessions) {
    if (!state.pausedSessions[tid].dayKey) state.pausedSessions[tid].dayKey = todayKey();
  }
  state.lastOpenedDay = raw.lastOpenedDay || todayKey();
  state.wbs = Array.isArray(raw.wbs) ? raw.wbs : [];
  state.archive = raw.archive && typeof raw.archive === "object" ? raw.archive : { monthlySummaries: {} };
  state.archive.monthlySummaries = state.archive.monthlySummaries && typeof state.archive.monthlySummaries === "object"
    ? state.archive.monthlySummaries : {};
  return state;
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    return migrateState(JSON.parse(raw));
  } catch (e) {
    console.error("loadState failed", e);
    return defaultState();
  }
}
function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error("saveState failed", e);
    alert("保存に失敗しました。ストレージの空き容量を確認してください。");
  }
}
function exportStateAsJson(state) {
  return JSON.stringify(state, null, 2);
}
function importStateFromJson(text) {
  return migrateState(JSON.parse(text));
}

// ==== 4. ドメインロジック ====
// 1ポモドーロ「ラウンド」=集中+休憩の合計分数(既定25+5=30分)。実際に
// タイムライン上で1ラウンドぶん確保するには休憩時間も含めた枠が必要な
// ため、計画ポモドーロ数はこの合計で割る(集中時間だけで割ると、休憩の
// 分だけ実際には収まらない数になってしまう)。新規タスク作成時の既定
// 所要時間にも同じ値を使う。
function pomodoroRoundMinutes(settings) {
  return settings.focusMinutes + settings.breakMinutes;
}
function computePlannedPomodoros(startTime, endTime, roundMinutes) {
  const minutes = toMinutes(endTime) - toMinutes(startTime);
  if (minutes <= 0) return null; // 日またぎタスクはv1では非対応
  return { plannedMinutes: minutes, plannedPomodoros: Math.max(1, Math.ceil(minutes / roundMinutes)) };
}
// 半開区間判定: ちょうど隣接する時間帯(例: 09:00-10:00と10:00-11:00)は
// 重なり無しとして許可する。タイムライン上でタスクの重なりを一切
// 発生させないための唯一のバリデーション経路(作成・編集の両方から通す)。
function hasOverlap(tasks, startTime, endTime, excludeId) {
  const s = toMinutes(startTime), e = toMinutes(endTime);
  return tasks.some(t => t.id !== excludeId && toMinutes(t.startTime) < e && s < toMinutes(t.endTime));
}
function addTask(state, dayKey, { wbsNodeId, memo, startTime, endTime }) {
  if (!wbsNodeId) throw new Error("WBSノードを選択してください");
  const computed = computePlannedPomodoros(startTime, endTime, pomodoroRoundMinutes(state.settings));
  if (!computed) throw new Error("終了時刻は開始時刻より後にしてください");
  const day = ensureDay(state, dayKey);
  if (hasOverlap(day.tasks, startTime, endTime, null)) {
    throw new Error("この時間帯には既に別のタスクがあります");
  }
  day.tasks.push({
    id: genId(), wbsNodeId, memo: memo || "", startTime, endTime,
    plannedMinutes: computed.plannedMinutes,
    plannedPomodoros: computed.plannedPomodoros,
    actualMinutes: 0,
    completed: false,
  });
}
function updateTask(state, dayKey, taskId, { wbsNodeId, memo, startTime, endTime, actualMinutes, completed }) {
  if (!wbsNodeId) throw new Error("WBSノードを選択してください");
  const day = state.days[dayKey]; if (!day) return;
  const task = day.tasks.find(t => t.id === taskId); if (!task) return;
  const computed = computePlannedPomodoros(startTime, endTime, pomodoroRoundMinutes(state.settings));
  if (!computed) throw new Error("終了時刻は開始時刻より後にしてください");
  if (hasOverlap(day.tasks, startTime, endTime, taskId)) {
    throw new Error("この時間帯には既に別のタスクがあります");
  }
  const prevWbsNodeId = task.wbsNodeId;
  task.wbsNodeId = wbsNodeId;
  task.memo = memo || "";
  task.startTime = startTime;
  task.endTime = endTime;
  task.plannedMinutes = computed.plannedMinutes;
  task.plannedPomodoros = computed.plannedPomodoros;
  task.actualMinutes = Math.max(0, Math.round(actualMinutes));
  task.completed = !!completed;
  if (prevWbsNodeId !== wbsNodeId) purgeOrphanedDeletedNodes(state);
}
function removeTask(state, dayKey, taskId) {
  const day = state.days[dayKey]; if (!day) return;
  day.tasks = day.tasks.filter(t => t.id !== taskId);
  purgeOrphanedDeletedNodes(state);
}
// タイムラインのドラッグ(移動・端リサイズ)専用の時刻書き換え。updateTask
// と違い重なりを例外で拒否しない(重なりの解決は呼び出し側が
// resolveDragOverlap/applyDragResultで先に済ませる前提の低レベル関数)。
function setTaskTimeRange(state, dayKey, taskId, startMin, endMin) {
  const day = state.days[dayKey]; if (!day) return;
  const task = day.tasks.find(t => t.id === taskId); if (!task) return;
  const computed = computePlannedPomodoros(formatHHMM(startMin), formatHHMM(endMin), pomodoroRoundMinutes(state.settings));
  if (!computed) return;
  task.startTime = formatHHMM(startMin);
  task.endTime = formatHHMM(endMin);
  task.plannedMinutes = computed.plannedMinutes;
  task.plannedPomodoros = computed.plannedPomodoros;
}
// ドラッグの結果[newStart,newEnd)が他のタスクと重なる場合の解決方法を
// 判定する(状態は変更しない、判定のみ)。
// - "none": 誰とも重ならない。
// - "swap": 重なる相手がちょうど1件かつ、新しい範囲がその相手の範囲と
//   完全に一致する(=入れ替えを意図したドラッグとみなす)。
// - "push": 重なった相手を移動方向へ隙間なく順に押し出す(玉突きで連鎖する
//   ことがある)。tasksは元々互いに重ならない前提(hasOverlapで担保済み)
//   なので、境界(boundary)より前に食い込む相手だけを順に押せば連鎖も
//   正しく解決できる。
// - "reject": 押し出した結果0:00〜24:00の範囲をはみ出す(操作を取り消す)。
function resolveDragOverlap(tasks, movingTaskId, newStart, newEnd, direction) {

// タグは"/"区切りのフラット文字列配列だったが、WBSはid/parentIdによる
// 素直な木構造にした(state.wbs: {id, parentId, name, deleted}[])。
// リネーム・親付け替えが文字列カスケード書き換え不要になり、中間ノードも
// 常に実在するため「実タグとして登録されていない仮想的な祖先」を補う処理も

// 兄弟以外のノードとの相対関係(どの位置に他の親のノードが挟まっているか)

// 行う: 並び替え後の兄弟id列(newOrderIds)が現在state.wbs内で占めている
// インデックス集合を昇順に求め(slots)、そのslotへnewOrderIdsを順番に
// 割り当て直す。こうすることで、兄弟以外のノードの位置(=slot自体)は

// idから祖先を辿ってパンくず文字列を作る(例: "仕事 › 開発 › レビュー")。

// lastOpenedDayを確定対象にする(「昨日」固定だと数日開かなかった場合に中間の日を誤って扱う)。

// ==== 4b. Undo/Redo(タスクの追加・編集・削除・ドラッグ移動の取り消し) ====

  if (!taskRedoStack.length) return;

  saveState(state);
  renderAll();
}

// ==== 5. タイマーエンジン(壁時計ベース) ====
let audioCtx = null;
const AudioCue = {
  unlock() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  },
  beep(freq = 880, duration = 0.18) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = "sine";
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration + 0.02);
    } catch (e) { console.error("beep failed", e); }
  },
};

  // 共用しているselectedDate)を記録する。壁時計は常に「今」進むが、

function getEntryForDate(dayKey) { return state.days[dayKey] || { tasks: [], finalized: false }; }

function incompleteTasksFor(dayKey) { return getEntryForDate(dayKey).tasks.filter(t => !t.completed); }

// 集中タブは予定タブとselectedDateを共用し、他日のタスクも実行対象に選べる。
// 「今やっていること」に基づく提案(壁時計のnowMinとの突き合わせ)は実際の
// 今日を見ている時だけ意味を持つため、他日を見ている時は単純に開始時刻が
// 最も早い未完了タスクを提案する。
function suggestTaskId() {
  const tasks = incompleteTasksFor(selectedDate);
  if (tasks.length === 0) return null;
  const sortedByStart = [...tasks].sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime));
  if (selectedDate !== todayKey()) return sortedByStart[0].id;
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const current = tasks.find(t => toMinutes(t.startTime) <= nowMin && nowMin < toMinutes(t.endTime));
  if (current) return current.id;
  const upcoming = sortedByStart.filter(t => toMinutes(t.startTime) >= nowMin);
  return (upcoming[0] || sortedByStart[0]).id;
}
function computeNowStatus(dayEntry) {
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const active = dayEntry.tasks.find(t => toMinutes(t.startTime) <= nowMin && nowMin < toMinutes(t.endTime));
  if (active) return { type: "active", task: active };
  const upcoming = dayEntry.tasks.filter(t => toMinutes(t.startTime) >= nowMin)
    .sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime));
  return { type: "free", next: upcoming[0] || null };
}

function wbsNodeName(state, id) {

// id/parentIdでグルーピングした素直な木構造を作る。タグ時代の
// buildTagTreeにあった「実タグとして存在しない中間パスを仮想ノードとして
// 補う」処理は、WBSでは親ノードが常に実在する(deleteWbsNodeが子を
// 繰り上げ/道連れのどちらかで必ず正しい親を維持する)ため不要。念のため
// 存在しないparentIdを参照するノードだけはルート扱いにフォールバックする
// (取りこぼして非表示になることを避けるための安全策)。
// 兄弟の並び順は名前の辞書順に並べ替えず、引数nodes(通常state.wbs)内での
// 相対順序をそのまま使う(=既定は追加順、reorderWbsNodeでの並び替え結果も
// そのまま反映される)。
function buildWbsTree(nodes) {
  const idSet = new Set(nodes.map(n => n.id));
  const byParent = new Map();
  for (const n of nodes) {
    const key = n.parentId && idSet.has(n.parentId) ? n.parentId : null;
    if (!byParent.has(key)) byParent.set(key, []);
    byParent.get(key).push(n);
  }
  const build = parentId => (byParent.get(parentId) || []).map(n => ({
    id: n.id, name: n.name, deleted: n.deleted, children: build(n.id),
  }));
  return build(null);
}
// renderRow(node, guides, isLast, isRoot)を各ノードについて呼ぶ。
// - guides: 祖先(ルート直下から自分の親まで)各階層について「まだ後続の
//   兄弟があるか」を表す真偽値の配列。ルート自身の枝は表示しない方針
//   (下記参照)のため、ルート直下のノードから蓄積を始める。
// - isLast: このノード自身が兄弟内で最後かどうか。自分の枝の縦棒を
//   下まで伸ばす(=次の兄弟に繋げる)かどうかに使う。
// - isRoot: このノードがルート(トップレベル)かどうか。ルートは見出し的な
//   扱いとして枝を一切表示しない(フラットな一覧として並べる)。
// renderRow側はrenderWbsGuideHtml(guides, isLast, isRoot)でインデント+
// ガイド線を組み立てる。以前は"│   "/"├── "のような文字列を組み立てて
// いたが、罫線記号だけで木構造を表現するのは古臭く見えるという指摘を
// 受け、CSSで実際の線を引く方式に作り直した。さらに「後続の兄弟がある
// 祖先階層だけ線を引く」だけの実装だと、並び替えの結果ノードが兄弟内の
// 最後になった途端そのノード配下の接続線が完全に消えて見た目上フラットに
// なる(内部の親子関係は保たれているのに繋がりが見えない)という実際に
// 踏んだ不具合があったため、「自分から親への枝(上半分の縦棒+横スタブ)は
// 兄弟内の位置に関わらず常に描画し、枝の下半分(次の兄弟へ繋げる部分)だけ
// isLastで出し分ける」方式にした。
// isCollapsed(id)が与えられ、あるノードについてtrueを返す場合、その
// ノードの行自体は描画するがchildrenの再帰描画をスキップする(折りたたみ)。
// 折りたたみは表示上のフィルタに過ぎずnodes自体(=state.wbs由来のツリー)は
// 一切変更しないため、ドラッグ並び替え等のデータ操作には影響しない。
function renderWbsTreeRows(nodes, guides, renderRow, isRootLevel, isCollapsed) {
  let html = "";
  nodes.forEach((node, i) => {
    const isLast = i === nodes.length - 1;
    html += renderRow(node, guides, isLast, !!isRootLevel);
    if (!node.children.length || (isCollapsed && isCollapsed(node.id))) return;
    const childGuides = isRootLevel ? [] : [...guides, !isLast];
    html += renderWbsTreeRows(node.children, childGuides, renderRow, false, isCollapsed);
  });
  return html;
}
// guides/isLast/isRootから、縦ガイド線+自分の枝(.wbs-row直下に絶対配置
// するspan列)とインデント幅を組み立てる。ルートは枝を一切描画しない
// (indentPx=0)。非ルートは、祖先の継続線(guides、後続の兄弟がある階層
// だけ)に加えて、自分の枝(常に上半分+横スタブを描画し、自分が最後で
// なければ下半分も描画)を1列ぶん追加する。線は.wbs-row(position:relative)
// の直接の子として絶対配置し、top:0;bottom:0(枝の上下半分はtop:0〜50%/
// 50%〜100%)で行の高さいっぱいに伸ばすことで、隣接する行の線が継ぎ目なく
// 繋がって見える。
const WBS_GUIDE_STEP_PX = 18;
function renderWbsGuideHtml(guides, isLast, isRoot) {
  if (isRoot) return { linesHtml: "", indentPx: 0 };
  const passThroughHtml = guides.map((hasMore, i) => hasMore
    ? `<span class="wbs-guide-line" style="left:${i * WBS_GUIDE_STEP_PX + 8}px"></span>`
    : ""
  ).join("");
  const branchLeft = guides.length * WBS_GUIDE_STEP_PX + 8;
  const branchHtml =
    `<span class="wbs-guide-branch-top" style="left:${branchLeft}px"></span>` +
    `<span class="wbs-guide-branch-h" style="left:${branchLeft}px; width:${WBS_GUIDE_STEP_PX - 8}px"></span>` +
    (isLast ? "" : `<span class="wbs-guide-branch-bottom" style="left:${branchLeft}px"></span>`);
  return { linesHtml: passThroughHtml + branchHtml, indentPx: (guides.length + 1) * WBS_GUIDE_STEP_PX };
}
function formatHHMM(totalMin) {
  const clamped = Math.max(0, Math.min(24 * 60, totalMin));
  return `${pad2(Math.floor(clamped / 60))}:${pad2(clamped % 60)}`;
}
// 展開中の短いタスクの周辺を「比例拡大」するための変換。
// 各展開タスクについて、それが属する時計の1時間(floor(taskStart/60)*60
// 〜+60。タスクがその1時間をはみ出す場合はタスク全体を含むまで広げる)を
// 「窓」とし、窓全体を「タスク自身の高さがFULL_CONTENT_PXになる」ような
// 係数k(=FULL_CONTENT_PX/自然な高さ)で一様に引き伸ばす。窓はタスク自身の
// 開始時刻(taskStart)を不動点として拡大する(タスクの上端の画面上の位置は
// 変わらない。以前は「タスク自身の後ろだけを固定量押し下げる」方式だった
// ため、タスク前後の実時間比がタスクの展開で崩れて見える問題があった:
// 例えば30分タスクを展開すると、直前の30分ぶんの間隔はそのままなのに
// タスク自身だけ2倍になり、本来1:1のはずの比率が1:2に見えてしまっていた)。
// 窓は前後の既存タスク(または直前の展開領域の終端)を越えて広がらないよう
// クリップし、複数の展開領域が重ならないようにする。
//
// 【実際に踏んだバグとその修正】taskStart(不動点)からwsまで後方に伸びる
// ぶん、ws地点の画面上の位置は(伸びていない場合に比べて)手前にずれる。
// この「wsのずれ」を、ws未満(=窓より前の内容: 既存の時刻目盛りや別の
// タスク)に伝搬させずにいたところ、ws地点で不連続なジャンプが生じ、
// 「窓の直前の間隔がつぶれて見える」バグになっていた(例: 14:30〜15:00に
// タスクを置いたまま15:30〜16:00のタスクを展開すると、15:00のwsが

    <button type="button" data-action="wbs-picker:quick-add" ${(!trimmed || isDuplicate) ? "disabled" : ""}><svg class="icon"><use href="#icon-plus"></use></svg> 新規作成</button>
  </div>
  ${isDuplicate ? `<div class="wbs-quick-add-duplicate-note">同じ場所に同名のノードが既にあります</div>` : ""}`;
  container.innerHTML = matchesHtml + quickAddHtml;
}
function renderNowBanner() {

      // 現在進行中のタスクがある場合だけ、バナー自体をタップして集中タブへ

  // 目安になる)。日付ナビと同じsticky領域に常に何か表示しておくことで、
  // 日付を切り替えるたびにヘッダーの高さが変わってガタつくのも防げる。
  const tasks = getSelectedEntry().tasks;
  el.className = "now-banner";
  el.innerHTML = tasks.length
    ? `<svg class="icon"><use href="#icon-schedule"></use></svg> ${tasks.length}件の予定(完了${tasks.filter(t => t.completed).length}件)`
    : `<svg class="icon"><use href="#icon-schedule"></use></svg> この日の予定はまだありません`;
  delete el.dataset.action; delete el.dataset.id;
}
function renderTimelineHtml(entry) {
  const isToday = selectedDate === todayKey();
  // 選択中のタスクが(日付切り替え・削除等で)この日のエントリに存在しない
  // 場合は選択を自動的に解除する。呼び出し側ごとに個別のクリア処理を
  // 書かなくて済むよう、再描画のたびにここで自己修復する。
  if (selectedTimelineTaskId && !entry.tasks.some(t => t.id === selectedTimelineTaskId)) {
    selectedTimelineTaskId = null;
  }
  // resizeArmedTaskIdはselectedTimelineTaskIdの部分集合という不変条件
  // (selectTimelineTask/armTimelineSelection参照)。上記の自己修復で
  // selectedTimelineTaskIdだけがnullに戻った場合に取り残さないよう、
  // ここでも同じ条件で揃える。
  if (resizeArmedTaskId && resizeArmedTaskId !== selectedTimelineTaskId) {
    resizeArmedTaskId = null;
  }
  const sorted = [...entry.tasks].sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime));
  const breakpoints = computeTimelineBreakpoints(sorted);
  let hourRows = "";
  for (let h = 0; h < 24; h++) {
    hourRows += `<div class="timeline-hour-row" style="top:${minuteToY(h * 60, breakpoints)}px">
      <span class="timeline-hour-label">${pad2(h)}:00</span>
    </div>`;
  }
  let nowLine = "";
  if (isToday) {
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    nowLine = `<div class="timeline-now-line" id="timelineNowLine" style="top:${minuteToY(nowMin, breakpoints)}px"></div>`;
  }
  const tasksHtml = sorted.map(t => {
    const startMin = toMinutes(t.startTime), endMin = toMinutes(t.endTime);
    const naturalHeight = (endMin - startMin) * PX_PER_MIN;
    const top = minuteToY(startMin, breakpoints);
    // heightは常にminuteToYの差分で求める(自分自身がexpandedTimelineTaskIds
    // に入っているかどうかで決め打ちしない)。展開中のタスク自身については、
    // この式が必ずFULL_CONTENT_PXに一致することは設計上保証されている
    // (taskTopYを基準にk倍する式から導出可能)。一方、展開していない別の
    // タスクが展開領域の「窓」の中に位置だけ引きずられて動く場合、そのタスク
    // 自身も窓と同じ比率で拡大されないと、位置(top)だけ動いて高さ(height)は
    // 元のままという不整合になり、実際にそのバグが起きていた(窓の中の
    // 別タスクが縮んで見える・隣のタスクとの間に説明のつかない隙間ができる)。
    const height = minuteToY(endMin, breakpoints) - top;
    // 「見た目上展開されているか」は、自分自身がexpandedTimelineTaskIdsに
    // 入っているかではなく、実際にnaturalHeightより高く描画されているかで
    // 判定する。他の展開タスクの窓に巻き込まれて一緒に拡大されているタスク
    // (自分自身は未展開)も見た目は区別が付かないため、同じくタップで
    // トグルできるようにする。トグルする対象は、実際に展開の起点になって
    // いるタスク(driverTaskId)であり、巻き込まれているだけの自分自身の
    // IDをトグルしてもexpandedTimelineTaskIdsに変化が起きない
    // (timelineTaskBoxHtml参照)。
    const isExpanded = height > naturalHeight + 0.01;
    const region = isExpanded ? breakpoints.find(r => r.ws <= startMin && endMin <= r.we) : null;
    const driverTaskId = region ? region.driverTaskId : t.id;
    const isExpandable = naturalHeight < FULL_CONTENT_PX;
    return timelineTaskBoxHtml(
      t, top, height, isExpanded, driverTaskId, isExpandable,
      t.id === selectedTimelineTaskId, t.id === resizeArmedTaskId
    );
  }).join("");
  const totalHeight = 24 * 60 * PX_PER_MIN + timelineTotalExtra(breakpoints);
  return `
    <div class="timeline-wrap" id="timelineWrap" data-action="timeline:add-at" style="height:${totalHeight}px">
      ${hourRows}
      ${nowLine}
      ${tasksHtml}
    </div>`;
}
// autoscroll:trueは日付切り替え・タブ切り替え・初期表示の時だけ指定する
// (「今」または最初のタスク付近へスクロールする)。チェックボックス
// トグルやタスク作成/編集/タグ変更後の再描画では指定せず、現在の
// スクロール位置を保つ(その場の操作でビューが飛ぶと使いづらいため)。
function renderTodayView({ autoscroll = false } = {}) {
  const container = document.getElementById("todayView");
  const entry = getSelectedEntry();
  container.innerHTML = `
    ${renderTimelineHtml(entry)}
    <button class="timeline-add-fab" data-action="task:add-open" aria-label="タスクを追加"><svg class="icon"><use href="#icon-plus"></use></svg></button>
  `;
  // 日付ナビ・▾/▴・バナーはヘッダーに統合済み(renderAppHeader参照)。
  renderAppHeader();
  if (autoscroll) scrollTimelineToRelevantPosition(entry);
}
function scrollTimelineToRelevantPosition(entry) {
  const main = document.querySelector("main");
  if (!main) return;
  const isToday = selectedDate === todayKey();
  let target = isToday ? document.getElementById("timelineNowLine") : null;
  if (!target) {
    const sorted = [...entry.tasks].sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime));
    if (sorted.length) target = document.querySelector(`.timeline-task[data-id="${sorted[0].id}"]`);
  }
  // ヘッダーはmainの外(#appの直接の子)にあり常時表示されているため、
  // main自身のスクロール可能領域の上端が既にヘッダーの下から始まっている。
  // そのためヘッダーの高さぶんの追加クリアランスは不要で、見た目の余白
  // (16px)だけを確保すればよい(以前はヘッダーの一部(日付ナビ・バナー)が
  // main内のposition:stickyだったため、その高さを実測して足す必要があった)。
  const clearance = 16;
  if (target) {
    const targetTop = target.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop;
    main.scrollTop = Math.max(0, targetTop - clearance);
  } else {
    main.scrollTop = 0;
  }
}

// ---- 6b. タスク作成/編集モーダル(共用) ----
// editingTaskId===nullなら新規作成モード。dayKeyは呼び出し元が明示的に
// 渡す(タイムライン発なら選択中の日付、集中タブ発なら実際の今日)。
// 「予定」タブのselectedDateに決め打ちすると、集中タブ(常に実際の今日を
// 扱う)発の編集でselectedDateが別日を指している場合に対象を見失うため。
function openTaskModal(taskId, dayKey) {
  editingTaskId = taskId;
  editingTaskDayKey = dayKey;
  const isEdit = taskId !== null;
  const task = isEdit ? getEntryForDate(dayKey).tasks.find(t => t.id === taskId) : null;
  if (isEdit && !task) return;
  document.getElementById("taskModalTitle").textContent = isEdit ? "タスクを編集" : "タスクを追加";
  document.getElementById("taskModalSaveBtn").textContent = isEdit ? "保存" : "追加";
  document.getElementById("taskModalDeleteBtn").style.display = isEdit ? "" : "none";
  document.getElementById("taskEditOnlyFields").style.display = isEdit ? "" : "none";
  document.getElementById("editTaskStart").value = isEdit ? task.startTime : "";
  document.getElementById("editTaskEnd").value = isEdit ? task.endTime : "";
  document.getElementById("editTaskMemo").value = isEdit ? (task.memo || "") : "";
  taskFormWbsNodeId = isEdit ? task.wbsNodeId : null;
  renderEditWbsPicker();
  if (isEdit) {
    document.getElementById("editTaskActual").value = task.actualMinutes;
    document.getElementById("editTaskCompleted").checked = task.completed;
    // 実行中だけでなく一時停止中(=他タスクへ退避されpausedSessionsに
    // 待避中)のセッションも対象に含める。以前はactiveSessionだけを見て
    // いたため、一時停止して別タスクに切り替えた直後は退避先のタスクの
    // 実績欄が編集可能なままという抜けがあった(削除ガードのhasSessionInProgress
    // とは異なる基準になっていた)。
    const timerInProgress = hasSessionInProgress(taskId);
    document.getElementById("editTaskActual").disabled = timerInProgress;

function openTaskCreateModal(dayKey, prefillStart, prefillEnd) {

  document.getElementById("editTaskEnd").value = prefillEnd || "";

function closeTaskEditModal() {

  editingTaskDayKey = null;
}
function saveTaskEditFromForm() {
  const memo = document.getElementById("editTaskMemo").value.trim();
  // 開始・終了時刻は必ず15分刻みに揃える(step="900"はSafariのホイール
  // ピッカーには効くが、手入力やそれ以外のブラウザでは素通りしうるため、
  // ここで最終的にスナップし直す)。
  const start = document.getElementById("editTaskStart").value
    ? formatHHMM(snapMinutesToGrid(toMinutes(document.getElementById("editTaskStart").value)))
    : "";
  const end = document.getElementById("editTaskEnd").value
    ? formatHHMM(snapMinutesToGrid(toMinutes(document.getElementById("editTaskEnd").value)))
    : "";
  const isEdit = editingTaskId !== null;
  const actualInput = document.getElementById("editTaskActual");
  let actual = 0;
  if (isEdit) {
    actual = actualInput.disabled
      ? getEntryForDate(editingTaskDayKey).tasks.find(t => t.id === editingTaskId).actualMinutes
      : Number(actualInput.value);
  }
  const completed = isEdit ? document.getElementById("editTaskCompleted").checked : false;
  if (!start || !end) { alert("時刻を入力してください"); return; }
  if (!taskFormWbsNodeId) { alert("WBSノードを選択してください"); return; }
  if (!Number.isFinite(actual) || actual < 0) { alert("実績時間は0以上の数値にしてください"); return; }
  recordUndoPoint();
  try {
    if (isEdit) {
      updateTask(state, editingTaskDayKey, editingTaskId, {
        wbsNodeId: taskFormWbsNodeId, memo, startTime: start, endTime: end,
        actualMinutes: actual, completed,
      });
    } else {
      addTask(state, editingTaskDayKey, { wbsNodeId: taskFormWbsNodeId, memo, startTime: start, endTime: end });
    }
    saveState(state);
    closeTaskEditModal();
    if (currentView === "today") renderTodayView();
    if (currentView === "focus") renderFocusView();
    renderAppHeader();
  } catch (err) {
    discardPendingUndoSnapshot();
    alert(err.message);
  }
}
// 実行中/一時停止中(=activeSession)・退避中(=pausedSessions)のいずれかの
// 未確定な集中タイマー進捗を持つタスクは、それを黙って失わせないよう
// 削除を拒否する。
function hasSessionInProgress(taskId) {
  return (state.activeSession && state.activeSession.taskId === taskId) || !!state.pausedSessions[taskId];
}
function deleteFromTaskModal() {
  if (editingTaskId === null) return;
  if (hasSessionInProgress(editingTaskId)) {
    alert("このタスクには実行中または中断中の集中セッションがあります。先に終了してください。");
    return;
  }
  if (!confirm("このタスクを削除しますか?")) return;
  recordUndoPoint();
  removeTask(state, editingTaskDayKey, editingTaskId);
  saveState(state);
  closeTaskEditModal();
  if (currentView === "today") renderTodayView();
  if (currentView === "focus") renderFocusView();
  renderAppHeader();
}

// 集中タブは予定タブとselectedDateを共用し、他日のタスクも選んで実行できる
// (壁時計は常に「今」進むため、タイマー自体の挙動はどの日を見ていても
// 変わらない。streak・「今: ◯◯」バナーだけは引き続きtodayKey()固定で、
// このタブの日付ナビとは独立している)。日付ナビ自体はヘッダーに統合済み
// (renderAppHeader参照)なので、ここでは表示しない。
// resetScroll:trueはタブ切り替え・日付ナビ操作の時だけ指定する(予定タブ
// 側で長くスクロールしたまま集中タブに来ると、集中タブの短いコンテンツが
// スクロール位置の関係で見えなくなることがあるため)。予定タブの
// renderTodayView({autoscroll})と同じ考え方で、「新しい文脈に入る」
// タイミングだけ#focusViewの先頭が見えるようmainのスクロール位置を
// リセットする。それ以外の再描画(一時停止/再開等)ではその場の見た目を
// 保つ)。
function renderFocusView({ resetScroll = false } = {}) {
  const container = document.getElementById("focusView");
  const entry = getSelectedEntry();
  const session = state.activeSession;

  if (!session) {
    if (focusSelectedTaskId === null || !entry.tasks.some(t => t.id === focusSelectedTaskId)) {
      focusSelectedTaskId = suggestTaskId();
    }
  }

  // セッション中のタスクは、そのセッションが開始した日(session.dayKey)から
  // 探す。日を跨いで実行中/一時停止中のまま残った場合や、セッション中に
  // 日付ナビで別日へ移動した場合、entry(=selectedDate)にはそのタスクが
  // 存在しないため、entryだけを見ると見失う(以前はここでタスクが見つからず、
  // タイトル・実績が表示されなくなるバグがあった)。
  const sessionTask = session ? getEntryForDate(session.dayKey).tasks.find(t => t.id === session.taskId) : null;
  const sessionTaskOtherDay = !!(session && session.dayKey !== selectedDate);

  const selectedId = session ? session.taskId : focusSelectedTaskId;
  const selectedTask = session ? sessionTask : (entry.tasks.find(t => t.id === selectedId) || null);
  // 通常はselectedDateのタスクだけを選択肢にする。セッションのタスクが
  // 別日(日を跨いだ、または日付ナビで移動した)でselectedDateのリストに
  // 存在しない場合だけ、先頭に追加してselectedとして見えるようにする
  // (selectのdisabledと合わせて、他タスクへの切替はできないが現在の対象が
  // 何かは正しく表示する)。
  const optionSourceTasks = sessionTaskOtherDay && sessionTask ? [sessionTask, ...entry.tasks] : entry.tasks;
  const options = optionSourceTasks.map(t => {
    const isPausedHere = !!(session && session.paused && session.taskId === t.id);
    const pausedMark = (state.pausedSessions[t.id] || isPausedHere) ? "⏸ " : "";
    const doneMark = t.completed ? "✓ " : "";
    const otherDayMark = (sessionTaskOtherDay && t.id === session.taskId)
      ? `(${formatJapaneseDate(dayKeyToDate(session.dayKey))}から継続) ` : "";
    return `<option value="${t.id}" ${t.id === selectedId ? "selected" : ""}>${pausedMark}${doneMark}${otherDayMark}${escapeHtml(wbsNodeName(state, t.wbsNodeId))}</option>`;
  }).join("");

  let timerHtml;
  if (session) {
    const remaining = session.paused ? session.pausedRemainingMs : session.endAt - Date.now();
    const phase = session.kind === "focus" ? "集中" : "休憩";
    const task = sessionTask;
    const blocksDone = task ? Math.round(task.actualMinutes / state.settings.focusMinutes) : 0;
    const blocksTotal = task ? task.plannedPomodoros : 0;
    timerHtml = `
      <div class="timer-phase">${phase}${task ? "・" + escapeHtml(wbsNodeName(state, task.wbsNodeId)) : ""}</div>
      <div class="timer-display">${formatMMSS(remaining)}</div>
      ${task ? `<div class="timer-progress">${blocksDone}/${blocksTotal} ブロック完了</div>` : ""}
      <div class="timer-controls">
        ${session.paused
          ? '<button class="btn primary" data-action="resume">再開</button>'
          : '<button class="btn" data-action="pause">一時停止</button>'}
        <button class="btn danger-outline" data-action="finish">終了</button>
      </div>
      ${session.paused && !sessionTaskOtherDay ? '<div class="timer-hint">一時停止中は上のリストから別のタスクに切り替えられます</div>' : ""}
      ${sessionTaskOtherDay ? '<div class="timer-hint">表示中の日付とは別の日のタスクのため、他のタスクへの切り替えはできません。先に「終了」してください。</div>' : ""}`;
  } else {
    timerHtml = `
      <div class="timer-phase">タスクを選んで開始</div>
      <div class="timer-display">${pad2(state.settings.focusMinutes)}:00</div>
      <div class="timer-controls">
        <button class="btn primary" data-action="start-focus" ${entry.tasks.length === 0 ? "disabled" : ""}>集中スタート</button>
      </div>`;
  }

  // 実行中(一時停止していない)のセッションに加え、別日のセッションも
  // 選択肢を固定する(上記のoptionSourceTasksの特別扱いと対にして、
  // 「表示中の日のタスクに切り替えたつもりが別日のタスクの残り状態を壊す」
  // ことを防ぐ)。
  const selectDisabled = !!(session && (!session.paused || sessionTaskOtherDay));
  container.innerHTML = `
    <div class="focus-select-row">
      <select id="focusTaskSelect" ${selectDisabled ? "disabled" : ""}>
        ${optionSourceTasks.length ? options : '<option value="">タスクがありません</option>'}
      </select>
      <button class="icon-btn glyph-icon-btn" data-action="task:edit-open" data-id="${selectedId || ""}" data-day="${session ? session.dayKey : selectedDate}"
        aria-label="編集" ${selectedId ? "" : "disabled"}><svg class="icon"><use href="#icon-edit"></use></svg></button>
      <button class="icon-btn glyph-icon-btn danger" data-action="focus:delete-selected" data-id="${selectedId || ""}"
        aria-label="削除" ${selectedId ? "" : "disabled"}><svg class="icon"><use href="#icon-delete"></use></svg></button>
    </div>
    ${renderFocusTaskDetailHtml(selectedTask)}
    <div class="timer-card">${timerHtml}</div>
  `;
  // 日付ナビはヘッダーに統合済み(renderAppHeader参照)。
  renderAppHeader();
  if (resetScroll) {
    const main = document.querySelector("main");
    if (main) main.scrollTop = 0;
  }
}
function renderFocusTaskDetailHtml(task) {
  if (!task) return "";
  // 集中タブはタスクの唯一の識別子であるWBSノードを確認してから取り組む

  // パンくずのフルパスで表示する。
  const memoHtml = task.memo ? `<div class="task-memo">${escapeHtml(task.memo)}</div>` : "";
  return `
    <div class="focus-task-detail">
      <div class="focus-task-detail-title ${task.completed ? "done" : ""}">${escapeHtml(wbsNodePath(state, task.wbsNodeId))}${task.completed ? "(完了済み)" : ""}</div>
      <div class="focus-task-detail-meta">
        ${task.startTime}〜${task.endTime}・計画${formatDuration(task.plannedMinutes)}(<svg class="icon"><use href="#icon-tomato"></use></svg>${task.plannedPomodoros})・実績${formatDuration(task.actualMinutes)}
      </div>
      ${memoHtml}
    </div>`;
}

function buildHeatmap(days) {
  const today = todayKey();
  let html = "";
  for (let i = days - 1; i >= 0; i--) {
    const dayKey = addDays(today, -i);
    const entry = state.days[dayKey];
    const rate = entry ? computeCompletionRate(entry) : 0;
    const level = entry && entry.tasks.length ? Math.min(4, Math.ceil(rate * 4)) : 0;
    html += `<div class="heat-cell level-${level}" data-day="${dayKey}" data-rate="${Math.round(rate * 100)}"></div>`;
  }
  return html;
}
// resetScroll:trueはタブ切り替え(switchView)の時だけ指定する。予定/集中
// タブのrenderTodayView({autoscroll})/renderFocusView({resetScroll})と同じ
// 考え方だが、実績タブは日付ナビ操作(renderCurrentDateView)では他の2タブと
// 違って画面の大半(streak・ヒートマップ・WBS別集計)がselectedDateに連動

// 入った直後だけ先頭が見える」という初期状態の保証だけに絞っている。

  // 据え置く(streakは仕様上常に実際の今日基準、ヒートマップは直近28日の
  // 傾向表示、WBS別集計・全期間実績は集計期間全体が対象)。
  const entry = getEntryForDate(selectedDate);

      <div class="streak-box">
        <div class="streak-value">${state.streak.longest}</div>
        <div class="streak-label">最長記録</div>
      </div>
      <div class="streak-box">
        <div class="streak-value">${Math.round(rate * 100)}%</div>
        <div class="streak-label">完了率</div>
      </div>
    </div>
    <table class="today-table">
      <thead><tr><th>タスク</th><th>計画</th><th>実績</th><th>完了</th></tr></thead>

    </table>
    <div class="heatmap-section">
      <div class="heatmap-title">直近28日間</div>
      <div class="heatmap-grid">${buildHeatmap(28)}</div>
      <div id="heatmapDetail" class="heatmap-detail"></div>
    </div>
    <div class="heatmap-section">
      <div class="app-header-row wbs-agg-header-row">
        <div class="heatmap-title">WBS別集計(全期間)</div>

      </div>

    <div class="all-time-row"><svg class="icon"><use href="#icon-book"></use></svg> 全期間の実績: ${formatDuration(allTime.actualMinutes)}(完了 ${allTime.completedCount}件)</div>

  // 日付ナビ・streakバッジはヘッダーに統合済み(renderAppHeader参照)。

  renderAppHeader();
