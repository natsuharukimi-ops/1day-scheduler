// buildWbsTree(state.wbs)が返す木(実ノードのみ)に、表示専用の「その他」
// 合成ノードを差し込む。子ノードだけでなくそのノード自身に直接割り当て
// られたタスクもありうる(リーフでないノードにもタスクを割り当てられる
// 仕様のため)ため、子を持つノードでは(自ノード合計−子ノード合計の総和)を
// 計算し、正の場合だけ末尾に葉として追加する。isOther/valueは合成ノード
// 専用のフィールドで、実ノード(state.wbs由来)には存在しない。
function buildWbsStatsTree(tree, totals) {
  const zero = { planned: 0, actual: 0 };
  return tree.map(node => {
    const children = buildWbsStatsTree(node.children, totals);
    if (node.children.length > 0) {
      const nodeTotal = totals[node.id] || zero;
      const childPlannedSum = node.children.reduce((sum, c) => sum + (totals[c.id] ? totals[c.id].planned : 0), 0);
      const childActualSum = node.children.reduce((sum, c) => sum + (totals[c.id] ? totals[c.id].actual : 0), 0);
      const otherPlanned = nodeTotal.planned - childPlannedSum;
      const otherActual = nodeTotal.actual - childActualSum;
      if (otherPlanned > 0 || otherActual > 0) {
        children.push({
          id: `${node.id}:other`, name: "その他(このノードに直接割り当てられたタスク)",
          deleted: false, children: [], isOther: true, value: { planned: otherPlanned, actual: otherActual },
        });
      }
    }
    return { ...node, children };
  });
}
// 木(buildWbsTree由来、合成「その他」ノードは子を持たないので自然に除外
// される)を歩いて、子を持つノード(=折りたたみ/展開の対象になりうる
// ノード)のidを列挙する。全展開/全折りたたみボタンの対象集合と、
// そのボタン自体の「今すべて展開済みか」判定の両方で使う。
function wbsTreeIdsWithChildren(tree) {
  const ids = [];
  const walk = nodes => {
    for (const n of nodes) {
      if (n.children.length) { ids.push(n.id); walk(n.children); }
    }
  };
  walk(tree);
  return ids;
}
// タイムラインの▾/▴(短いタスクの全展開/全折りたたみ、renderHeaderDateNavHtml
// 参照)と同じ、単一ボタンでの全展開⇄全折りたたみ切り替え。対象(子を持つ
// ノード)が1つも無ければ日付ナビのボタンと同様disabledにする。
function renderWbsAggToggleAllBtnHtml() {
  const idsWithChildren = wbsTreeIdsWithChildren(buildWbsTree(state.wbs.filter(n => !n.deleted)));
  const hasAny = idsWithChildren.length > 0;
  const allExpanded = hasAny && idsWithChildren.every(id => statsExpandedNodeIds.has(id));
  return `<button class="icon-btn date-nav-btn" data-action="stats:toggle-collapse-all"
    aria-label="${allExpanded ? "WBSをすべて折りたたむ" : "WBSをすべて展開する"}" ${hasAny ? "" : "disabled"}>
    <svg class="icon"><use href="#${allExpanded ? "icon-unfold-less" : "icon-unfold-more"}"></use></svg></button>`;
}
// 自動アーカイブ廃止(上記4a節参照)により、ここでの「全期間」は文字通り
// state.days全体が対象になる(以前はアーカイブ済みの月が内訳を失っていた
// ため、実質「保持期間内の全期間」に限られていた)。
// 以前はパンくず+行タップで1段ずつ子ノードに潜るドリルダウン方式だった
// (現在地の直下しか描画しないためスケールする、という理由で採用)。
// しかし「開閉をフィルタとして捉えれば、もっとシンプルに表現できるのでは」
// という指摘を受けて考え直した結果、WBS管理モーダル用に作った折りたたみ
// つきツリー(renderWbsTreeRows/renderWbsGuideHtml、wbsCollapsedNodeIds)を
// そのまま流用する方式に置き換えた。computeWbsAggregatesが元々全ノード分の
// ロールアップ済み集計を返していたため、「折りたたんでも自分自身の合計は
// 表示され続け、子の内訳行だけ隠れる」(Finderのフォルダサイズ表示や会計の
// 費目集計ツリーと同じ)という素直な挙動になり、パンくず往復なしで複数
// ブランチの合計を見比べられるようにもなった。「潜れる行」を示すための
// 専用スタイル(アクセント色+太字+シェブロン)も、WBS管理モーダルの
// ▼/▶トグルが同じ役割を兼ねるため不要になった。
// 削除済み(tombstone)ノードは実績タブの内訳には出さない(「削除済みタスクは
// 実績ビューの集計には出さなくて良い」という要望)。木を組み立てる時点で
// state.wbsから除外するため、tombstoneノード自身の合計はその子ではなく
// なる(buildWbsStatsTreeが「子の合計との差分」として計算する「その他」に
// 自動的に吸収される)。tombstoneのちょうど親だった非表示ノードにdeleted:
// trueな子がいた場合(subtree削除)もこのfilterで一緒に取り除かれるため、
// 個別にまた辿る必要はない。全期間の実績(computeAllTimeTotals)はこの木を
// 経由しない独立集計なので、ここで除いても合計自体が減ることはない。
function renderWbsAggregatesHtml() {
  const visibleWbs = state.wbs.filter(n => !n.deleted);
  if (!visibleWbs.length) return '<div class="empty-hint">WBSノードはまだありません</div>';
  const totals = computeWbsAggregates(Object.values(state.days), state.wbs);
  const zero = { planned: 0, actual: 0 };
  const tree = buildWbsStatsTree(buildWbsTree(visibleWbs), totals);
  return renderWbsTreeRows(tree, [], (node, guides, isLast, isRoot) => {
    const guide = renderWbsGuideHtml(guides, isLast, isRoot);
    const hasChildren = node.children.length > 0;
    const collapsed = !statsExpandedNodeIds.has(node.id);
    const toggleHtml = hasChildren
      ? `<button type="button" class="icon-btn glyph-icon-btn wbs-toggle-slot wbs-toggle-btn" data-action="stats:toggle-collapse" data-id="${node.id}" aria-label="${collapsed ? "展開" : "折りたたむ"}" aria-expanded="${!collapsed}"><svg class="icon${collapsed ? "" : " icon-rotate-down"}"><use href="#icon-chevron"></use></svg></button>`
      : `<span class="wbs-toggle-slot"></span>`;
    const t = node.isOther ? node.value : (totals[node.id] || zero);
    const nameHtml = node.isOther
      ? `<span class="wbs-row-name wbs-agg-other-label">${escapeHtml(node.name)}</span>`
      : `<span class="wbs-row-name">${escapeHtml(node.name)}</span>`;
    return `<div class="wbs-row">
      ${guide.linesHtml}
      <span class="wbs-row-label" style="padding-left:${guide.indentPx}px">
        ${toggleHtml}${nameHtml}
      </span>
      <span class="wbs-row-value">${formatDuration(t.planned)} 計画 / ${formatDuration(t.actual)} 実績</span>
    </div>`;
  }, true, id => !statsExpandedNodeIds.has(id));
}

function switchView(view) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.dataset.view === view));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === view));
  currentView = view;
  renderAppHeader();
  if (view === "today") renderTodayView({ autoscroll: true });
  if (view === "focus") renderFocusView({ resetScroll: true });
  if (view === "stats") renderStatsView({ resetScroll: true });
}
// 予定タブ・集中タブ・実績タブはselectedDateを共用しているため、日付ナビ
// (date:prev等・カレンダーのcal:pick)は現在表示中のタブに応じてどれか
// 1つだけを再描画する(非表示のタブは次に切り替えられた時に作り直される
// ため先回りの再描画は不要)。
function renderCurrentDateView() {
  if (currentView === "today") renderTodayView({ autoscroll: true });
  if (currentView === "focus") renderFocusView({ resetScroll: true });
  if (currentView === "stats") renderStatsView();
}

// ---- 6a. カレンダーモーダル ----
function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); }
function firstWeekdayOfMonth(year, month) { return new Date(year, month - 1, 1).getDay(); }
function openCalendar() {
  const [y, m] = selectedDate.split("-").map(Number);
  calendarViewMonth = { year: y, month: m };
  renderCalendarModal();
  document.getElementById("calendarModal").classList.remove("hidden");
}
function closeCalendar() {
  document.getElementById("calendarModal").classList.add("hidden");
}
function renderCalendarModal() {
  const { year, month } = calendarViewMonth;
  const total = daysInMonth(year, month);
  const offset = firstWeekdayOfMonth(year, month);
  const today = todayKey();
  const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
  const monthKey = `${year}-${pad2(month)}`;
  const archived = state.archive.monthlySummaries[monthKey];
  let cells = "";
  for (let i = 0; i < offset; i++) cells += '<div class="calendar-cell empty"></div>';
  for (let day = 1; day <= total; day++) {
    const dayKey = `${year}-${pad2(month)}-${pad2(day)}`;
    const hasTasks = state.days[dayKey] && state.days[dayKey].tasks.length > 0;
    const classes = ["calendar-cell"];
    if (dayKey === today) classes.push("is-today");
    if (dayKey === selectedDate) classes.push("is-selected");
    if (hasTasks) classes.push("has-tasks");
    cells += `<div class="${classes.join(" ")}" data-action="cal:pick" data-day="${dayKey}">${day}</div>`;
  }
  // 前月/次月ボタンの位置が月をまたいで動かないよう、常に6行×7列=42セル
  // 固定になるよう末尾にも空セルを足す(先頭オフセット+日数分に対する差分)。
  for (let i = offset + total; i < 42; i++) cells += '<div class="calendar-cell empty"></div>';
  const archiveNote = archived
    ? `<div class="archive-note">この月は集計のみ保持: 計画${formatDuration(archived.plannedMinutes)}・実績${formatDuration(archived.actualMinutes)}・完了${archived.completedCount}/${archived.totalCount}件</div>`
    : "";
  document.getElementById("calendarBody").innerHTML = `
    <div class="calendar-nav">
      <button class="icon-btn glyph-icon-btn" data-action="cal:prev-month" aria-label="前月"><svg class="icon icon-rotate-left"><use href="#icon-chevron"></use></svg></button>
      <span class="month-label">${year}年${month}月</span>
      <button class="icon-btn glyph-icon-btn" data-action="cal:next-month" aria-label="次月"><svg class="icon"><use href="#icon-chevron"></use></svg></button>
    </div>
    <div class="calendar-grid">
      ${weekdays.map(w => `<div class="calendar-weekday">${w}</div>`).join("")}
      ${cells}
    </div>
    ${archiveNote}
  `;
}

// ---- 6c. WBS管理モーダル ----
function openWbsModal() {
  wbsCollapsedNodeIds.clear();
  renderWbsModal();
  document.getElementById("wbsModal").classList.remove("hidden");
}
function closeWbsModal() {
  document.getElementById("wbsModal").classList.add("hidden");
  editingWbsNodeId = null;
}
// 新規作成したノードの祖先が折りたたまれていると、作成した直後なのに
// 一覧上は見えない(選択モードなら✅も押せない)という分かりにくい状態に
// なる、という指摘を受けて追加した。祖先を辿ってwbsCollapsedNodeIdsから
// 除くことで、作成したノードは常にその場で見える状態にする。
function expandWbsAncestors(id) {
  let current = wbsNodeById(state, id);
  while (current && current.parentId) {
    wbsCollapsedNodeIds.delete(current.parentId);
    current = wbsNodeById(state, current.parentId);
  }
}
function renderWbsModal() {
  document.getElementById("wbsModalTitle").textContent = wbsPickerReturnActive ? "WBS管理(タスクの選択)" : "WBS管理";
  document.getElementById("wbsModalCloseBtn").setAttribute("aria-label", wbsPickerReturnActive ? "閉じる(タスク編集に戻る)" : "閉じる");
  const tree = buildWbsTree(state.wbs);
  // 全展開/全折りたたみボタン(実績タブのWBS別集計と同じ操作性)。
  // wbsCollapsedNodeIdsは「折りたたんだ側」を持つ(既定は全展開)ので、
  // 実績タブ側(statsExpandedNodeIds、既定は全折りたたみ)とは真偽が逆になる。
  {
    const idsWithChildren = wbsTreeIdsWithChildren(tree);
    const hasAny = idsWithChildren.length > 0;
    const allExpanded = hasAny && idsWithChildren.every(id => !wbsCollapsedNodeIds.has(id));
    document.getElementById("wbsModalToggleAllBtn").innerHTML = `<button class="icon-btn date-nav-btn" data-action="wbs:toggle-collapse-all"
      aria-label="${allExpanded ? "WBSをすべて折りたたむ" : "WBSをすべて展開する"}" ${hasAny ? "" : "disabled"}>
      <svg class="icon"><use href="#${allExpanded ? "icon-unfold-less" : "icon-unfold-more"}"></use></svg></button>`;
  }
  const listHtml = state.wbs.length
    ? renderWbsTreeRows(tree, [], (node, guides, isLast, isRoot) => {
        const guide = renderWbsGuideHtml(guides, isLast, isRoot);
        // 折りたたみトグル。展開可否に関わらず全行で同じ幅のスロットを
        // 確保し(子を持たない行は空スロット)、名前の開始位置を揃える
        // (ファイルツリーでファイルにだけchevronを出さないのと同じ考え方)。
        // tombstone行にも出す(subtree削除では子孫もtombstoneのまま残り
        // うるため、tombstone配下も折りたためないと揃えた意味が無い)。
        const hasChildren = node.children.length > 0;
        const collapsed = wbsCollapsedNodeIds.has(node.id);
        const toggleHtml = hasChildren
          ? `<button type="button" class="icon-btn glyph-icon-btn wbs-toggle-slot wbs-toggle-btn" data-action="wbs:toggle-collapse" data-id="${node.id}" aria-label="${collapsed ? "展開" : "折りたたむ"}" aria-expanded="${!collapsed}"><svg class="icon${collapsed ? "" : " icon-rotate-down"}"><use href="#icon-chevron"></use></svg></button>`
          : `<span class="wbs-toggle-slot"></span>`;
        if (node.deleted) {
          // tombstone: 参照中のタスクが残っている間だけ配列に残るノード。
          // 編集/削除の対象ではないので薄い表示+参照件数だけ示す。
          const count = countTasksUsingWbsNode(state, node.id);
          return `<div class="wbs-row">
            ${guide.linesHtml}
            <span class="wbs-row-label" style="padding-left:${guide.indentPx}px">
              ${toggleHtml}
              <span class="wbs-row-name wbs-deleted-label">${escapeHtml(node.name)}(削除済み・参照${count}件)</span>
            </span>
          </div>`;
        }
        // タスク編集モーダルの「🌳 WBSから選択」経由(wbsPickerReturnActive)
        // の間だけ、編集・削除に加えて選択ボタンを出す。タスクの所属先を
        // この画面から直接決めて編集モーダルへ戻れるようにするため。
        const pickBtn = wbsPickerReturnActive
          ? `<button class="icon-btn glyph-icon-btn" data-action="wbs-picker:pick" data-id="${node.id}" aria-label="選択"><svg class="icon"><use href="#icon-check"></use></svg></button>`
          : "";
        const realNode = wbsNodeById(state, node.id);
        const parentAttr = realNode.parentId || "";
        return `<div class="wbs-row" data-id="${node.id}" data-parent-id="${parentAttr}">
          ${guide.linesHtml}
          <span class="wbs-row-label" style="padding-left:${guide.indentPx}px">
            ${toggleHtml}
            <span class="wbs-row-name">${escapeHtml(node.name)}</span>
          </span>
          <span class="wbs-row-actions">
            ${pickBtn}
            <button type="button" class="icon-btn glyph-icon-btn wbs-drag-handle" data-id="${node.id}" aria-label="ドラッグして並び替え"><svg class="icon"><use href="#icon-drag-handle"></use></svg></button>
            <button class="icon-btn glyph-icon-btn" data-action="wbs:edit-start" data-id="${node.id}" aria-label="編集"><svg class="icon"><use href="#icon-edit"></use></svg></button>
            <button class="icon-btn glyph-icon-btn danger" data-action="wbs:delete" data-id="${node.id}" aria-label="削除"><svg class="icon"><use href="#icon-delete"></use></svg></button>
          </span>
        </div>`;
      }, true, id => wbsCollapsedNodeIds.has(id))
    : '<div class="empty-hint">WBSノードはまだありません</div>';
  document.getElementById("wbsListBody").innerHTML = listHtml;
  // 編集中のノード自身とその配下、およびtombstone化したノードは親候補から除外する
  // (前者は循環参照を防ぐため、後者は削除済みノードの下に新たに作らせないため)。
  const excludedIds = editingWbsNodeId ? [editingWbsNodeId, ...wbsDescendantIds(state, editingWbsNodeId)] : [];
  const parentOptions = state.wbs.filter(n => !n.deleted && !excludedIds.includes(n.id));
  const select = document.getElementById("wbsParentSelect");
  select.innerHTML = '<option value="">(トップレベル)</option>' +
    parentOptions.map(n => `<option value="${n.id}">${escapeHtml(wbsNodePath(state, n.id))}</option>`).join("");

  if (editingWbsNodeId) {
    const node = wbsNodeById(state, editingWbsNodeId);
    select.value = node.parentId || "";
    document.getElementById("wbsNameInput").value = node.name;
    document.getElementById("wbsSubmitBtn").textContent = "更新";
    document.getElementById("wbsCancelEditBtn").style.display = "";
  } else {
    // 前回この作成フォームで選んだ親を引き継ぐ(トップレベルへは戻さない)。
    // 参照先が(親候補から除外された等の理由で)無効になっている場合だけ
    // トップレベルへフォールバックする。
    select.value = wbsModalCreateParentId && parentOptions.some(n => n.id === wbsModalCreateParentId)
      ? wbsModalCreateParentId : "";
    document.getElementById("wbsSubmitBtn").textContent = "ノードを作成";
    document.getElementById("wbsCancelEditBtn").style.display = "none";
  }
}
function startWbsEdit(id) {
  editingWbsNodeId = id;
  renderWbsModal();
}
function cancelWbsEdit() {
  editingWbsNodeId = null;
  document.getElementById("wbsNameInput").value = "";
  renderWbsModal();
}

// ==== 7. イベントハンドラ ====
function openSettings() {
  document.getElementById("settingsFocusMinutes").value = state.settings.focusMinutes;
  document.getElementById("settingsBreakMinutes").value = state.settings.breakMinutes;
  document.getElementById("settingsStreakThreshold").value = state.settings.streakThreshold;
  document.getElementById("settingsModal").classList.remove("hidden");
}
function closeSettings() {
  document.getElementById("settingsModal").classList.add("hidden");
}
function saveSettingsFromForm() {
  const fm = Number(document.getElementById("settingsFocusMinutes").value);
  const bm = Number(document.getElementById("settingsBreakMinutes").value);
  const st = Number(document.getElementById("settingsStreakThreshold").value);
  if (![fm, bm, st].every(Number.isFinite) || fm < 1 || bm < 1 || st < 1) {
    alert("正しい数値を入力してください");
    return;

// ---- 7a. タイムラインのドラッグ(移動・端リサイズ) ----
// pointerdown/move/up/cancelはdocumentへ委譲する(.timeline-taskは
// renderTodayViewのたびにinnerHTMLごと作り直されるため、要素個別に
// リスナーを付けても再描画のたびに失われる)。ドラッグ中はプレビューとして
// box.style.top/heightを直接書き換えるだけにとどめ、確定(pointerup)する

// 要らないようにするため)。

// クリックした時にまでそのクリックを飲み込んでしまう実バグがあったため、

// 長押しが確定した時点の処理。選択+armedの確定(selectedTimelineTaskId・

// 指を離すまであえて残す(armedフラグを立てるだけ)。合成clickの抑制
// (lastDragBox/lastDragEndAt)は実際にpointerupが起きた時点で行う:

}
// ポインタの絶対位置(clientY)ではなく、ドラッグ開始からの相対移動量
// (ポインタの移動 + その間にページがスクロールした量)をピクセル単位で
// 返す。自動スクロール(後述)でmain.scrollTopが変化しても、指が画面上で

// (分への変換はcomputeDragPreview側でyToMinuteを使って行う。)
function computeDragEffectiveDeltaY() {

// 指摘を受けた。一定比率(グローバル定数でも、ドラッグ開始時に固定した
// 箱自身の拡大率でも)では、ドラッグ中にポインタが「展開されている区間」

// そのまま使うことで、複雑な「今ポインタがどの窓にいるか」の判定を

}

// ---- 7b. WBS管理モーダルの並び替えドラッグ ----
// タイムラインのドラッグ(7a)とは独立した、もっと単純な1次元(縦方向のみ)の
// 並び替えドラッグ。ハンドル(.wbs-drag-handle)だけがドラッグの起点で、
// ✏️🗑✅など他のボタンとは別要素のため、タイムラインドラッグで必要だった
// 「ドラッグ後の合成clickの抑制」(lastDragBox/lastDragEndAt)は不要
// (ハンドル自体はdata-actionを持たないため、クリックとして処理されても
// ディスパッチャは何もしない)。
let wbsDragState = null;
let wbsAutoScrollRAF = null;
function wbsDragPointerDown(e) {
  if (wbsDragState) return;
  const handle = e.target.closest(".wbs-drag-handle");
  if (!handle) return;
  const row = handle.closest(".wbs-row");
  const modalCard = row.closest(".modal-card");
  const listBody = document.getElementById("wbsListBody");
  const parentAttr = row.dataset.parentId || "";
  const id = row.dataset.id;
  const siblingRows = Array.from(listBody.querySelectorAll(`.wbs-row[data-parent-id="${parentAttr}"]`));
  const originalIndex = siblingRows.findIndex(r => r.dataset.id === id);
  if (originalIndex === -1) return;
  const others = siblingRows.filter(r => r.dataset.id !== id)
    .map(el => ({ id: el.dataset.id, el, top: el.getBoundingClientRect().top }));
  wbsDragState = {
    id, row, modalCard,
    pointerId: e.pointerId,
    startClientY: e.clientY,
    lastClientY: e.clientY,
    startScrollTop: modalCard.scrollTop,
    rowHeight: row.getBoundingClientRect().height,
    originalIndex,
    currentTargetIndex: originalIndex,
    others,
  };
  row.classList.add("dragging");
  others.forEach(o => o.el.classList.add("shifting"));
  handle.setPointerCapture(e.pointerId);
}
// ドラッグ中の行はポインタの移動量(+自動スクロール分)にそのまま追従させる
// (delta方式、タイムラインドラッグと同じ考え方)。他の兄弟行は、現在の
// 挿入先インデックス(currentTargetIndex)と各行の元のインデックスを比べ、
// 道を空けるために前後どちらへ1行分ずれるべきかをその場で計算して
// transformを当てる(Notion/Trello等でおなじみの「並び替え中に周りの行が
// スッと詰まる」プレビュー)。
function wbsDragUpdate() {
  const ds = wbsDragState;
  if (!ds) return;
  const scrollDelta = ds.modalCard.scrollTop - ds.startScrollTop;
  const deltaY = (ds.lastClientY - ds.startClientY) + scrollDelta;
  ds.row.style.transform = `translateY(${deltaY}px)`;
  let targetIndex = 0;
  for (const o of ds.others) {
    const mid = o.top + scrollDelta + ds.rowHeight / 2;
    if (ds.lastClientY > mid) targetIndex++;
    else break;
  }
  if (targetIndex !== ds.currentTargetIndex) {
    ds.currentTargetIndex = targetIndex;
    ds.others.forEach((o, otherIndex) => {
      const shift = (otherIndex >= ds.currentTargetIndex ? 1 : 0) - (otherIndex >= ds.originalIndex ? 1 : 0);
      o.el.style.transform = shift !== 0 ? `translateY(${shift * ds.rowHeight}px)` : "";
    });
  }
}
// .modal-card(一覧のスクロールコンテナ)の上端/下端付近にポインタが
// 近づいている間、requestAnimationFrameで少しずつscrollTopを動かす
// (タイムラインのautoScrollTickと同じ考え方の簡略版)。
function wbsAutoScrollTick() {
  wbsAutoScrollRAF = null;
  const ds = wbsDragState;
  if (!ds) return;
  const rect = ds.modalCard.getBoundingClientRect();
  const edge = 40, maxSpeed = 14;
  let speed = 0;
  if (ds.lastClientY < rect.top + edge) speed = -maxSpeed * Math.min(1, (rect.top + edge - ds.lastClientY) / edge);
  else if (ds.lastClientY > rect.bottom - edge) speed = maxSpeed * Math.min(1, (ds.lastClientY - (rect.bottom - edge)) / edge);
  if (speed !== 0) {
    ds.modalCard.scrollTop = Math.max(0, ds.modalCard.scrollTop + speed);
    wbsDragUpdate();
  }
  wbsAutoScrollRAF = requestAnimationFrame(wbsAutoScrollTick);
}
function wbsDragPointerMove(e) {
  const ds = wbsDragState;
  if (!ds || e.pointerId !== ds.pointerId) return;
  e.preventDefault();
  ds.lastClientY = e.clientY;
  wbsDragUpdate();
  if (!wbsAutoScrollRAF) wbsAutoScrollRAF = requestAnimationFrame(wbsAutoScrollTick);
}
function wbsDragFinish() {
  const ds = wbsDragState;
  if (!ds) return;
  if (wbsAutoScrollRAF) { cancelAnimationFrame(wbsAutoScrollRAF); wbsAutoScrollRAF = null; }
  ds.row.classList.remove("dragging");
  ds.row.style.transform = "";
  ds.others.forEach(o => { o.el.style.transform = ""; o.el.classList.remove("shifting"); });
  wbsDragState = null;
  return ds;
}
function wbsDragPointerUp(e) {
  const ds = wbsDragState;
  if (!ds || e.pointerId !== ds.pointerId) return;
  const targetIndex = ds.currentTargetIndex;
  const id = ds.id;
  wbsDragFinish();
  if (targetIndex === ds.originalIndex) return; // 実際に動いていなければ何もしない
  reorderWbsNode(state, id, targetIndex);
  saveState(state);
  renderWbsModal();
  if (currentView === "today") renderTodayView();
  if (currentView === "stats") renderStatsView();
}
function wbsDragPointerCancel(e) {
  const ds = wbsDragState;
  if (!ds || e.pointerId !== ds.pointerId) return;
  wbsDragFinish(); // state.wbsは変更していないため再描画は不要
}
document.addEventListener("pointerdown", wbsDragPointerDown);
document.addEventListener("pointermove", wbsDragPointerMove, { passive: false });
document.addEventListener("pointerup", wbsDragPointerUp);
document.addEventListener("pointercancel", wbsDragPointerCancel);

// Ctrl+Z(元に戻す)/Ctrl+Y(やり直す、Windowsの標準的なRedoショートカット)。
// フォーム入力中(テキスト欄選択中など)はOS/ブラウザ標準の編集用Undoに
// 譲るため、またモーダル編集中に裏のタスク一覧が変わると混乱するため、
// どちらも素通りさせる(何もしない)。
document.addEventListener("keydown", (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey) return;
  const key = e.key.toLowerCase();
  if (key !== "z" && key !== "y") return;
  const active = document.activeElement;
  const isEditable = active && (
    active.tagName === "INPUT" || active.tagName === "TEXTAREA" ||
    active.tagName === "SELECT" || active.isContentEditable
  );
  if (isEditable) return;
  if (document.querySelector(".modal:not(.hidden)")) return;
  e.preventDefault();
  if (key === "z") performTaskUndo(); else performTaskRedo();
});

      let startMin = Math.round(yToMinute(y, breakpoints) / TIMELINE_SNAP_MIN) * TIMELINE_SNAP_MIN;
      startMin = Math.max(0, Math.min(startMin, 24 * 60 - TIMELINE_SNAP_MIN));

      // 一方、選択対象は必ず実際にタップした箱自身(id)にする(実際に踏んだ
      // バグ: 独立して展開中の2つのタスクA・Bが隣接している時、Aをタップ

      // (=B)を使っていたため、Aをタップしたはずなのに選択状態がBに
      // 勝手に移ってしまうという指摘を受けた。ユーザーが実際に指で触れた
      // 箱を選ぶ方が直感に合うため、選択だけはtargetIdではなくidを使う
      // ように分離した。
      const targetId = btn.dataset.driverId || id;
      if (expandedTimelineTaskIds.has(targetId)) {
        expandedTimelineTaskIds.delete(targetId);
        // 巻き込みの連鎖的解消。上のコメントの例で言うAを1回タップした
        // 時点ではまだこのケース(targetId===id===Aで、Aはこの時点で
        // 自分自身の展開を確かに解除できている)だが、Bがまだ独立して
        // 展開中のためAはBの窓(clock-hour単位で広がる)に即座に再度
        // 巻き込まれ、見た目の高さが縮まらないままになる。この状態を

        // タップで実際にタップした箱(id)が見た目上も確実に縮む状態まで
        // 畳み切ることで、この不整合を解消する。
        const entry = getSelectedEntry();
        const sorted = [...entry.tasks].sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime));
        let guard = 0;
        let sweptDriverId;
        while ((sweptDriverId = findSweptDriverId(id, sorted)) && guard++ < sorted.length) {

      if (!confirm(`「${node.name}」を削除しますか?(使用中のタスク${selfCount}件)`)) break;
      let cascade = "promote";
      if (children.length) {
        const descCount = wbsDescendantIds(state, targetId)
          .reduce((sum, tid) => sum + countTasksUsingWbsNode(state, tid), 0);
        cascade = confirm(
          `子ノードが${children.length}件あります。\n` +
          `OK: 配下ごと削除(配下の使用中タスク${descCount}件を含む)\n` +
          `キャンセル: このノードだけ削除(子はルート方向へ繰り上げ)`
        ) ? "subtree" : "promote";
      }

      if (editingWbsNodeId && (editingWbsNodeId === targetId
          || (cascade === "subtree" && isWbsDescendantOf(state, editingWbsNodeId, targetId)))) {
        editingWbsNodeId = null; // 編集中のノード自身が削除された場合は編集モードを抜ける
      }

      if (!taskId) return;
      focusSelectedTaskId = taskId;
      startSession(taskId, "focus");
      break;
    }

    case "resume": resumeSession(); break;
    case "focus:delete-selected": {
      if (!id) return;
      if (hasSessionInProgress(id)) {
        alert("このタスクには実行中または中断中の集中セッションがあります。先に終了してください。");
        return;
      }
      if (confirm("このタスクを削除しますか?")) {
        recordUndoPoint();
        // hasSessionInProgress()がfalseだった時点でこのタスクは実行中/
        // 一時停止中のセッションを持たないため、selectedDate(集中タブが
        // 表示しているリストの日)で確実に見つかる。
        removeTask(state, selectedDate, id);
        focusSelectedTaskId = null;
        saveState(state);
        renderFocusView();
        renderAppHeader();
      }
      break;
    }
    case "finish": {
      const elapsed = getSessionElapsedFocusMinutes(state.activeSession);
      const msg = elapsed > 0
        ? `ここまでの実績(${elapsed}分)を記録して終了しますか?`
        : "終了しますか?";
      if (confirm(msg)) finishSession(elapsed);
      break;
    }
    case "task:undo": performTaskUndo(); break;
    case "task:redo": performTaskRedo(); break;
    case "export": doExport(); break;
    case "settings-open": openSettings(); break;
    case "settings-close": closeSettings(); break;
    case "settings-save": saveSettingsFromForm(); break;
    case "settings:clear-all-data": {
      if (confirm("すべてのデータ(タスク・WBS・設定・実績記録)を削除します。この操作は取り消せません。よろしいですか?")) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
      break;
    }
  }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.matches('input[type="checkbox"][data-action="toggle"]')) {
    recordUndoPoint();
    toggleTaskComplete(state, selectedDate, el.dataset.id);
    saveState(state); renderAll();
  } else if (el.id === "focusTaskSelect") {
    const newId = el.value;
    // 一時停止中のセッションがあれば退避し、選んだタスクに中断状態が
    // あれば復元する(select自体はactiveSessionが実行中の間は無効化されて
    // いるため、実行中からここに来ることは無い)。
    if (state.activeSession && state.activeSession.paused) {
      state.pausedSessions[state.activeSession.taskId] = {
        kind: state.activeSession.kind,
        pausedRemainingMs: state.activeSession.pausedRemainingMs,
        dayKey: state.activeSession.dayKey,
      };
      state.activeSession = null;
    }
    if (!state.activeSession && state.pausedSessions[newId]) {
      const parked = state.pausedSessions[newId];
      state.activeSession = { taskId: newId, dayKey: parked.dayKey, kind: parked.kind, paused: true, pausedRemainingMs: parked.pausedRemainingMs, endAt: null };
      delete state.pausedSessions[newId];
    }
    focusSelectedTaskId = newId;
    saveState(state);
    renderFocusView();
  } else if (el.id === "importFile") {
    handleImportFile(el.files[0]);
  } else if (el.id === "editWbsQuickAddParentSelect") {
    // ユーザーが明示的に親を選び直した場合も、名前欄の値はそのままに
    // wbsQuickAddParentIdと重複判定/作成ボタンの活性状態だけ更新する。

    // このselectは編集対象ノード自身の親を表しているため対象外にする。
    wbsModalCreateParentId = el.value || null;
  }
});
// タスク編集モーダルのWBS検索欄だけ、入力のたびに(change=フォーカスが
// 外れた時ではなく)候補を更新したいため専用のinputリスナーを設ける。
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "editWbsSearchInput") {
    renderWbsSearchResults(el.value.trim());
  }
});
// モーダル(設定/カレンダー/WBS管理/タスク編集)の半透明の背景部分(.modal-card
// の外側)をタップした時、✕ボタンと同じ扱いで閉じる。e.target(実際に
// クリックされた要素)が.modal自身と一致する場合だけが対象で、.modal-card
// (中のカード本体、フォーム部品含む)へのクリックはbubblingで.modalまで
// 届いてもe.targetはカード側の要素のままなので対象にならない。確認
// ダイアログ(delete/削除確認等のconfirm())はブラウザネイティブのモーダルで
// この仕組みの対象外(そもそもDOM要素ではないため関与しない)。実際の
// クローズ処理は各モーダルの✕ボタン(data-action付き)へclick()するだけに
// とどめ、wbsPickerReturnActiveのような✕ボタン側の分岐ロジックを重複させない。
document.addEventListener("click", (e) => {
  if (e.target.classList.contains("modal") && !e.target.classList.contains("hidden")) {
    const closeBtn = e.target.querySelector(".modal-close-btn");
    if (closeBtn) closeBtn.click();
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    const rollover = rolloverIfNeeded(state);
    if (rollover.rolled && selectedDate === rollover.prevDay) selectedDate = rollover.today;
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    if (state.activeSession) ensureTickTimer();
    tick();
    renderAll();
  }
});

// ==== 8. 初期化 ====
// #appの高さをCSSのvh/dvh単位に任せず、window.visualViewport(実際に見えて
// いる領域を返すAPI)を都度measureしてCSS変数--app-heightに反映する。
// iPad miniのホーム画面追加(スタンドアロン表示)で開いた時だけフッタが
// 画面下端より少し上にずれる不具合(#app CSSのコメント参照)への対応で、
// Stage Manager等のウィンドウ表示ではposition:fixed;inset:0がレイアウト
// ビューポートとウィンドウの実際の矩形のズレを拾ってしまい直らない、
// という推測に基づく。visualViewportが無い(古い)環境ではwindow.innerHeightに
// フォールバックする。resize/scrollイベントの両方を購読するのは、
// visualViewportの変化はresizeだけでなくscroll(ズームや動的ツールバーの
// 出入りに伴う可視領域の移動)でも起こりうるため。
function updateAppHeight() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty("--app-height", `${h}px`);
}
updateAppHeight();
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", updateAppHeight);
  window.visualViewport.addEventListener("scroll", updateAppHeight);
}
window.addEventListener("orientationchange", updateAppHeight);
window.addEventListener("resize", updateAppHeight);

let state = loadState();
{
  const rollover = rolloverIfNeeded(state);
  if (rollover.rolled && selectedDate === rollover.prevDay) selectedDate = rollover.today;
}
document.addEventListener("DOMContentLoaded", () => {
  renderAppHeader();
  renderTodayView({ autoscroll: true }); // 起動時は必ず「今日」表示なので初回だけ自動スクロールする
  if (state.activeSession) ensureTickTimer();
  setInterval(() => { if (currentView === "today") renderNowBanner(); }, 30000);
});
</script>
