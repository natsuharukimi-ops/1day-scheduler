  document.getElementById("editTaskStart").value = isEdit ? task.startTime : "";
  document.getElementById("editTaskEnd").value = isEdit ? task.endTime : "";
  taskFormTags = new Set(isEdit ? (task.tags || []) : []);
  renderEditTagPicker();
  document.getElementById("editTitleHistoryContainer").innerHTML = isEdit ? "" : renderTitleHistoryHtml();
  if (isEdit) {
    document.getElementById("editTaskActual").value = task.actualMinutes;
    document.getElementById("editTaskCompleted").checked = task.completed;
    // 実行中だけでなく一時停止中(=他タスクへ退避されpausedSessionsに
    // 待避中)のセッションも対象に含める。以前はactiveSessionだけを見て
    // いたため、一時停止して別タスクに切り替えた直後は退避先のタスクの
    // 実績欄が編集可能なままという抜けがあった(削除ガードのhasSessionInProgress
    // とは異なる基準になっていた)。
    const timerInProgress = hasSessionInProgress(taskId);
    document.getElementById("editTaskActual").disabled = timerInProgress;
    document.getElementById("editTaskActualNote").style.display = timerInProgress ? "" : "none";
  }
  document.getElementById("taskEditModal").classList.remove("hidden");
}
function openTaskCreateModal(dayKey, prefillStart, prefillEnd) {
  openTaskModal(null, dayKey);
  document.getElementById("editTaskStart").value = prefillStart || "";
  document.getElementById("editTaskEnd").value = prefillEnd || "";
}
function renderEditTagPicker() {
  document.getElementById("editTagPickerContainer").innerHTML =
    renderTagPickerHtml(taskFormTags, "edit-tag-chip:toggle");
}
function closeTaskEditModal() {
  document.getElementById("taskEditModal").classList.add("hidden");
  editingTaskId = null;
  editingTaskDayKey = null;
}
function saveTaskEditFromForm() {
  const title = document.getElementById("editTaskTitle").value.trim();
  // 開始・終了時刻は必ず15分刻みに揃える(step="900"はSafariのホイール
  // ピッカーには効くが、手入力やそれ以外のブラウザでは素通りしうるため、
  // ここで最終的にスナップし直す)。
  const start = document.getElementById("editTaskStart").value
    ? formatHHMM(snapMinutesToGrid(toMinutes(document.getElementById("editTaskStart").value)))
    : "";
  const end = document.getElementById("editTaskEnd").value
    ? formatHHMM(snapMinutesToGrid(toMinutes(document.getElementById("editTaskEnd").value)))
    : "";
  const isEdit = editingTaskId !== null;
  const actualInput = document.getElementById("editTaskActual");
  let actual = 0;
  if (isEdit) {
    actual = actualInput.disabled
      ? getEntryForDate(editingTaskDayKey).tasks.find(t => t.id === editingTaskId).actualMinutes
      : Number(actualInput.value);
  }
  const completed = isEdit ? document.getElementById("editTaskCompleted").checked : false;
  if (!title || !start || !end) { alert("タスク名・時刻を入力してください"); return; }
  if (!Number.isFinite(actual) || actual < 0) { alert("実績時間は0以上の数値にしてください"); return; }
  recordUndoPoint();
  try {
    if (isEdit) {
      updateTask(state, editingTaskDayKey, editingTaskId, {
        title, startTime: start, endTime: end,
        tags: [...taskFormTags], actualMinutes: actual, completed,
      });
    } else {
      addTask(state, editingTaskDayKey, { title, startTime: start, endTime: end, tags: [...taskFormTags] });
    }
    saveState(state);
    closeTaskEditModal();
    if (currentView === "today") renderTodayView();
    if (currentView === "focus") renderFocusView();
    renderHeaderStreak();
  } catch (err) {
    discardPendingUndoSnapshot();
    alert(err.message);
  }
}
// 実行中/一時停止中(=activeSession)・退避中(=pausedSessions)のいずれかの
// 未確定な集中タイマー進捗を持つタスクは、それを黙って失わせないよう
// 削除を拒否する。
function hasSessionInProgress(taskId) {
  return (state.activeSession && state.activeSession.taskId === taskId) || !!state.pausedSessions[taskId];
}
function deleteFromTaskModal() {
  if (editingTaskId === null) return;
  if (hasSessionInProgress(editingTaskId)) {
    alert("このタスクには実行中または中断中の集中セッションがあります。先に終了してください。");
    return;
  }
  if (!confirm("このタスクを削除しますか?")) return;
  recordUndoPoint();
  removeTask(state, editingTaskDayKey, editingTaskId);
  saveState(state);
  closeTaskEditModal();
  if (currentView === "today") renderTodayView();
  if (currentView === "focus") renderFocusView();
  renderHeaderStreak();
}

function renderFocusView() {
  const container = document.getElementById("focusView");
  const entry = getTodayEntry();
  const session = state.activeSession;

  if (!session) {
    if (focusSelectedTaskId === null || !entry.tasks.some(t => t.id === focusSelectedTaskId)) {
      focusSelectedTaskId = suggestTaskId();
    }
  }

  // セッション中のタスクは、そのセッションが開始した日(session.dayKey)から
  // 探す。日を跨いで実行中/一時停止中のまま残った場合、entry(=今日)には
  // そのタスクが存在しないため、todayEntryだけを見ると常に見失う
  // (以前はここでタスクが見つからず、タイトル・実績が表示されなくなる
  // バグがあった)。
  const sessionTask = session ? getEntryForDate(session.dayKey).tasks.find(t => t.id === session.taskId) : null;
  const sessionTaskCrossDay = !!(session && !entry.tasks.some(t => t.id === session.taskId));

  const selectedId = session ? session.taskId : focusSelectedTaskId;
  const selectedTask = session ? sessionTask : (entry.tasks.find(t => t.id === selectedId) || null);
  // 通常は今日のタスクだけを選択肢にする。セッションのタスクが日を跨いで
  // 今日のリストに存在しない場合だけ、先頭に追加してselectedとして見える
  // ようにする(selectのdisabledと合わせて、他タスクへの切替はできないが
  // 現在の対象が何かは正しく表示する)。
  const optionSourceTasks = sessionTaskCrossDay && sessionTask ? [sessionTask, ...entry.tasks] : entry.tasks;
  const options = optionSourceTasks.map(t => {
    const isPausedHere = !!(session && session.paused && session.taskId === t.id);
    const pausedMark = (state.pausedSessions[t.id] || isPausedHere) ? "⏸ " : "";
    const doneMark = t.completed ? "✓ " : "";
    const crossDayMark = (sessionTaskCrossDay && t.id === session.taskId) ? "(前日から継続) " : "";
    return `<option value="${t.id}" ${t.id === selectedId ? "selected" : ""}>${pausedMark}${doneMark}${crossDayMark}${escapeHtml(t.title)}</option>`;
  }).join("");

  let timerHtml;
  if (session) {
    const remaining = session.paused ? session.pausedRemainingMs : session.endAt - Date.now();
    const phase = session.kind === "focus" ? "集中" : "休憩";
    const task = sessionTask;
    const blocksDone = task ? Math.round(task.actualMinutes / state.settings.focusMinutes) : 0;
    const blocksTotal = task ? task.plannedPomodoros : 0;
    timerHtml = `
      <div class="timer-phase">${phase}${task ? "・" + escapeHtml(task.title) : ""}</div>
      <div class="timer-display">${formatMMSS(remaining)}</div>
      ${task ? `<div class="timer-progress">${blocksDone}/${blocksTotal} ブロック完了</div>` : ""}
      <div class="timer-controls">
        ${session.paused
          ? '<button class="btn primary" data-action="resume">再開</button>'
          : '<button class="btn" data-action="pause">一時停止</button>'}
        <button class="btn danger-outline" data-action="finish">終了</button>
      </div>
      ${session.paused && !sessionTaskCrossDay ? '<div class="timer-hint">一時停止中は上のリストから別のタスクに切り替えられます</div>' : ""}
      ${sessionTaskCrossDay ? '<div class="timer-hint">日をまたいで続いているタスクのため、他のタスクへの切り替えはできません。先に「終了」してください。</div>' : ""}`;
  } else {
    timerHtml = `
      <div class="timer-phase">タスクを選んで開始</div>
      <div class="timer-display">${pad2(state.settings.focusMinutes)}:00</div>
      <div class="timer-controls">
        <button class="btn primary" data-action="start-focus" ${entry.tasks.length === 0 ? "disabled" : ""}>集中スタート</button>
      </div>`;
  }

  // 実行中(一時停止していない)のセッションに加え、日を跨いだセッションも
  // 選択肢を固定する(上記のoptionSourceTasksの特別扱いと対にして、
  // 「今日のタスクに切り替えたつもりが日を跨いだタスクの残り状態を壊す」
  // ことを防ぐ)。
  const selectDisabled = !!(session && (!session.paused || sessionTaskCrossDay));
  container.innerHTML = `
    <div class="focus-select-row">
      <select id="focusTaskSelect" ${selectDisabled ? "disabled" : ""}>
        ${optionSourceTasks.length ? options : '<option value="">タスクがありません</option>'}
      </select>
      <button class="icon-btn" data-action="task:edit-open" data-id="${selectedId || ""}" data-day="${session ? session.dayKey : todayKey()}"
        aria-label="編集" ${selectedId ? "" : "disabled"}>✏️</button>
      <button class="icon-btn danger" data-action="focus:delete-selected" data-id="${selectedId || ""}"
        aria-label="削除" ${selectedId ? "" : "disabled"}>🗑</button>
    </div>
    ${renderFocusTaskDetailHtml(selectedTask)}
    <div class="timer-card">${timerHtml}</div>
  `;
}
function renderFocusTaskDetailHtml(task) {
  if (!task) return "";
  const tagsHtml = (task.tags && task.tags.length)
    ? `<div class="task-tags">${task.tags.map(tag => `<span class="chip static">🏷️${escapeHtml(tagChipLabel(tag))}</span>`).join("")}</div>`
    : "";
  return `
    <div class="focus-task-detail">
      <div class="focus-task-detail-title ${task.completed ? "done" : ""}">${escapeHtml(task.title)}${task.completed ? "(完了済み)" : ""}</div>
      <div class="focus-task-detail-meta">
        ${task.startTime}〜${task.endTime}・計画${formatDuration(task.plannedMinutes)}(🍅${task.plannedPomodoros})・実績${formatDuration(task.actualMinutes)}
      </div>
      ${tagsHtml}
    </div>`;
}

function buildHeatmap(days) {
  const today = todayKey();
  let html = "";
  for (let i = days - 1; i >= 0; i--) {
    const dayKey = addDays(today, -i);
    const entry = state.days[dayKey];
    const rate = entry ? computeCompletionRate(entry) : 0;
    const level = entry && entry.tasks.length ? Math.min(4, Math.ceil(rate * 4)) : 0;
    html += `<div class="heat-cell level-${level}" data-day="${dayKey}" data-rate="${Math.round(rate * 100)}"></div>`;
  }
  return html;
}
function renderStatsView() {
  const container = document.getElementById("statsView");
  const entry = getTodayEntry();
  const rate = computeCompletionRate(entry);
  const allTime = computeAllTimeTotals(state);
  const rows = entry.tasks.map(t => `
    <tr>
      <td>${escapeHtml(t.title)}</td>
      <td>${formatDuration(t.plannedMinutes)}</td>
      <td>${formatDuration(t.actualMinutes)}</td>
      <td>${t.completed ? "✅" : "—"}</td>
    </tr>`).join("");

  container.innerHTML = `
    <div class="streak-row">
      <div class="streak-box">
        <div class="streak-value">${state.streak.current}</div>
        <div class="streak-label">連続達成日数</div>
      </div>
      <div class="streak-box">
        <div class="streak-value">${state.streak.longest}</div>
        <div class="streak-label">最長記録</div>
      </div>
      <div class="streak-box">
        <div class="streak-value">${Math.round(rate * 100)}%</div>
        <div class="streak-label">今日の完了率</div>
      </div>
    </div>
    <table class="today-table">
      <thead><tr><th>タスク</th><th>計画</th><th>実績</th><th>完了</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="empty-hint">今日のタスクはまだありません</td></tr>'}</tbody>
    </table>
    <div class="heatmap-section">
      <div class="heatmap-title">直近28日間</div>
      <div class="heatmap-grid">${buildHeatmap(28)}</div>
      <div id="heatmapDetail" class="heatmap-detail"></div>
    </div>
    <div class="heatmap-section">
      <div class="heatmap-title">タグ別集計(保持期間内の全期間・複数タグを持つタスクは両方に計上されます)</div>
      ${renderTagAggregatesHtml()}
    </div>
    <div class="all-time-row">📚 全期間の実績: ${formatDuration(allTime.actualMinutes)}(完了 ${allTime.completedCount}件)</div>
  `;
}
function renderTagFilterChipsHtml() {
  if (!state.tags.length) return "";
  return `<div class="chip-row">${state.tags.map(tag =>
    `<span class="chip${statsTagFilter.has(tag) ? " selected" : ""}" data-action="stats:tag-filter-toggle" data-tag="${escapeHtml(tag)}">🏷️${escapeHtml(tagChipLabel(tag))}</span>`
  ).join("")}</div>`;
}
// 「全期間」は保持期間(既定6か月)より前の月は月次サマリーに圧縮され
// タグ別の内訳が失われているため、実際には「保持期間内の全期間」が対象
// (README/CLAUDE.mdに明記)。タグを選択すると、そのタグ自身と配下の
// 階層タグだけに絞り込む(複数選択時はいずれかに一致すれば表示)。
function renderTagAggregatesHtml() {
  const totals = computeTagAggregates(Object.values(state.days));
  const filterActive = statsTagFilter.size > 0;
  // 子孫タグを選択した場合、その祖先タグの行も(木の罫線記号の整合性を
  // 保つため)一緒に表示する。祖先行には自分自身の(配下すべてを含む)
  // 実際の集計値をそのまま出す(隠さない)。
  const passesFilter = path => !filterActive || [...statsTagFilter].some(f =>
    path === f || path.startsWith(f + "/") || f.startsWith(path + "/")
  );
  const tree = buildTagTree(Object.keys(totals).filter(p => p !== "(タグ無し)"));
  let rowsHtml = renderTagTreeRows(tree, "", (node, prefix) => {
    if (!passesFilter(node.path)) return "";
    const t = totals[node.path];
    if (!t) {
      // 実データの無い暗黙の中間ノード(木構造を保つためだけに存在)
      return `<div class="tag-agg-row"><span><span class="tag-tree-prefix">${prefix}</span><span class="tag-virtual-label">${escapeHtml(node.name)}</span></span><span></span></div>`;
    }
    return `<div class="tag-agg-row">
      <span><span class="tag-tree-prefix">${prefix}</span>${escapeHtml(node.name)}</span>
      <span>${formatDuration(t.planned)} 計画 / ${formatDuration(t.actual)} 実績</span>
    </div>`;
  });
  if (totals["(タグ無し)"] && !filterActive) {
    const t = totals["(タグ無し)"];
    rowsHtml += `<div class="tag-agg-row"><span>(タグ無し)</span><span>${formatDuration(t.planned)} 計画 / ${formatDuration(t.actual)} 実績</span></div>`;
  }
  if (!rowsHtml) rowsHtml = '<div class="empty-hint">該当するタスクがありません</div>';
  return renderTagFilterChipsHtml() + rowsHtml;
}

function switchView(view) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.dataset.view === view));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === view));
  currentView = view;
  renderHeaderStreak();
  if (view === "today") renderTodayView({ autoscroll: true });
  if (view === "focus") renderFocusView();
  if (view === "stats") renderStatsView();
}

// ---- 6a. カレンダーモーダル ----
function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); }
function firstWeekdayOfMonth(year, month) { return new Date(year, month - 1, 1).getDay(); }
function openCalendar() {
  const [y, m] = selectedDate.split("-").map(Number);
  calendarViewMonth = { year: y, month: m };
  renderCalendarModal();
  document.getElementById("calendarModal").classList.remove("hidden");
}
function closeCalendar() {
  document.getElementById("calendarModal").classList.add("hidden");
}
function renderCalendarModal() {
  const { year, month } = calendarViewMonth;
  const total = daysInMonth(year, month);
  const offset = firstWeekdayOfMonth(year, month);
  const today = todayKey();
  const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
  const monthKey = `${year}-${pad2(month)}`;
  const archived = state.archive.monthlySummaries[monthKey];
  let cells = "";
  for (let i = 0; i < offset; i++) cells += '<div class="calendar-cell empty"></div>';
  for (let day = 1; day <= total; day++) {
    const dayKey = `${year}-${pad2(month)}-${pad2(day)}`;
    const hasTasks = state.days[dayKey] && state.days[dayKey].tasks.length > 0;
    const classes = ["calendar-cell"];
    if (dayKey === today) classes.push("is-today");
    if (dayKey === selectedDate) classes.push("is-selected");
    if (hasTasks) classes.push("has-tasks");
    cells += `<div class="${classes.join(" ")}" data-action="cal:pick" data-day="${dayKey}">${day}</div>`;
  }
  // 前月/次月ボタンの位置が月をまたいで動かないよう、常に6行×7列=42セル
  // 固定になるよう末尾にも空セルを足す(先頭オフセット+日数分に対する差分)。
  for (let i = offset + total; i < 42; i++) cells += '<div class="calendar-cell empty"></div>';
  const archiveNote = archived
    ? `<div class="archive-note">この月は集計のみ保持: 計画${formatDuration(archived.plannedMinutes)}・実績${formatDuration(archived.actualMinutes)}・完了${archived.completedCount}/${archived.totalCount}件</div>`
    : "";
  document.getElementById("calendarBody").innerHTML = `
    <div class="calendar-nav">
      <button class="icon-btn glyph-icon-btn" data-action="cal:prev-month" aria-label="前月">◀</button>
      <span class="month-label">${year}年${month}月</span>
      <button class="icon-btn glyph-icon-btn" data-action="cal:next-month" aria-label="次月">▶</button>
    </div>
    <div class="calendar-grid">
      ${weekdays.map(w => `<div class="calendar-weekday">${w}</div>`).join("")}
      ${cells}
    </div>
    ${archiveNote}
  `;
}

// ---- 6c. タグ管理モーダル ----
function openTagsModal() {
  renderTagsModal();
  document.getElementById("tagsModal").classList.remove("hidden");
}
function closeTagsModal() {
  document.getElementById("tagsModal").classList.add("hidden");
  editingTagPath = null;
}
function renderTagsModal() {
  const sorted = [...state.tags].sort();
  const tree = buildTagTree(sorted);
  const listHtml = sorted.length
    ? renderTagTreeRows(tree, "", (node, prefix) => {
        if (!node.real) {
          // タグ名に"/"を直接含めて作られた深い階層で、中間の親が実タグとして
          // 登録されていない場合の暗黙ノード。編集/削除の対象ではないので
          // ボタンは出さず、薄い表示に留める。
          return `<div class="tag-row">
            <span><span class="tag-tree-prefix">${prefix}</span><span class="tag-virtual-label">${escapeHtml(node.name)}</span></span>
          </div>`;
        }
        const stale = isTagSubtreeStale(state, node.path)
          ? `<span class="tag-stale-badge">${TAG_STALE_AFTER_DAYS}日以上未使用</span>` : "";
        return `<div class="tag-row">
          <span><span class="tag-tree-prefix">${prefix}</span>${escapeHtml(node.name)}${stale}</span>
          <span>
            <button class="icon-btn" data-action="tags:edit-start" data-tag="${escapeHtml(node.path)}" aria-label="編集">✏️</button>
            <button class="icon-btn danger" data-action="tags:delete" data-tag="${escapeHtml(node.path)}" aria-label="削除">🗑</button>
          </span>
        </div>`;
      })
    : '<div class="empty-hint">タグはまだありません</div>';
  document.getElementById("tagsListBody").innerHTML = listHtml;
  // 編集中のタグ自身とその配下は親候補から除外する(循環参照を防ぐ)。
  const excluded = editingTagPath ? sorted.filter(t => t === editingTagPath || t.startsWith(editingTagPath + "/")) : [];
  const parentOptions = sorted.filter(t => !excluded.includes(t));
  const select = document.getElementById("tagParentSelect");
  select.innerHTML = '<option value="">(トップレベル)</option>' +
    parentOptions.map(path => `<option value="${escapeHtml(path)}">${escapeHtml(path)}</option>`).join("");

  if (editingTagPath) {
    const segs = editingTagPath.split("/");
    const name = segs.pop();
    select.value = segs.join("/");
    document.getElementById("tagNameInput").value = name;
    document.getElementById("tagSubmitBtn").textContent = "更新";
    document.getElementById("tagCancelEditBtn").style.display = "";
  } else {
    document.getElementById("tagSubmitBtn").textContent = "タグを作成";
    document.getElementById("tagCancelEditBtn").style.display = "none";
  }
}
function startTagEdit(path) {
  editingTagPath = path;
  renderTagsModal();
}
function cancelTagEdit() {
  editingTagPath = null;
  document.getElementById("tagNameInput").value = "";
  renderTagsModal();
}

// ==== 7. イベントハンドラ ====
function openSettings() {
  document.getElementById("settingsFocusMinutes").value = state.settings.focusMinutes;
  document.getElementById("settingsBreakMinutes").value = state.settings.breakMinutes;
  document.getElementById("settingsStreakThreshold").value = state.settings.streakThreshold;
  document.getElementById("settingsModal").classList.remove("hidden");
}
function closeSettings() {
  document.getElementById("settingsModal").classList.add("hidden");
}
function saveSettingsFromForm() {
  const fm = Number(document.getElementById("settingsFocusMinutes").value);
  const bm = Number(document.getElementById("settingsBreakMinutes").value);
  const st = Number(document.getElementById("settingsStreakThreshold").value);
  if (![fm, bm, st].every(Number.isFinite) || fm < 1 || bm < 1 || st < 1) {
    alert("正しい数値を入力してください");
    return;
  }
  state.settings.focusMinutes = Math.round(fm);
  state.settings.breakMinutes = Math.round(bm);
  state.settings.streakThreshold = Math.round(st);
  saveState(state);
  closeSettings();
  renderAll();
}
function doExport() {
  const json = exportStateAsJson(state);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `1day-scheduler-backup-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function handleImportFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = importStateFromJson(reader.result);
      if (!confirm("現在のデータを置き換えてインポートします。この操作は元に戻せません。よろしいですか?")) return;
      state = imported;
      rolloverIfNeeded(state);
      selectedDate = todayKey(); // データセット全体が入れ替わるため表示日は今日に戻す
      saveState(state);
      renderAll();
      alert("インポートしました。");
    } catch (e) {
      alert("インポートに失敗しました。ファイル形式を確認してください。");
    }
  };
  reader.readAsText(file);
}

// ---- 7a. タイムラインのドラッグ(移動・端リサイズ) ----
// pointerdown/move/up/cancelはdocumentへ委譲する(.timeline-taskは
// renderTodayViewのたびにinnerHTMLごと作り直されるため、要素個別に
// リスナーを付けても再描画のたびに失われる)。ドラッグ中はプレビューとして
// box.style.top/heightを直接書き換えるだけにとどめ、確定(pointerup)する
// までstateには一切触れない(取り消し(pointercancel)時に何も後始末が
// 要らないようにするため)。
const DRAG_MOVE_THRESHOLD_PX = 6; // これ未満の移動はタップ扱い(誤ドラッグ防止)
const EDGE_SCROLL_ZONE_PX = 60; // 画面端からこの距離に入ったら自動スクロールを始める
const EDGE_SCROLL_MAX_SPEED_PX = 14; // 端に最も近づいた時の1フレームあたりの最大スクロール量
let dragState = null;
let autoScrollRAF = null;
// 実際にドラッグした直後、その同じ箱に対して発火する合成clickだけを
// 無視する(誤タップでの選択遷移/編集モーダル起動/展開トグルを防ぐ)。
// 単純な真偽値フラグにすると、ドラッグ後たまたま他の場所を一度もクリック
// しないまま全く無関係な要素(例: このすぐ後でテストしたUndoボタン)を
// クリックした時にまでそのクリックを飲み込んでしまう実バグがあったため、
// 「対象の箱が一致し、かつドラッグ終了から短時間以内」という条件に絞る。
let lastDragBox = null;
let lastDragEndAt = 0;
const DRAG_CLICK_SUPPRESS_MS = 500;
function timelinePointerDown(e) {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (e.target.closest("input, button")) return; // チェックボックス/✏️/▲は通常のタップに任せる
  const box = e.target.closest(".timeline-task");
  if (!box) return;
  const taskId = box.dataset.id, dayKey = box.dataset.day;
  const task = getEntryForDate(dayKey).tasks.find(t => t.id === taskId);
  if (!task) return;
  // リサイズの可否・上端/下端の判定は、DOM上に実際に描画されている
  // .timeline-resize-handle要素の有無で行う(offsetYのpx計算を独自に
  // 持たない)。これにより「見た目上つかめる領域」と「実際に反応する領域」
  // が常に一致し、箱が低すぎる場合(MIN_RESIZE_BOX_PX未満)にハンドル自体を
  // 描画しないrenderTimelineHtml側の判断がそのままドラッグの挙動にも
  // 反映される。
  const handle = e.target.closest(".timeline-resize-handle");
  const mode = handle ? (handle.classList.contains("top") ? "resize-top" : "resize-bottom") : "move";
  const main = document.querySelector("main");
  dragState = {
    pointerId: e.pointerId, box, taskId, dayKey, mode,
    startClientY: e.clientY, lastClientY: e.clientY,
    startScrollTop: main ? main.scrollTop : 0,
    startTopPx: parseFloat(box.style.top),
    startHeightPx: parseFloat(box.style.height),
    origStartMin: toMinutes(task.startTime),
    origEndMin: toMinutes(task.endTime),
    moved: false,
    previewStartMin: null, previewEndMin: null,
  };
}
// ポインタの絶対位置(clientY)ではなく、ドラッグ開始からの相対移動量
// (ポインタの移動 + その間にページがスクロールした量)を分に変換する。
// 自動スクロール(後述)でmain.scrollTopが変化しても、指が画面上で
// 実際に動いた量と体感を一致させるために両方を合算する必要がある。
function computeDragEffectiveDeltaY() {
  const main = document.querySelector("main");
  const scrollDelta = (main ? main.scrollTop : 0) - dragState.startScrollTop;
  return (dragState.lastClientY - dragState.startClientY) + scrollDelta;
}
function computeDragPreview() {
  const deltaMinSnapped = snapMinutesToGrid(computeDragEffectiveDeltaY() / PX_PER_MIN);
  let newStartMin = dragState.origStartMin, newEndMin = dragState.origEndMin;
  if (dragState.mode === "move") {
    newStartMin = dragState.origStartMin + deltaMinSnapped;
    newEndMin = dragState.origEndMin + deltaMinSnapped;
    const dur = dragState.origEndMin - dragState.origStartMin;
    if (newStartMin < 0) { newStartMin = 0; newEndMin = dur; }
    if (newEndMin > 24 * 60) { newEndMin = 24 * 60; newStartMin = 24 * 60 - dur; }
  } else if (dragState.mode === "resize-top") {
    newStartMin = Math.max(0, Math.min(dragState.origEndMin - TIMELINE_SNAP_MIN, dragState.origStartMin + deltaMinSnapped));
  } else { // resize-bottom
    newEndMin = Math.min(24 * 60, Math.max(dragState.origStartMin + TIMELINE_SNAP_MIN, dragState.origEndMin + deltaMinSnapped));
  }
  dragState.previewStartMin = newStartMin;
  dragState.previewEndMin = newEndMin;
  // 高さは移動時(move)は常に元のまま(展開中の架空の高さもそのまま
  // 保たれる)。リサイズ時は実際の分数から計算するため、展開中の箱を
  // リサイズし始めた瞬間、架空の高さから実際の(自然な)高さへ見た目が
  // 一段階だけジャンプする(数値としては常に正しい。時刻の計算は
  // dragState.origStartMin/origEndMinというタスクの実データだけを基準にした
  // 相対差分で行っており、箱の見た目上の位置は一切参照しないため)。
  const previewHeightPx = dragState.mode === "move" ? dragState.startHeightPx : (newEndMin - newStartMin) * PX_PER_MIN;
  const previewTopPx = dragState.startTopPx + (newStartMin - dragState.origStartMin) * PX_PER_MIN;
  dragState.box.style.top = previewTopPx + "px";
  dragState.box.style.height = previewHeightPx + "px";
  updateDragTimeTooltip(dragState.lastClientY, newStartMin, newEndMin);
}
// ドラッグ中にポインタが画面の上端(固定ヘッダー・日付ナビ・バナーの下)
// または下端(タブバーの上)に近づいたら、指を止めていても継続的に
// スクロールする(pointermoveは指が動いた時にしか発火しないため、
// 「端に置いたまま止めている」状態を検知するにはrequestAnimationFrameで
// 毎フレーム位置を確認するループが必要)。
function autoScrollTick() {
  if (!dragState || !dragState.moved) { autoScrollRAF = null; return; }
  const main = document.querySelector("main");
  if (main) {
    const stickyHeader = document.querySelector(".today-sticky-header");
    const topBound = stickyHeader ? stickyHeader.getBoundingClientRect().bottom : 0;
    const tabbar = document.querySelector(".tabbar");
    const bottomBound = window.innerHeight - (tabbar ? tabbar.getBoundingClientRect().height : 0);
    const y = dragState.lastClientY;
    let scrollDelta = 0;
    if (y < topBound + EDGE_SCROLL_ZONE_PX) {
      const intensity = Math.min(1, (topBound + EDGE_SCROLL_ZONE_PX - y) / EDGE_SCROLL_ZONE_PX);
      scrollDelta = -EDGE_SCROLL_MAX_SPEED_PX * intensity;
    } else if (y > bottomBound - EDGE_SCROLL_ZONE_PX) {
      const intensity = Math.min(1, (y - (bottomBound - EDGE_SCROLL_ZONE_PX)) / EDGE_SCROLL_ZONE_PX);
      scrollDelta = EDGE_SCROLL_MAX_SPEED_PX * intensity;
    }
    if (scrollDelta !== 0) {
      const before = main.scrollTop;
      main.scrollTop = Math.max(0, Math.min(main.scrollHeight - main.clientHeight, main.scrollTop + scrollDelta));
      if (main.scrollTop !== before) computeDragPreview();
    }
  }
  autoScrollRAF = requestAnimationFrame(autoScrollTick);
}
function timelinePointerMove(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  dragState.lastClientY = e.clientY;
  if (!dragState.moved) {
    if (Math.abs(computeDragEffectiveDeltaY()) < DRAG_MOVE_THRESHOLD_PX) return;
    dragState.moved = true;
    dragState.box.classList.add("dragging");
    document.body.style.cursor = dragState.mode === "move" ? "grabbing" : "ns-resize";
    // ポインタが既に離されている等の稀な競合でNotFoundErrorが飛ぶことが
    // あるが、キャプチャが取れなくてもプレビュー自体は以降のpointermoveで
    // 問題なく更新できるため、ここで処理全体が止まらないよう握りつぶす。
    try { dragState.box.setPointerCapture(dragState.pointerId); } catch (err) { /* no-op */ }
    showDragTimeTooltip();
    autoScrollRAF = requestAnimationFrame(autoScrollTick);
  }
  e.preventDefault();
  computeDragPreview();
}
function timelinePointerUp(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  const ds = dragState;
  dragState = null;
  if (autoScrollRAF) { cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
  document.body.style.cursor = "";
  ds.box.classList.remove("dragging");
  if (ds.box.releasePointerCapture && ds.box.hasPointerCapture && ds.box.hasPointerCapture(e.pointerId)) {
    ds.box.releasePointerCapture(e.pointerId);
  }
  hideDragTimeTooltip();
  if (!ds.moved) return; // ただのタップ。通常のclickイベントに処理を譲る。
  lastDragBox = ds.box; lastDragEndAt = Date.now();
  const newStartMin = ds.previewStartMin, newEndMin = ds.previewEndMin;
  if (newStartMin === ds.origStartMin && newEndMin === ds.origEndMin) {
    renderTodayView(); // 変化なし。プレビューで直接書き換えたstyleを実描画に戻すだけ。
    return;
  }
  recordUndoPoint();
  // 区間が完全に元の範囲の内側に収まる(縮小のみ)場合は新たな重なりを
  // 生まないため、衝突解決自体をスキップしてよい。
  const isShrinkOnly = newStartMin >= ds.origStartMin && newEndMin <= ds.origEndMin;
  let ok;
  if (isShrinkOnly) {
    setTaskTimeRange(state, ds.dayKey, ds.taskId, newStartMin, newEndMin);
    ok = true;
  } else {
    const direction = ds.mode === "resize-bottom"
      ? (newEndMin > ds.origEndMin ? "later" : "earlier")
      : (newStartMin < ds.origStartMin ? "earlier" : "later");
    ok = applyDragResult(state, ds.dayKey, ds.taskId, newStartMin, newEndMin, direction).ok;
  }
  if (!ok) {
    discardPendingUndoSnapshot();
    alert("これ以上は動かせません(1日の範囲に収まりません)。");
    renderTodayView();
    return;
  }
  saveState(state);
  renderTodayView();
  renderHeaderStreak();
}
function timelinePointerCancel(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  if (autoScrollRAF) { cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
  document.body.style.cursor = "";
  dragState.box.classList.remove("dragging");
  dragState = null;
  hideDragTimeTooltip();
  renderTodayView(); // プレビューで直接書き換えたstyleを実データに基づく描画で必ず戻す
}
function showDragTimeTooltip() {
  let el = document.getElementById("dragTimeTooltip");
  if (!el) {
    el = document.createElement("div");
    el.id = "dragTimeTooltip";
    el.className = "drag-time-tooltip";
    document.body.appendChild(el);
  }
  el.style.display = "block";
}
function updateDragTimeTooltip(clientY, startMin, endMin) {
  const el = document.getElementById("dragTimeTooltip");
  if (!el) return;
  el.textContent = `${formatHHMM(startMin)}〜${formatHHMM(endMin)}`;
  el.style.top = Math.max(8, clientY - 40) + "px";
}
function hideDragTimeTooltip() {
  const el = document.getElementById("dragTimeTooltip");
  if (el) el.style.display = "none";
}
document.addEventListener("pointerdown", timelinePointerDown);
document.addEventListener("pointermove", timelinePointerMove, { passive: false });
document.addEventListener("pointerup", timelinePointerUp);
document.addEventListener("pointercancel", timelinePointerCancel);

// Ctrl+Z(元に戻す)/Ctrl+Y(やり直す、Windowsの標準的なRedoショートカット)。
// フォーム入力中(テキスト欄選択中など)はOS/ブラウザ標準の編集用Undoに
// 譲るため、またモーダル編集中に裏のタスク一覧が変わると混乱するため、
// どちらも素通りさせる(何もしない)。
document.addEventListener("keydown", (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey) return;
  const key = e.key.toLowerCase();
  if (key !== "z" && key !== "y") return;
  const active = document.activeElement;
  const isEditable = active && (
    active.tagName === "INPUT" || active.tagName === "TEXTAREA" ||
    active.tagName === "SELECT" || active.isContentEditable
  );
  if (isEditable) return;
  if (document.querySelector(".modal:not(.hidden)")) return;
  e.preventDefault();
  if (key === "z") performTaskUndo(); else performTaskRedo();
});

document.addEventListener("click", (e) => {
  const draggedBox = e.target.closest(".timeline-task");
  if (draggedBox && draggedBox === lastDragBox && Date.now() - lastDragEndAt < DRAG_CLICK_SUPPRESS_MS) {
    lastDragBox = null;
    return;
  }
  const cell = e.target.closest(".heat-cell");
  if (cell) {
    const detail = document.getElementById("heatmapDetail");
    if (detail) detail.textContent = `${cell.dataset.day}: 完了率 ${cell.dataset.rate}%`;
    return;
  }
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  switch (action) {
    case "tab": switchView(btn.dataset.tab); break;
    case "task:edit-open": openTaskModal(id, btn.dataset.day); break;
    case "task:edit-close": closeTaskEditModal(); break;
    case "task:edit-save": saveTaskEditFromForm(); break;
    case "task:modal-delete": deleteFromTaskModal(); break;
    case "task:select-focus":
      focusSelectedTaskId = id;
      switchView("focus");
      break;
    case "task:add-open": {
      let startMin = Math.ceil((new Date().getHours() * 60 + new Date().getMinutes()) / TIMELINE_SNAP_MIN) * TIMELINE_SNAP_MIN;
      startMin = Math.min(startMin, 24 * 60 - TIMELINE_SNAP_MIN);
      const endMin = Math.min(24 * 60, startMin + DEFAULT_NEW_TASK_MINUTES);
      openTaskCreateModal(selectedDate, formatHHMM(startMin), formatHHMM(endMin));
      break;
    }
    case "timeline:add-at": {
      const rect = btn.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const breakpoints = computeTimelineBreakpoints(
        [...getSelectedEntry().tasks].sort((a, b) => toMinutes(a.startTime) - toMinutes(b.startTime))
      );
      let startMin = Math.round(yToMinute(y, breakpoints) / TIMELINE_SNAP_MIN) * TIMELINE_SNAP_MIN;
      startMin = Math.max(0, Math.min(startMin, 24 * 60 - TIMELINE_SNAP_MIN));
      const endMin = Math.min(24 * 60, startMin + DEFAULT_NEW_TASK_MINUTES);
      openTaskCreateModal(selectedDate, formatHHMM(startMin), formatHHMM(endMin));
      break;
    }
    case "timeline:toggle-expand": {
      if (expandedTimelineTaskIds.has(id)) expandedTimelineTaskIds.delete(id);
      else expandedTimelineTaskIds.add(id);
      renderTodayView(); // スクロール位置を保ったまま、その場で開閉するだけ
      break;
    }
    case "timeline:toggle-expand-all": {
      const entry = getSelectedEntry();
      const compactIds = entry.tasks
        .filter(t => (toMinutes(t.endTime) - toMinutes(t.startTime)) * PX_PER_MIN < FULL_CONTENT_PX)
        .map(t => t.id);
      const allExpanded = compactIds.length > 0 && compactIds.every(cid => expandedTimelineTaskIds.has(cid));
      if (allExpanded) compactIds.forEach(cid => expandedTimelineTaskIds.delete(cid));
      else compactIds.forEach(cid => expandedTimelineTaskIds.add(cid));
      renderTodayView();
      break;
    }
    case "edit-tag-chip:toggle": {
      const tag = btn.dataset.tag;
      if (taskFormTags.has(tag)) taskFormTags.delete(tag); else taskFormTags.add(tag);
      btn.classList.toggle("selected");
      break;
    }
    case "date:prev": selectedDate = addDays(selectedDate, -1); renderTodayView({ autoscroll: true }); break;
    case "date:next": selectedDate = addDays(selectedDate, 1); renderTodayView({ autoscroll: true }); break;
    case "date:today": selectedDate = todayKey(); renderTodayView({ autoscroll: true }); break;
    case "cal:open": openCalendar(); break;
    case "cal:close": closeCalendar(); break;
    case "cal:prev-month":
      calendarViewMonth.month -= 1;
      if (calendarViewMonth.month < 1) { calendarViewMonth.month = 12; calendarViewMonth.year -= 1; }
      renderCalendarModal();
      break;
    case "cal:next-month":
      calendarViewMonth.month += 1;
      if (calendarViewMonth.month > 12) { calendarViewMonth.month = 1; calendarViewMonth.year += 1; }
      renderCalendarModal();
      break;
    case "cal:pick":
      selectedDate = btn.dataset.day;
      closeCalendar();
      renderTodayView({ autoscroll: true });
      break;
    case "tags:open": openTagsModal(); break;
    case "tags:close": closeTagsModal(); break;
    case "tags:add": {
      const parent = document.getElementById("tagParentSelect").value;
      const name = document.getElementById("tagNameInput").value;
      try {
        if (editingTagPath) {
          const newPath = buildTagPath(parent, name);
          renameTagCascade(state, editingTagPath, newPath);
          editingTagPath = null;
        } else {
          addTagDefinition(state, parent, name);
        }
        saveState(state);
        document.getElementById("tagNameInput").value = "";
        renderTagsModal();
        // タスク作成/編集モーダルはタグ管理モーダルと排他的にしか開けない
        // ため、その場のフォーム入力を気にせず現在表示中のタブだけ
        // 再描画すればよい(非表示のタブは次の切り替えで作り直される)。
        if (currentView === "today") renderTodayView();
        if (currentView === "stats") renderStatsView();
      } catch (err) {
        alert(err.message);
      }
      break;
    }
    case "stats:tag-filter-toggle": {
      const tag = btn.dataset.tag;
      if (statsTagFilter.has(tag)) statsTagFilter.delete(tag); else statsTagFilter.add(tag);
      renderStatsView();
      break;
    }
    case "tags:edit-start": startTagEdit(btn.dataset.tag); break;
    case "tags:cancel-edit": cancelTagEdit(); break;
    case "tags:delete": {
      const path = btn.dataset.tag;
      const targets = state.tags.filter(t => t === path || t.startsWith(path + "/"));
      const taskCount = countTasksUsingTags(state, targets);
      const msg = targets.length > 1
        ? `「${tagChipLabel(path)}」とその下位タグ${targets.length - 1}件(使用中のタスク${taskCount}件)を削除しますか?`
        : `「${tagChipLabel(path)}」を削除しますか?(使用中のタスク${taskCount}件)`;
      if (confirm(msg)) {
        removeTagCascade(state, path);
        if (editingTagPath && (editingTagPath === path || editingTagPath.startsWith(path + "/"))) {
          editingTagPath = null; // 編集中のタグ自身が削除された場合は編集モードを抜ける
        }
        saveState(state);
        renderTagsModal();
        if (currentView === "today") renderTodayView();
        if (currentView === "stats") renderStatsView();
      }
      break;
    }
    case "title-history:pick": {
      const titleInput = document.getElementById("editTaskTitle");
      if (titleInput) titleInput.value = btn.dataset.title;
      break;
    }
    case "start-focus": {
      const select = document.getElementById("focusTaskSelect");
      const taskId = select ? select.value : focusSelectedTaskId;
      if (!taskId) return;
      focusSelectedTaskId = taskId;
      startSession(taskId, "focus");
      break;
    }
    case "pause": pauseSession(); break;
    case "resume": resumeSession(); break;
    case "focus:delete-selected": {
      if (!id) return;
      if (hasSessionInProgress(id)) {
        alert("このタスクには実行中または中断中の集中セッションがあります。先に終了してください。");
        return;
      }
      if (confirm("このタスクを削除しますか?")) {
        recordUndoPoint();
        removeTask(state, todayKey(), id);
        focusSelectedTaskId = null;
        saveState(state);
        renderFocusView();
        renderHeaderStreak();
      }
      break;
    }
    case "finish": {
      const elapsed = getSessionElapsedFocusMinutes(state.activeSession);
      const msg = elapsed > 0
        ? `ここまでの実績(${elapsed}分)を記録して終了しますか?`
        : "終了しますか?";
      if (confirm(msg)) finishSession(elapsed);
      break;
    }
    case "task:undo": performTaskUndo(); break;
    case "task:redo": performTaskRedo(); break;
    case "export": doExport(); break;
    case "settings-open": openSettings(); break;
    case "settings-close": closeSettings(); break;
    case "settings-save": saveSettingsFromForm(); break;
  }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.matches('input[type="checkbox"][data-action="toggle"]')) {
    recordUndoPoint();
    toggleTaskComplete(state, selectedDate, el.dataset.id);
    saveState(state); renderAll();
  } else if (el.id === "focusTaskSelect") {
    const newId = el.value;
    // 一時停止中のセッションがあれば退避し、選んだタスクに中断状態が
    // あれば復元する(select自体はactiveSessionが実行中の間は無効化されて
    // いるため、実行中からここに来ることは無い)。
    if (state.activeSession && state.activeSession.paused) {
      state.pausedSessions[state.activeSession.taskId] = {
        kind: state.activeSession.kind,
        pausedRemainingMs: state.activeSession.pausedRemainingMs,
        dayKey: state.activeSession.dayKey,
      };
      state.activeSession = null;
    }
    if (!state.activeSession && state.pausedSessions[newId]) {
      const parked = state.pausedSessions[newId];
      state.activeSession = { taskId: newId, dayKey: parked.dayKey, kind: parked.kind, paused: true, pausedRemainingMs: parked.pausedRemainingMs, endAt: null };
      delete state.pausedSessions[newId];
    }
    focusSelectedTaskId = newId;
    saveState(state);
    renderFocusView();
  } else if (el.id === "importFile") {
    handleImportFile(el.files[0]);
  }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    const rollover = rolloverIfNeeded(state);
    if (rollover.rolled && selectedDate === rollover.prevDay) selectedDate = rollover.today;
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    if (state.activeSession) ensureTickTimer();
    tick();
    renderAll();
  }
});

// ==== 8. 初期化 ====
let state = loadState();
{
  const rollover = rolloverIfNeeded(state);
  if (rollover.rolled && selectedDate === rollover.prevDay) selectedDate = rollover.today;
}
document.addEventListener("DOMContentLoaded", () => {
  renderHeaderStreak();
  renderTodayView({ autoscroll: true }); // 起動時は必ず「今日」表示なので初回だけ自動スクロールする
  if (state.activeSession) ensureTickTimer();
  setInterval(() => { if (currentView === "today") renderNowBanner(); }, 30000);
});
</script>
